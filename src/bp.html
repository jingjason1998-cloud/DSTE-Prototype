<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战略解码 - DSTE战略管理平台</title>
    <link rel="stylesheet" href="../assets/css/main.css?v=2">
    <link rel="stylesheet" href="./styles/shell.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="../assets/js/main.js"></script>
    <script>
        (function() {
            const theme = DSTE.Storage.getString('dste-theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);

            // 主题与嵌入模式已由内联脚本与 shell-injector 统一处理
            if (new URLSearchParams(location.search).get('embed') === '1') {
                document.documentElement.setAttribute('data-embed', 'true');

                // 向父页面汇报高度，实现 iframe 自适应
                if (window !== window.top) {
                    let lastHeight = 0;
                    const reportHeight = () => {
                        const h = document.documentElement.scrollHeight || document.body.scrollHeight;
                        if (h !== lastHeight) {
                            lastHeight = h;
                            window.parent.postMessage({ type: 'dste-embed-resize', height: h }, '*');
                        }
                    };
                    reportHeight();
                    let timer;
                    window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(reportHeight, 100); });
                    if (typeof ResizeObserver !== 'undefined') {
                        const ro = new ResizeObserver(() => { clearTimeout(timer); timer = setTimeout(reportHeight, 100); });
                        ro.observe(document.documentElement);
                    }
                }
            }
        })();
    </script>
    <script>
    (function() {
        'use strict';

        // ===== 配置 =====
        const API_BASE = (() => {
            const host = window.location.hostname;
            if (host === 'localhost' || host === '127.0.0.1' || host === 'dste.jasonxspace.cc') {
                return DSTE.Storage.getString('dste_api_base') || '';
            }
            return ''; // 生产环境走同域 /api/ 代理
        })();

        const CAS_LANDING_PAGE = '/src/cockpit.html';
        const CAS_REDIRECT_HISTORY_KEY = 'dste-cas-redirect-history';
        const CAS_LOGIN_AT_KEY = 'dste-cas-login-at';

        const isEmbed = new URLSearchParams(location.search).get('embed') === '1';
        // TODO: 临时绕过 CAS，恢复时去掉 'dste.fineres.com'
        const isLocalDev = ['localhost', '127.0.0.1', 'dste.jasonxspace.cc', 'dste.fineres.com'].includes(window.location.hostname);

        function getCasServiceUrl() {
            return window.location.origin + CAS_LANDING_PAGE;
        }

        function isCasRedirectLoop() {
            try {
                const now = Date.now();
                const raw = sessionStorage.getItem(CAS_REDIRECT_HISTORY_KEY);
                const history = raw ? JSON.parse(raw) : [];
                const recent = history.filter(t => now - t < 10000);
                recent.push(now);
                sessionStorage.setItem(CAS_REDIRECT_HISTORY_KEY, JSON.stringify(recent));
                return recent.length > 2;
            } catch (e) {
                return false;
            }
        }

        function clearCasRedirectHistory() {
            try { sessionStorage.removeItem(CAS_REDIRECT_HISTORY_KEY); } catch (e) {}
        }

        function showAuthError(message) {
            console.error('[Auth]', message);
            const banner = document.createElement('div');
            banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#fee2e2;color:#991b1b;padding:12px 16px;text-align:center;font-size:14px;border-bottom:1px solid #fecaca;';
            banner.textContent = message;
            document.body.appendChild(banner);
        }

        // CAS 登录跳转
        function redirectToCasLogin() {
            if (isCasRedirectLoop()) {
                showAuthError('登录验证出现循环，请关闭页面后重新打开，或联系管理员。');
                return;
            }
            const service = encodeURIComponent(getCasServiceUrl());
            window.location.href = `https://passport.fanruan.com/cas/login?service=${service}`;
        }

        function setAuthToken(token, user) {
            DSTE.Storage.setString('dste-token', token);
            DSTE.Storage.setString('dste-user', user?.name || user?.username || '');
            sessionStorage.setItem('dste-user', user?.name || user?.username || '');
            sessionStorage.setItem(CAS_LOGIN_AT_KEY, String(Date.now()));
            clearCasRedirectHistory();
            updateUserUI();
        }

        // CAS 回调处理
        async function handleCasCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const ticket = urlParams.get('ticket');
            if (!ticket) return false;

            const cleanUrl = window.location.pathname + window.location.hash;
            history.replaceState(null, '', cleanUrl);

            try {
                const service = encodeURIComponent(getCasServiceUrl());
                const resp = await fetch(`${API_BASE}/api/auth/cas/login?ticket=${encodeURIComponent(ticket)}&service=${service}`);
                const json = await resp.json();
                if (json.success && json.token) {
                    setAuthToken(json.token, json.user);
                    return true;
                }
            } catch (e) {
                console.error('CAS callback failed:', e);
            }
            return false;
        }

        // 检查登录状态
        async function checkLoginStatus() {
            const token = DSTE.Storage.getString('dste-token');
            if (!token) return false;

            // 刚完成 CAS 登录的 30 秒内，信任本地 token，避免 KV 跨节点一致性导致误删 token 并触发循环
            try {
                const loginAt = parseInt(sessionStorage.getItem(CAS_LOGIN_AT_KEY) || '0', 10);
                if (Date.now() - loginAt < 30000) {
                    updateUserUI();
                    return true;
                }
            } catch (e) {}

            try {
                const resp = await fetch(`${API_BASE}/api/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (resp.ok) {
                    const json = await resp.json();
                    if (json.success && json.user) {
                        DSTE.Storage.setString('dste-user', json.user.name || json.user.username || '');
                        sessionStorage.setItem('dste-user', json.user.name || json.user.username || '');
                        updateUserUI();
                        return true;
                    }
                }
            } catch (e) {
                console.warn('Login status check failed:', e);
            }

            DSTE.Storage.remove('dste-token');
            DSTE.Storage.remove('dste-user');
            sessionStorage.removeItem('dste-user');
            sessionStorage.removeItem(CAS_LOGIN_AT_KEY);
            return false;
        }

        // 更新用户 UI
        function updateUserUI() {
            const user = DSTE.Storage.getString('dste-user') || sessionStorage.getItem('dste-user') || '张';
            const avatar = document.getElementById('user-avatar');
            const dropdownName = document.getElementById('user-dropdown-name');
            if (avatar) avatar.textContent = user.charAt(0);
            if (dropdownName) dropdownName.textContent = user;
        }

        // 登出
        async function logout() {
            const token = DSTE.Storage.getString('dste-token');
            if (token) {
                try {
                    await fetch(`${API_BASE}/api/auth/logout`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                } catch (e) {
                    console.warn('Logout API failed:', e);
                }
            }
            DSTE.Storage.remove('dste-token');
            DSTE.Storage.remove('dste-user');
            sessionStorage.removeItem('dste-user');
            sessionStorage.removeItem(CAS_LOGIN_AT_KEY);
            window.location.reload();
        }

        // 初始化认证
        async function initAuth() {
            // 嵌入模式下不强制登录（iframe 内由父页面控制）
            if (isEmbed) {
                updateUserUI();
                initUserDropdown();
                return;
            }

            // 1. 处理 CAS 回调
            const casHandled = await handleCasCallback();

            // 2. 检查登录状态
            if (!casHandled) {
                const isLoggedIn = await checkLoginStatus();
                if (!isLoggedIn && !isLocalDev) {
                    redirectToCasLogin();
                    return;
                }
            }

            updateUserUI();
            initUserDropdown();
        }

        // 用户下拉菜单事件
        function initUserDropdown() {
            const avatar = document.getElementById('user-avatar');
            const dropdown = document.getElementById('user-dropdown');
            const logoutBtn = document.getElementById('user-logout');
            if (avatar && dropdown) {
                avatar.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('open');
                });
                document.addEventListener('click', (e) => {
                    if (!avatar.contains(e.target) && !dropdown.contains(e.target)) {
                        dropdown.classList.remove('open');
                    }
                });
            }
            if (logoutBtn) {
                logoutBtn.addEventListener('click', logout);
            }
        }

        // 页面加载时初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAuth);
        } else {
            initAuth();
        }
    })();
    </script>
    <style>
        /* ===== OMP 专用 CSS 变量（与 cockpit.html 保持一致） ===== */
        :root {
            /* BSC 维度色 */
            --dim-financial: #1E3A5F;
            --dim-customer: #2E8B57;
            --dim-process: #D4A017;
            --dim-learning: #6B4C9A;
            /* KPI 层级色 */
            --kpi-level-0: #003087;
            --kpi-level-1: #005EB8;
            --kpi-level-2: #99C7E8;
            /* 画布背景 */
            --canvas-bg: var(--bg-page);
            --canvas-node-bg: var(--bg-card);
            --canvas-stroke: var(--border-color);
            --canvas-progress-track: var(--border-light);
            /* 辅助色 */
            --accent-pink: #EB2F96;
        }

        /* 表格横向滚动容器 */
        .table-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .table-scroll-wrapper table {
            min-width: 600px;
        }
        /* ===== 全局弹窗样式（omp_openModal，与 cockpit.html 保持一致） ===== */
        .omp-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .omp-modal { background: var(--bg-card); border-radius: 12px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .omp-modal-wide { max-width: 900px !important; }

        /* ===== 年度经营计划公用样式（与 cockpit.html 保持一致） ===== */
        .ap-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 10px; overflow: hidden; }
        .ap-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .ap-table th, .ap-table td { padding: 10px; border-bottom: 1px solid var(--border-light); }
        .ap-dim-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .ap-level-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
        .ap-level-marketing-line { background: color-mix(in srgb, var(--kpi-level-0) 15%, transparent); color: var(--kpi-level-0); }
        .ap-level-department { background: color-mix(in srgb, var(--kpi-level-1) 15%, transparent); color: var(--kpi-level-1); }
        .ap-level-team { background: color-mix(in srgb, var(--kpi-level-2) 15%, transparent); color: var(--kpi-level-2); }
        .ap-status-pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
        .ap-edit-panel { position: fixed; top: 0; right: 0; width: 360px; height: 100vh; background: var(--bg-card); border-left: 1px solid var(--border-color); z-index: 100; padding: 20px; overflow-y: auto; box-shadow: -4px 0 20px rgba(0,0,0,0.1); }
        .ap-section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px; margin-top: 24px; margin-bottom: 8px; }

        /* ===== BP 页面容器与周期栏 ===== */
        .bp-page-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .bp-cycle-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .bp-cycle-bar select {
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
        }
        /* 嵌入模式：周期由 cockpit 顶栏全局选择器控制，隐藏页内周期栏 */
        [data-embed="true"] .bp-cycle-bar {
            display: none !important;
        }
    </style>
    <script type="module" src="./lib/shell-injector.js"></script>
</head>
<body>
    <div class="app">
        <!-- 顶部导航 (与 cockpit.html 一致) -->
        <nav class="top-nav">
            <div style="display: flex; align-items: center;">
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="打开菜单"><span class="icon" data-icon="menu" data-icon-size="18"></span></button>
                <div class="top-nav-brand">
                    <div class="top-nav-logo">D</div>
                    <span class="top-nav-title">DSTE 战略管理平台</span>
                </div>
            </div>
            <ul class="top-nav-links" id="top-nav-links"></ul>
            <div class="top-nav-actions">
                <button class="icon-btn" id="theme-toggle" title="切换主题"><span class="icon" data-icon="moon" data-icon-size="18"></span></button>
                <button class="icon-btn" title="通知"><span class="icon" data-icon="notification" data-icon-size="18"></span></button>
                <div class="user-avatar" id="user-avatar" style="width:32px;height:32px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;cursor:pointer;">张</div>
                <div class="user-dropdown" id="user-dropdown">
                    <div class="user-dropdown-name" id="user-dropdown-name">张总</div>
                    <div class="user-dropdown-divider"></div>
                    <button class="user-dropdown-item" id="user-logout"><span class="icon" data-icon="logout" data-icon-size="14"></span> 退出登录</button>
                </div>
            </div>
        </nav>

        <div class="app-body">
            <!-- 侧边栏遮罩层 -->
            <div class="sidebar-overlay" id="sidebar-overlay"></div>

            <!-- 左侧边栏 (战略解码) -->
            <aside class="sidebar" id="sidebar"></aside>

            <!-- 内容区 -->
            <main class="content-area">
                <div class="bp-page-container">
                    <!-- 周期栏：仅 standalone 模式显示（embed 模式由 cockpit 顶栏全局选择器控制） -->
                    <div class="bp-cycle-bar" id="bp-cycle-bar">
                        <span>数据周期</span>
                        <select id="bp-cycle-select"></select>
                    </div>
                    <!-- BP 页面挂载点（战略指标库 / 年度经营计划，由 pages/bp/main.js 渲染） -->
                    <div id="bp-page-content"></div>
                </div>

                <footer class="footer">
                    <p>© 2024 帆软软件有限公司 | DSTE战略管理平台 | 让战略从纸上落到地上</p>
                </footer>
            </main>
        </div>
    </div>

    <script type="module" src="./pages/bp/main.js"></script>
</body>
</html>
