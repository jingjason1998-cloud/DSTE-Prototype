        } catch (err) {
          console.error('[OMP] 渲染人员配置视图失败:', err);
          return `
            <div style="padding:40px;text-align:center;color:var(--text-secondary);">
              <div style="font-size:48px;margin-bottom:16px;"><span class="icon" data-icon="warning" data-icon-size="14"></span>️</div>
              <div style="font-size:16px;font-weight:600;margin-bottom:8px;">人员配置视图加载失败</div>
              <div style="font-size:13px;color:var(--text-tertiary);margin-bottom:16px;">${escapeHtml(err.message || '未知错误')}</div>
              <button class="btn btn-primary" data-action="omp-switch-task-view" data-view="list">返回列表</button>
            </div>`;
        }
      }

      // ===== 战略洞察与专题共享工具函数（v1.2 页面拆分后） =====
      const SI_STORAGE_KEY_INSIGHTS = 'dste_insights_v1';
      const SI_STORAGE_KEY_TOPICS = 'dste_strategy_topics_v2';
      const SI_STORAGE_KEY_TOPICS_LEGACY = 'dste_strategy_topics_v1';

      // 战略专题 Repository 与同步基础设施
      const strategyTopicsRepo = new Repository('strategyTopics', {
        storageKey: SI_STORAGE_KEY_TOPICS,
        schema: 'array',
        version: 3,
        backupNamespace: 'strategyTopics',
        migrators: {
          3: (topics) => {
            const now = Date.now();
            return topics.map(t => ({
              ...t,
              version: t.version || 1,
              lastModified: t.lastModified || (t.updatedAt ? new Date(t.updatedAt).getTime() || now : now),
            }));
          }
        }
      });
      const strategyTopicsSyncQueue = getDefaultSyncQueue();
      const strategyTopicsExecutor = createPerItemExecutor();
      if (typeof window !== 'undefined') {
        strategyTopicsSyncQueue.bindAutoProcess(strategyTopicsExecutor);
      }

      const insightsSyncQueue = getDefaultSyncQueue();
      const insightsExecutor = createPerItemExecutor();
      if (typeof window !== 'undefined') {
        insightsSyncQueue.bindAutoProcess(insightsExecutor);
      }

      function siEscapeHtml(text) {
        if (text == null) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
      }

      function siRenderPerson(person) {
        if (!person) return '';
        if (typeof person === 'object') return person.displayName || person.name || person.email || JSON.stringify(person);
        return String(person);
      }

      function siSafeInsightId(id) {
        return typeof id === 'string' && /^ins_\d+_\d+$/.test(id);
      }

      function siSafeTopicId(id) {
        return typeof id === 'string' && /^st_\d+_\d+$/.test(id);
      }

      function siMigrateTopicsFromV1() {
        try {
          const legacy = DSTE.Storage.getString(SI_STORAGE_KEY_TOPICS_LEGACY);
          if (!legacy) return false;
          const topics = JSON.parse(legacy);
          if (!Array.isArray(topics)) return false;
          const migrated = topics.map(t => {
            const year = t.year || (t.startDate ? parseInt(t.startDate.split('-')[0], 10) : new Date().getFullYear());
            const item = {
              ...t,
              year,
              members: t.members || [],
              kmsUrl: t.kmsUrl || '',
              researchObjectives: t.researchObjectives || '',
              deliverables: t.deliverables || [],
              previousTopicId: t.previousTopicId || null,
              nextTopicId: t.nextTopicId || null,
              deleted: t.deleted === true
            };
            delete item.priority;
            delete item.budget;
            delete item.actualCost;
            delete item.dimension;
            delete item.progress;
            return item;
          });
          DSTE.Storage.set(SI_STORAGE_KEY_TOPICS, migrated);
          DSTE.Storage.remove(SI_STORAGE_KEY_TOPICS_LEGACY);
          return true;
        } catch (e) {
          console.error('[SI] v1 migration failed:', e);
          return false;
        }
      }

      function siMigrateTopicTypes() {
        const TYPE_MAP = { breakthrough: 'macro', incremental: 'customer', maintenance: 'self' };
        try {
          const topics = strategyTopicsRepo.get();
          if (!Array.isArray(topics)) return;
          let changed = false;
          const migrated = topics.map(t => {
            const newType = TYPE_MAP[t.type];
            if (newType) {
              changed = true;
              return { ...t, type: newType };
            }
            return t;
          });
          if (changed) strategyTopicsRepo.set(migrated);
        } catch (e) {
          console.warn('[SI] topic type migration failed:', e);
        }
      }

      // 清理已废弃字段（dimension 战略维度、progress 进度）
      function siMigrateRemoveDeprecatedFields() {
        try {
          const topics = strategyTopicsRepo.get();
          if (!Array.isArray(topics)) return;
          let changed = false;
          const migrated = topics.map(t => {
            if ('dimension' in t || 'progress' in t) {
              changed = true;
              const { dimension, progress, ...rest } = t;
              return rest;
            }
            return t;
          });
          if (changed) strategyTopicsRepo.set(migrated);
        } catch (e) {
          console.warn('[SI] deprecated field migration failed:', e);
        }
      }

      // 为专题补齐序号（seq）：按年份（t.year）分组各自从 1 编号。
      // 分组内存在缺失/非法 seq 时，按当前数组顺序将该分组重排为 1..N。
      function siMigrateTopicSeq() {
        try {
          const topics = strategyTopicsRepo.get();
          if (!Array.isArray(topics) || topics.length === 0) return;
          const byYear = {};
          topics.forEach(t => {
            const y = t.year || 'unknown';
            if (!byYear[y]) byYear[y] = [];
            byYear[y].push(t);
          });
          let changed = false;
          Object.values(byYear).forEach(group => {
            if (group.some(t => !Number.isFinite(t.seq) || t.seq < 1)) {
              group.forEach((t, i) => { t.seq = i + 1; });
              changed = true;
            }
          });
          if (changed) strategyTopicsRepo.set(topics);
        } catch (e) {
          console.warn('[SI] topic seq migration failed:', e);
        }
      }

      function siLoadInsights() {
        try {
          const data = DSTE.Storage.getString(SI_STORAGE_KEY_INSIGHTS);
          if (!data) return [];
          const parsed = JSON.parse(data);
          if (!Array.isArray(parsed)) return [];
          return parsed.filter(i => siSafeInsightId(i.id));
        } catch (e) {
          console.error('[SI] load insights failed:', e);
          return [];
        }
      }

      function siSaveInsights(insights) {
        try {
          DSTE.Storage.set(SI_STORAGE_KEY_INSIGHTS, insights);
        } catch (e) {
          console.error('[SI] save insights failed:', e);
          showToast('数据保存失败，可能是存储空间不足', 'error');
        }
      }

      function siPersistInsights(insights) {
        let oldInsights = [];
        try {
          const raw = DSTE.Storage.getString(SI_STORAGE_KEY_INSIGHTS);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) oldInsights = parsed;
          }
        } catch (e) {
          console.warn('[SI] read old insights failed:', e);
        }
        ensureLastModified(insights);
        insights.forEach(i => { if (i.version === undefined) i.version = 1; });
        siSaveInsights(insights);
        try {
          const { created, updated, deleted } = computeEntityDiff(oldInsights, insights, item => String(item.id));
          if (created.length || updated.length || deleted.length) {
            enqueuePerRecordSync('insights', { created, updated, deleted }, insightsExecutor, insightsSyncQueue);
          }
        } catch (e) {
          console.error('[SI] sync insights failed:', e);
        }
      }

      const topicsSwr = createSwrSync({
        key: 'strategy-topics',
        loadLocal: () => strategyTopicsRepo.get(),
        save: (data) => strategyTopicsRepo.set(data),
        fetchRemote: () => apiLoadArray('/api/strategy-topics'),
        merge: (local, remote) => mergeEntities(local, remote),
      });

      const insightsSwr = createSwrSync({
        key: 'insights',
        loadLocal: siLoadInsights,
        save: siSaveInsights,
        fetchRemote: () => apiLoadArray('/api/insights'),
        merge: (local, remote) => mergeEntities(local, remote, item => String(item.id)),
      });

      async function siLoadRemoteInsights(force = false) {
        try {
          const { updated } = await insightsSwr(force);
          if (updated && currentPage === 'sp/insights') {
            navigate('sp/insights', false);
          }
        } catch (e) {
          console.warn('[SI] load remote insights failed:', e.message);
        }
      }

      async function siLoadRemoteTopics(force = false) {
        try {
          const { updated } = await topicsSwr(force);
          if (updated && currentPage === 'sp/strategy-topics') {
            navigate('sp/strategy-topics', false);
          }
        } catch (e) {
          console.warn('[SI] load remote topics failed:', e.message);
        }
      }

      function siLoadTopics() {
        siMigrateTopicsFromV1();
        siMigrateTopicTypes();
        siMigrateRemoveDeprecatedFields();
        siMigrateTopicSeq();
        try {
          const topics = strategyTopicsRepo.get().filter(t => siSafeTopicId(t.id));
          const { topics: cleaned, changed } = siCleanupOrphanTopicChainLinks(topics);
          if (changed) {
            strategyTopicsRepo.set(cleaned);
          }
          return cleaned;
        } catch (e) {
          console.error('[SI] load topics failed:', e);
          return [];
        }
      }

      function siSaveTopics(topics) {
        try {
          strategyTopicsRepo.set(topics);
        } catch (e) {
          console.error('[SI] save topics failed:', e);
          showToast('数据保存失败，可能是存储空间不足', 'error');
        }
      }

      function siPersistTopics(topics) {
        const oldTopics = strategyTopicsRepo.getRaw();
        ensureLastModified(topics);
        topics.forEach(t => { if (t.version === undefined) t.version = 1; });
        siSaveTopics(topics);
        try {
          const { created, updated, deleted } = computeEntityDiff(oldTopics, topics);
          if (created.length || updated.length || deleted.length) {
            enqueuePerRecordSync('strategy-topics', { created, updated, deleted }, strategyTopicsExecutor, strategyTopicsSyncQueue);
          }
        } catch (e) {
          console.error('[SI] sync topics failed:', e);
        }
      }

      function siGetActiveTopics() {
        return siLoadTopics().filter(t => !t.deleted);
      }

      window.siResolveTopicForAiChat = function(idOrTopic) {
        if (idOrTopic && typeof idOrTopic === 'object') return idOrTopic;
        if (!siSafeTopicId(idOrTopic)) return null;
        return siGetActiveTopics().find(t => t.id === idOrTopic) || null;
      };

      function siGenerateTopicId() {
        return 'st_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      }

      function siCleanupOrphanTopicChainLinks(topics) {
        const activeIds = new Set(topics.map(t => t.id));
        let changed = false;
        topics.forEach(t => {
          if (t.previousTopicId && !activeIds.has(t.previousTopicId)) {
            t.previousTopicId = null;
            changed = true;
          }
          if (t.nextTopicId && !activeIds.has(t.nextTopicId)) {
            t.nextTopicId = null;
            changed = true;
          }
        });
        return { topics, changed };
      }

      function siParseDeliverablesBatch(text) {
        if (typeof text !== 'string') return [];
        return text.split(/\n|\r\n/).map(s => s.trim()).filter(s => s.length > 0);
      }

      // ===== 战略专题 AI 助手（规则引擎，降低外部 LLM 依赖）=====
      function siAnalyzeTopicQuality(topic) {
        const suggestions = [];
        let score = 100;

        const obj = String(topic.researchObjectives || '').trim();
        if (obj.length < 20) {
          suggestions.push('研究目标过于简短，建议补充背景、范围与预期产出。');
          score -= 15;
        } else if (!/[0-9一二三四五六七八九十百千万]|指标|目标|产出|交付/.test(obj)) {
          suggestions.push('研究目标可加入更具体的衡量指标或关键产出。');
          score -= 8;
        }

        const deliverables = topic.deliverables || [];
        if (deliverables.length === 0) {
          suggestions.push('尚未定义交付件，建议列出至少 1-2 个可验收的产出物。');
          score -= 15;
        } else if (deliverables.some(d => String(d).length < 4)) {
          suggestions.push('部分交付件描述过短，建议写清交付件内容与验收标准。');
          score -= 5;
        }

        const milestones = topic.milestones || [];
        if (milestones.length === 0) {
          suggestions.push('缺少里程碑，建议按阶段拆解关键节点以跟踪进度。');
          score -= 12;
        } else {
          const withDate = milestones.filter(m => m.date);
          if (withDate.length < milestones.length) {
            suggestions.push('部分里程碑未设定日期，建议补全日期便于甘特图展示。');
            score -= 6;
          }
        }

        const summary = String(topic.summary || '').trim();
        if (topic.status === 'closed' && summary.length < 20) {
          suggestions.push('已闭环专题的结项总结较短，建议沉淀核心结论与可复用经验。');
          score -= 10;
        }

        const hasKms = String(topic.kmsUrl || '').trim().length > 0;
        if (!hasKms) {
          suggestions.push('未填写 KMS 链接，建议关联知识库页面便于查阅背景资料。');
          score -= 5;
        }

        const insights = topic.insights || [];
        if (insights.length === 0) {
          suggestions.push('未关联战略洞察，建议关联至少一条相关洞察以体现输入来源。');
          score -= 8;
        }

        return {
          score: Math.max(0, Math.min(100, score)),
          suggestions,
          details: {
            objectiveLength: obj.length,
            deliverableCount: deliverables.length,
            milestoneCount: milestones.length,
            linkedInsights: insights.length,
            hasSummary: summary.length > 0,
            hasKms
          }
        };
      }

      function siSuggestNextYearObjectives(topic) {
        const objectives = String(topic.researchObjectives || '').trim();
        const deliverables = (topic.deliverables || []).join('、');
        const milestones = (topic.milestones || []).map(m => m.title).join('、');
        const year = (topic.year || new Date().getFullYear()) + 1;

        const lines = [
          `基于「${topic.name}」的${topic.year || ''}年研究成果，${year}年重点深化以下内容：`,
          ''
        ];

        if (objectives) {
          lines.push(`1. 延续上一年研究目标，将「${objectives.slice(0, 40)}${objectives.length > 40 ? '…' : ''}」从试点/规划阶段推进到规模化落地；`);
        }
        if (deliverables) {
          lines.push(`2. 围绕已产出交付件（${deliverables.slice(0, 50)}${deliverables.length > 50 ? '…' : ''}）建立长效机制，形成可复用的标准方案；`);
        }
        if (milestones) {
          lines.push(`3. 针对关键节点（${milestones.slice(0, 50)}${milestones.length > 50 ? '…' : ''}）开展复盘，输出下一年度行动计划与风险预案。`);
        }
        if (lines.length <= 3) {
          lines.push(`2. 明确${year}年的关键假设、验证路径与阶段性产出，确保专题可衡量、可闭环。`);
        }
        lines.push('', '建议补充量化指标、责任人与验收标准后保存。');
        return lines.join('\n');
      }

      function siRecommendInsightsForTopic(topic) {
        const insights = siLoadInsights();
        if (!insights.length) return [];
        const topicText = `${topic.name} ${topic.researchObjectives}`.toLowerCase();
        return insights
          .filter(i => !(topic.insights || []).includes(i.id))
          .map(i => {
            const text = `${i.title} ${i.content} ${i.source}`.toLowerCase();
            let score = 0;
            const topicWords = topicText.split(/\s+|\p{P}/u).filter(w => w.length >= 2);
            topicWords.forEach(w => { if (text.includes(w)) score += 1; });
            if (i.impact === 'high') score += 3;
            if (i.impact === 'medium') score += 1;
            return { insight: i, score };
          })
          .filter(item => item.score > 0)
          .sort((a, b) => b.score - a.score)
          .slice(0, 3)
          .map(item => item.insight.id);
      }

      window.siShowTopicQualityAnalysis = function(topicId) {
        if (!siSafeTopicId(topicId)) return;
        const topic = siGetActiveTopics().find(t => t.id === topicId);
        if (!topic) return;
        const result = siAnalyzeTopicQuality(topic);
        const suggestionsHtml = result.suggestions.length

      function siEnsureDefaultData() {
        const insights = siLoadInsights();
        if (insights.length === 0) {
          siSaveInsights(siDefaultInsights());
        }
        const topics = siLoadTopics();
        if (topics.length === 0) {
          const defaults = ensureLastModified(siDefaultTopics());
          defaults.forEach(t => { if (t.version === undefined) t.version = 1; });
          siSaveTopics(defaults);
        } else {
          // 合并缺失的默认历史专题
          const defaults = ensureLastModified(siDefaultTopics());
          defaults.forEach(t => { if (t.version === undefined) t.version = 1; });
          const existingIds = new Set(topics.map(t => t.id));
          const missing = defaults.filter(t => !existingIds.has(t.id));
          if (missing.length > 0) {
            const merged = [...topics, ...missing];
            siSaveTopics(merged);
          }
        }
      }

      // 调用一次以确保默认数据存在（幂等）
      siEnsureDefaultData();

                <div style="display:flex;gap:4px;flex-shrink:0;">
                  ${!linkedTopic ? `<button class="btn btn-sm btn-primary generate-topic-btn" data-insight-id="${i.id}" style="padding:4px 12px;font-size:12px;white-space:nowrap;">生成专题</button>` : ''}
                  <button class="btn btn-sm btn-secondary edit-insight-btn" data-insight-id="${i.id}" style="padding:4px 8px;font-size:12px;">编辑</button>
                  <button class="btn btn-sm btn-danger delete-insight-btn" data-insight-id="${i.id}" style="padding:4px 8px;font-size:12px;">删除</button>

        window.siFilterInsightsByType = function(type) {
          window._insightsSelectedView = (window._insightsSelectedView === type) ? 'all' : type;
          navigate('sp/insights');
        };

        return `
          ${renderBreadcrumb('战略洞察')}

            <h1 class="page-title">战略洞察</h1>
            <div class="page-actions">
              <button class="btn btn-primary" id="btn-new-insight">+ 新增洞察</button>
            </div>
          </div>

          <div id="insights-page-container">
            <div style="display:grid;grid-template-columns:repeat(5, 1fr);gap:12px;margin-bottom:20px;" class="five-views-grid">
              ${fiveViewsHtml}
            </div>

            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h3 class="text-md-primary" class="m-0">${selectedView === 'all' ? '全部洞察' : fiveViews.find(v => v.type === selectedView)?.label + '洞察'}</h3>
                <span class="text-sm-tertiary">共 ${filteredInsights.length} 条</span>
              </div>
              ${insightsHtml || '<div class="empty-state">暂无洞察，点击"新增洞察"开始记录</div>'}
            </div>
          </div>

          <div class="related-links">
            <div class="related-links-label">关联功能</div>
            <div class="related-links-row">
              <a class="related-link" href="#sp/strategy-topics" data-navigate="sp/strategy-topics"><span class="icon" data-icon="clipboard-text" data-icon-size="14"></span> 战略专题管理</a>
              <a class="related-link" href="#sp/strategy-map" data-navigate="sp/strategy-map"><span class="icon" data-icon="sp/strategy-map" data-icon-size="14"></span> 战略地图</a>
              <a class="related-link" href="#exe/business-topics" data-navigate="exe/business-topics"><span class="icon" data-icon="folders" data-icon-size="14"></span> 业务专题</a>
              <a class="related-link" href="knowledge.html"><span class="icon" data-icon="book-open" data-icon-size="14"></span> 十五五规划知识库</a>

      }

      // ===== 战略专题管理页面辅助函数 =====
      function siGetFilterArray(key) {
        const raw = window[key];
        if (Array.isArray(raw)) return raw;
        if (typeof raw === 'string' && raw) return [raw];
        return [];
      }

      function siTopicMatchesSearch(t, query) {
        if (!query) return true;
        const q = query.toLowerCase();
        const fields = [
          t.name,
          t.researchObjectives,
          Array.isArray(t.deliverables) ? t.deliverables.join(' ') : '',
          siRenderPerson(t.owner)
        ];
        return fields.some(f => String(f || '').toLowerCase().includes(q));
      }

      function siTopicMatchesFilters(t) {
        const statusFilter = siGetFilterArray('_strategyStatusFilter');
        const typeFilter = siGetFilterArray('_strategyTypeFilter');
        const searchQuery = window._strategySearchQuery || '';
        if (!siTopicMatchesSearch(t, searchQuery)) return false;
        if (statusFilter.length > 0 && !statusFilter.includes(t.status)) return false;
        if (typeFilter.length > 0 && !typeFilter.includes(t.type)) return false;
        return true;
      }

      function siApplyTopicSort(topics) {
        const key = window._strategySortKey || 'seq';
        const dir = window._strategySortDir || 'asc';
        const statusOrder = { insight: 0, planning: 1, execution: 2, closed: 3 };
        const typeOrder = { macro: 0, customer: 1, self: 2, competition: 3, breakthrough: 0, incremental: 1, maintenance: 2 };
        const sorted = [...topics];
        sorted.sort((a, b) => {
          let va, vb;
          switch (key) {
            case 'seq': va = Number.isFinite(a.seq) ? a.seq : Number.MAX_SAFE_INTEGER; vb = Number.isFinite(b.seq) ? b.seq : Number.MAX_SAFE_INTEGER; break;
            case 'name': va = a.name || ''; vb = b.name || ''; break;
            case 'type': va = typeOrder[a.type] ?? 99; vb = typeOrder[b.type] ?? 99; break;
            case 'owner': va = siRenderPerson(a.owner); vb = siRenderPerson(b.owner); break;
            case 'status': va = statusOrder[a.status] ?? 99; vb = statusOrder[b.status] ?? 99; break;
            case 'startDate': va = a.startDate || ''; vb = b.startDate || ''; break;
            case 'updatedAt': va = a.updatedAt || ''; vb = b.updatedAt || ''; break;
            default: va = a.updatedAt || ''; vb = b.updatedAt || '';
          }
          if (typeof va === 'string') {
            return dir === 'asc' ? va.localeCompare(vb, 'zh-CN') : vb.localeCompare(va, 'zh-CN');
          }
          return dir === 'asc' ? va - vb : vb - va;
        });
        return sorted;
      }

      window.siSetSearch = function(query) {
        window._strategySearchQuery = query;
      };

      window.siCommitSearch = function() {
        navigate('sp/strategy-topics');
      };

      window.siSetFilter = function(kind, value) {
        const key = kind === 'status' ? '_strategyStatusFilter' : kind === 'type' ? '_strategyTypeFilter' : null;
        if (!key) return;
        window[key] = value;
        navigate('sp/strategy-topics');
      };

      window.siSetSort = function(key) {
        const currentKey = window._strategySortKey || 'seq';
        const currentDir = window._strategySortDir || 'asc';
        if (currentKey === key) {
          window._strategySortDir = currentDir === 'asc' ? 'desc' : 'asc';
        } else {
          window._strategySortKey = key;
          window._strategySortDir = 'asc';
        }
        navigate('sp/strategy-topics');
      };

      // 上移/下移：在同一年份分组内与相邻项交换 seq，随后将该分组重排为 1..N
      window.siMoveTopicSeq = function(topicId, dir) {
        const topics = siLoadTopics();
        const target = topics.find(t => t.id === topicId);
        if (!target) return;
        const group = topics
          .filter(t => !t.deleted && t.year === target.year)
          .sort((a, b) => (Number.isFinite(a.seq) ? a.seq : Number.MAX_SAFE_INTEGER) - (Number.isFinite(b.seq) ? b.seq : Number.MAX_SAFE_INTEGER));
        const idx = group.findIndex(t => t.id === topicId);
        const swapIdx = idx + dir;
        if (idx < 0 || swapIdx < 0 || swapIdx >= group.length) return;
        const tmp = group[idx].seq;
        group[idx].seq = group[swapIdx].seq;
        group[swapIdx].seq = tmp;
        group.sort((a, b) => a.seq - b.seq).forEach((t, i) => { t.seq = i + 1; });
        siPersistTopics(topics);
        navigate('sp/strategy-topics');
      };

      window.siExportTopics = function() {
        const topics = siGetActiveTopics();
        const blob = new Blob([JSON.stringify(topics, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `strategy-topics-export-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('已导出战略专题 JSON 备份', 'success');
      };

        const filteredTopics = yearFiltered.filter(siTopicMatchesFilters);

        const topics = siApplyTopicSort(filteredTopics);

        // 按年份分组（基于筛选+排序后结果）
        const yearGroups = {};

        const visibleYears = (selectedYear === 'all' ? sortedYears : sortedYears.filter(y => y == selectedYear));

      // 甘特图渲染
      function siRenderGanttChart(topics, options) {
        const { year } = options || {};
        const statusColor = {
          insight: 'var(--primary)',
          planning: '#9ca3af',
          execution: 'var(--warning)',
          closed: 'var(--success)'
        };
        const currentYear = new Date().getFullYear();
        const currentDate = new Date().toISOString().slice(0, 10);

        // 时间范围
        let minDate, maxDate;
        if (topics.length > 0) {
          const startDates = topics.map(t => t.startDate).filter(Boolean);
          const endDates = topics.map(t => t.endDate).filter(Boolean);
          minDate = startDates.length ? startDates.sort()[0] : `${currentYear}-01-01`;
          maxDate = endDates.length ? endDates.sort().reverse()[0] : `${currentYear}-12-31`;
        } else {
          const y = year === 'all' ? currentYear : year;
          minDate = `${y}-01-01`;
          maxDate = `${y}-12-31`;
        }
        const start = new Date(minDate);
        const end = new Date(maxDate);
        const totalDays = Math.max(1, (end - start) / (1000 * 60 * 60 * 24));

        const monthLabels = [];
        const tickDates = [];
        let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
        while (cursor <= end) {
          const label = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}`;
          if (!monthLabels.includes(label)) monthLabels.push(label);
          tickDates.push(cursor.toISOString().slice(0, 10));
          cursor.setMonth(cursor.getMonth() + 1);
        }

        function dateToPercent(dateStr) {
          if (!dateStr) return 0;
          const d = new Date(dateStr);
          const days = (d - start) / (1000 * 60 * 60 * 24);
          return Math.max(0, Math.min(100, (days / totalDays) * 100));
        }

      // 年度深化链渲染
      function siRenderTopicChain(topic) {
        if (!topic.previousTopicId && !topic.nextTopicId) return '';
        const topics = siGetActiveTopics();
        const map = new Map(topics.map(t => [t.id, t]));
        const chain = [];
        let cur = topic;
        while (cur && cur.previousTopicId && map.has(cur.previousTopicId)) {
          cur = map.get(cur.previousTopicId);
          if (chain.includes(cur)) break;
          chain.unshift(cur);
        }
        chain.push(topic);
        cur = topic;
        while (cur && cur.nextTopicId && map.has(cur.nextTopicId)) {
          cur = map.get(cur.nextTopicId);
          if (chain.includes(cur)) break;
          chain.push(cur);
        }
        if (chain.length <= 1) return '';
        return `
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;border-radius:8px;background:var(--bg-page);">
            ${chain.map((t, idx) => `
              <div class="view-chain-topic-btn" data-topic-id="${t.id}" style="cursor:pointer;padding:8px 12px;border-radius:6px;background:${t.id === topic.id ? 'var(--primary)' : 'var(--bg-card)'};color:${t.id === topic.id ? 'var(--text-inverse)' : 'var(--text-primary)'};border:1px solid var(--border-color);font-size:13px;">
                <div style="font-weight:600;">${t.year}年</div>
                <div style="font-size:12px;opacity:0.9;">${siEscapeHtml(t.name)}</div>
              </div>
              ${idx < chain.length - 1 ? '<span style="font-size:16px;color:var(--text-tertiary);">→</span>' : ''}
            `).join('')}
          </div>
        `;
      }

          <div style="background:var(--bg-card);border-radius:10px;padding:20px;width:320px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">

              if (!name) return;
              const current = membersInput.value.trim();
              const existing = current ? current.split(/,|，/).map(s => s.trim()).filter(Boolean) : [];

                membersInput.value = existing.concat(name).join(', ');
              }
              try { api.destroy(); } catch (e) {}
              overlay.remove();
            }
          });
          pickerInput.focus();

          pickerInput.focus();

      window.siSaveTopicEdit = function() {
        const topicId = window._siTopicEditId;
        if (!topicId) return;
        const topics = siLoadTopics();
        const idx = topics.findIndex(t => t.id === topicId);
        if (idx === -1) return;

        const name = document.getElementById('edit-topic-name').value.trim();
        if (!name) {
          showToast('请填写专题名称', 'warning');
          return;
        }
        const researchObjectives = document.getElementById('edit-topic-researchObjectives').value.trim();
        if (!researchObjectives) {
          showToast('请填写研究目标', 'warning');
          return;
        }

        // 收集里程碑
        const milestoneRows = document.querySelectorAll('#edit-topic-milestones .milestone-row');
        const milestones = Array.from(milestoneRows).map(row => ({
          title: row.querySelector('.ms-title').value.trim(),
          date: row.querySelector('.ms-date').value,
          completed: row.querySelector('.ms-completed').checked
        })).filter(m => m.title);

        // 收集交付件
        const batchText = document.getElementById('edit-topic-deliverables-batch')?.value || '';
        const batchItems = siParseDeliverablesBatch(batchText);
        const deliverableRows = document.querySelectorAll('#edit-topic-deliverables .deliverable-row');
        const deliverables = [
          ...Array.from(deliverableRows).map(row => row.querySelector('.dv-text').value.trim()).filter(Boolean),
          ...batchItems
        ];

        // 收集关联洞察
        const insightSelect = document.getElementById('edit-topic-insights');
        const selectedInsights = insightSelect ? Array.from(insightSelect.selectedOptions).map(o => o.value) : [];

        // 成员解析
        const membersRaw = document.getElementById('edit-topic-members').value;
        const members = membersRaw.split(/,|，/).map(s => s.trim()).filter(Boolean);

        topics[idx] = {
          ...topics[idx],
          name,
          type: document.getElementById('edit-topic-type').value,
          owner: (window.getPersonValue ? window.getPersonValue('edit-topic-owner') : null) || document.getElementById('edit-topic-owner').value.trim() || topics[idx].owner,
          members,
          status: document.getElementById('edit-topic-status').value,
          startDate: document.getElementById('edit-topic-startDate').value,
          endDate: document.getElementById('edit-topic-endDate').value,
          kmsUrl: document.getElementById('edit-topic-kmsUrl').value.trim(),
          researchObjectives,
          deliverables,
          milestones,
          insights: selectedInsights,
          summary: document.getElementById('edit-topic-summary').value.trim(),
          updatedAt: new Date().toISOString().slice(0, 10)
        };

        siPersistTopics(topics);

        // 同步关联洞察的 linkedTopicId
        const allInsights = siLoadInsights();
        let insightsChanged = false;
        allInsights.forEach(insight => {
          const inTopic = selectedInsights.includes(insight.id);
          if (inTopic && insight.linkedTopicId !== topicId) {
            insight.linkedTopicId = topicId;
            insightsChanged = true;
          } else if (!inTopic && insight.linkedTopicId === topicId) {
            insight.linkedTopicId = null;
            insightsChanged = true;
          }
        });
        if (insightsChanged) siPersistInsights(allInsights);

        window._siTopicEditId = null;
        const overlay = document.getElementById('topic-edit-overlay');
        if (overlay) overlay.remove();
        navigate('sp/strategy-topics');
      };

      // 执行软删除
      window.siExecuteDeleteTopic = function(topicId) {
        if (!siSafeTopicId(topicId)) return;
        let topics = siLoadTopics();
        const idx = topics.findIndex(t => t.id === topicId);
        if (idx > -1) {
          topics[idx].deleted = true;
          topics[idx].updatedAt = new Date().toISOString().slice(0, 10);

          // 清理链上关联
          if (topics[idx].previousTopicId) {
            const prevIdx = topics.findIndex(t => t.id === topics[idx].previousTopicId);
            if (prevIdx > -1) topics[prevIdx].nextTopicId = null;
          }
          if (topics[idx].nextTopicId) {
            const nextIdx = topics.findIndex(t => t.id === topics[idx].nextTopicId);
            if (nextIdx > -1) topics[nextIdx].previousTopicId = null;
          }
          topics[idx].previousTopicId = null;
          topics[idx].nextTopicId = null;

          siPersistTopics(topics);

          // 清理关联洞察的 linkedTopicId
          const insights = siLoadInsights();
          let insightsChanged = false;
          insights.forEach(insight => {
            if (insight.linkedTopicId === topicId) {
              insight.linkedTopicId = null;
              insightsChanged = true;
            }
          });
          if (insightsChanged) siPersistInsights(insights);
        }
        const overlay = document.getElementById('delete-confirm-overlay');
        if (overlay) overlay.remove();
        navigate('sp/strategy-topics');
      };

      window.siSaveTopicCreate = function() {
        const name = document.getElementById('edit-topic-name').value.trim();
        if (!name) {
          showToast('请填写专题名称', 'warning');
          return;
        }
        const researchObjectives = document.getElementById('edit-topic-researchObjectives').value.trim();
        if (!researchObjectives) {
          showToast('请填写研究目标', 'warning');
          return;
        }

        const milestoneRows = document.querySelectorAll('#edit-topic-milestones .milestone-row');
        const milestones = Array.from(milestoneRows).map(row => ({
          title: row.querySelector('.ms-title').value.trim(),
          date: row.querySelector('.ms-date').value,
          completed: row.querySelector('.ms-completed').checked
        })).filter(m => m.title);

        const batchText = document.getElementById('edit-topic-deliverables-batch')?.value || '';
        const batchItems = siParseDeliverablesBatch(batchText);
        const deliverableRows = document.querySelectorAll('#edit-topic-deliverables .deliverable-row');
        const deliverables = [
          ...Array.from(deliverableRows).map(row => row.querySelector('.dv-text').value.trim()).filter(Boolean),
          ...batchItems
        ];

        const insightSelect = document.getElementById('edit-topic-insights');
        const selectedInsights = insightSelect ? Array.from(insightSelect.selectedOptions).map(o => o.value) : [];

        const yearSelect = document.getElementById('edit-topic-year');
        const year = yearSelect ? parseInt(yearSelect.value, 10) : new Date().getFullYear();

        const membersRaw = document.getElementById('edit-topic-members').value;
        const members = membersRaw.split(/,|，/).map(s => s.trim()).filter(Boolean);

        const fromInsightId = window._siTopicCreateFromInsightId;
        const fromChainId = window._siTopicCreateFromChainId;
        let summary = document.getElementById('edit-topic-summary').value.trim();
        let previousTopicId = null;
        if (fromInsightId) {
          const insight = siLoadInsights().find(i => i.id === fromInsightId);
          if (insight && !summary) summary = insight.content;
        }
        if (fromChainId) {
          previousTopicId = fromChainId;
        }

        // 序号：同年份现有专题（未删除）最大 seq + 1
        const topicsForSeq = siLoadTopics();
        const maxSeqInYear = topicsForSeq.reduce((m, t) => (!t.deleted && t.year === year && Number.isFinite(t.seq) ? Math.max(m, t.seq) : m), 0);

        const newTopic = {
          id: siGenerateTopicId(),
          name,
          type: document.getElementById('edit-topic-type').value,
          owner: (window.getPersonValue ? window.getPersonValue('edit-topic-owner') : null) || document.getElementById('edit-topic-owner').value.trim() || '',
          members,
          status: document.getElementById('edit-topic-status').value,
          startDate: document.getElementById('edit-topic-startDate').value,
          endDate: document.getElementById('edit-topic-endDate').value,
          kmsUrl: document.getElementById('edit-topic-kmsUrl').value.trim(),
          researchObjectives,
          deliverables,
          year,
          milestones,
          insights: selectedInsights,
          summary,
          previousTopicId,
          nextTopicId: null,
          deleted: false,
          seq: maxSeqInYear + 1,
          createdAt: new Date().toISOString().slice(0, 10),
          updatedAt: new Date().toISOString().slice(0, 10)
        };

        let topics = topicsForSeq;
        topics.push(newTopic);

        // 回写下一年深化链
        if (previousTopicId) {
          const prevIdx = topics.findIndex(t => t.id === previousTopicId);
          if (prevIdx > -1) {
            topics[prevIdx].nextTopicId = newTopic.id;
            topics[prevIdx].updatedAt = newTopic.updatedAt;
          }
        }

        siPersistTopics(topics);

        // 回写 linkedTopicId
        selectedInsights.forEach(insightId => {
          const insights = siLoadInsights();
          const idx = insights.findIndex(i => i.id === insightId);
          if (idx > -1) {
            insights[idx].linkedTopicId = newTopic.id;
            siPersistInsights(insights);
          }
        });

        window._siTopicEditId = null;
        window._siTopicCreateFromInsightId = null;
        window._siTopicCreateFromChainId = null;
        const overlay = document.getElementById('topic-edit-overlay');
        if (overlay) overlay.remove();
        navigate('sp/strategy-topics');
      };

        window._siTopicCreateFromChainId = topicId;
        siOpenTopicCreate({
          name: topic.name + `（${topic.year + 1}）`,
          researchObjectives: topic.researchObjectives,
          members: topic.members,
          kmsUrl: topic.kmsUrl,
          type: topic.type,
          year: topic.year + 1,
          status: 'planning',
          previousTopicId: topic.id
        });
      };

      window.siOpenInsightEdit = function(insightId) {

          content: '',

          confidence: 80,
          impact: 'medium'

        if (!insight) return;
        window._siInsightEditId = isCreate ? null : insightId;

        const typeOptions = [
          ['trend', '<span class="icon" data-icon="chart-line-up" data-icon-size="14"></span> 看趋势'],
          ['customer', '<span class="icon" data-icon="users" data-icon-size="14"></span> 看客户'],
          ['competitor', '<span class="icon" data-icon="sword" data-icon-size="14"></span> 看竞争'],

      window.siSaveInsightEdit = function() {
        const title = document.getElementById('edit-insight-title').value.trim();
        const content = document.getElementById('edit-insight-content').value.trim();
        if (!title || !content) {
          showToast('请填写标题和内容', 'warning');
          return;
        }

        const insights = siLoadInsights();
        const type = document.getElementById('edit-insight-type').value;
        const source = document.getElementById('edit-insight-source').value.trim();
        const confidence = parseInt(document.getElementById('edit-insight-confidence').value, 10) || 80;
        const impactEl = document.querySelector('input[name="edit-insight-impact"]:checked');
        const impact = impactEl ? impactEl.value : 'medium';

        if (window._siInsightEditId) {
          const idx = insights.findIndex(i => i.id === window._siInsightEditId);
          if (idx > -1) {
            insights[idx] = { ...insights[idx], type, title, content, source, confidence, impact };
          }
        } else {
          insights.push({
            id: siGenerateInsightId(),
            type, title, content, source, confidence, impact,
            linkedTopicId: null,
            createdAt: new Date().toISOString().slice(0, 10)
          });
        }

        siPersistInsights(insights);
        window._siInsightEditId = null;
        const overlay = document.getElementById('insight-edit-overlay');
        if (overlay) overlay.remove();
        navigate('sp/insights');
      };

      window.siConfirmDeleteInsight = function(insightId) {
        if (!siSafeInsightId(insightId)) return;
        const insights = siLoadInsights();
        const insight = insights.find(i => i.id === insightId);
        if (!insight) return;

        const linkedTopic = insight.linkedTopicId ? siGetActiveTopics().find(t => t.id === insight.linkedTopicId) : null;
        const warningText = linkedTopic
          ? `该洞察已生成专题「${linkedTopic.name}」，删除后将解除关联。`
          : '删除后不可恢复，是否确认？';

        const overlay = document.createElement('div');
        overlay.id = 'insight-delete-confirm-overlay';
        overlay.className = 'omp-modal-overlay';
        overlay.innerHTML = `
          <div id="insight-delete-confirm-modal" style="background:var(--bg-card);border-radius:12px;max-width:400px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;">
            <div style="font-size:48px;margin-bottom:12px;"><span class="icon" data-icon="warning" data-icon-size="14"></span>️</div>
            <h3 style="margin:0 0 8px;font-size:18px;">确认删除洞察?</h3>
            <p style="margin:0 0 20px;font-size:14px;color:var(--text-secondary);">「${siEscapeHtml(insight.title)}」${warningText}</p>
            <div style="display:flex;gap:10px;justify-content:center;">
              <button class="btn btn-secondary" onclick="document.getElementById('insight-delete-confirm-overlay').remove()">取消</button>
              <button class="btn btn-danger" onclick="window.siExecuteDeleteInsight('${insightId}')">确认删除</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
      };

      window.siExecuteDeleteInsight = function(insightId) {
        if (!siSafeInsightId(insightId)) return;
        let insights = siLoadInsights();
        const insight = insights.find(i => i.id === insightId);
        if (!insight) return;

        // 清理关联专题
        if (insight.linkedTopicId) {
          const topics = siLoadTopics();
          const topicIdx = topics.findIndex(t => t.id === insight.linkedTopicId);
          if (topicIdx > -1) {
            topics[topicIdx].insights = (topics[topicIdx].insights || []).filter(id => id !== insightId);
            topics[topicIdx].updatedAt = new Date().toISOString().slice(0, 10);
            siPersistTopics(topics);
          }
        }

        insights = insights.filter(i => i.id !== insightId);
        siPersistInsights(insights);

        const overlay = document.getElementById('insight-delete-confirm-overlay');
        if (overlay) overlay.remove();
        navigate('sp/insights');
      };

      // 从洞察生成专题
      window.siGenerateTopicFromInsight = function(insightId) {
        if (!siSafeInsightId(insightId)) return;
        const insights = siLoadInsights();
        const insight = insights.find(i => i.id === insightId);
        if (!insight) return;
        window._siTopicCreateFromInsightId = insightId;
        siOpenTopicCreate({
          name: insight.title,
          summary: insight.content,
          researchObjectives: insight.content,
          insights: [insight.id],
          status: 'insight'
        });
      };

      // ===== 事件委托绑定 =====
      function siBindStrategyEvents() {
        document.addEventListener('click', (e) => {
          const target = e.target.closest('[data-insight-id], [data-topic-id], #btn-new-insight, #btn-new-topic');
          if (!target) return;

          // 洞察卡片过滤
          const viewCard = e.target.closest('.insight-card');
          if (viewCard && viewCard.dataset.view) {
            e.preventDefault();
            window.siFilterInsightsByType(viewCard.dataset.view);
            return;
          }

          const insightId = target.dataset.insightId;
          const topicId = target.dataset.topicId;

          if (target.id === 'btn-new-insight') {
            window.siOpenInsightEdit();
          } else if (target.classList.contains('edit-insight-btn')) {
            window.siOpenInsightEdit(insightId);
          } else if (target.classList.contains('delete-insight-btn')) {
            window.siConfirmDeleteInsight(insightId);
          } else if (target.classList.contains('generate-topic-btn')) {
            window.siGenerateTopicFromInsight(insightId);
          } else if (target.id === 'btn-new-topic') {
            window.siOpenTopicCreate();
          } else if (target.classList.contains('view-topic-btn')) {
            window.siViewTopicDetail(topicId);
          } else if (target.classList.contains('edit-topic-btn')) {
            window.siOpenTopicEdit(topicId);
          } else if (target.classList.contains('delete-topic-btn')) {
            window.siConfirmDeleteTopic(topicId);
          } else if (target.classList.contains('next-year-deepening-btn')) {
            window.siOpenNextYearDeepening(topicId);
          } else if (target.classList.contains('view-chain-topic-btn') || target.classList.contains('chain-badge')) {
            window.siViewTopicDetail(topicId);
          } else if (target.classList.contains('gantt-bar') || target.classList.contains('gantt-milestone')) {
            window.siViewTopicDetail(topicId);
          }
        });
      }

      function renderAiStatsCards(totals, latency) {
        const card = (label, value, sub, color) => `
          <div style="flex:1;min-width:160px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:16px;">
            <div class="text-xs-tertiary">${label}</div>
            <div style="font-size:26px;font-weight:600;color:${color};margin:6px 0 2px;">${value}</div>
            <div class="text-xs-tertiary">${sub}</div>
          </div>`;
        const successColor = totals.successRate === null ? 'var(--text-secondary)' : (totals.successRate >= 95 ? 'var(--success)' : totals.successRate >= 85 ? 'var(--warning)' : 'var(--danger)');
        return `<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
          ${card('AI 请求数', totals.requests, '近 14 天（chat/agenda/tool）', 'var(--primary)')}
          ${card('成功率', totals.successRate === null ? '—' : totals.successRate + '%', `失败 ${totals.errors} 次`, successColor)}
          ${card('P95 延迟', latency.p95Ms === null ? '—' : (latency.p95Ms / 1000).toFixed(1) + 's', `平均 ${latency.avgMs === null ? '—' : (latency.avgMs / 1000).toFixed(1) + 's'} · ${latency.samples} 样本`, 'var(--info)')}
          ${card('用户反馈', `👍 ${totals.feedbackUp} / 👎 ${totals.feedbackDown}`, '近 14 天', 'var(--text-secondary)')}
        </div>`;
      }

      function renderAiStatsDist(title, dist, colorFn) {
        const entries = Object.entries(dist || {}).sort((a, b) => b[1] - a[1]);
        if (entries.length === 0) return '';
        const max = entries[0][1];
        const rows = entries.map(([k, v]) => `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <div style="width:160px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(k)}">${escapeHtml(k)}</div>
            <div style="flex:1;height:8px;background:var(--bg-secondary, rgba(0,0,0,0.06));border-radius:4px;overflow:hidden;">
              <div style="width:${Math.max(2, Math.round(v / max * 100))}%;height:100%;background:${colorFn ? colorFn(k) : 'var(--primary)'};"></div>
            </div>
            <div style="width:36px;text-align:right;font-size:12px;">${v}</div>
          </div>`).join('');
        return `<div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:16px;margin-bottom:16px;">
          <div style="font-weight:600;margin-bottom:12px;">${title}</div>${rows}
        </div>`;
      }

      function renderAiStatsDaily(daily) {
        const days = Object.keys(daily || {}).sort();
        if (days.length === 0) return '';
        const rows = days.map((d) => {
          const it = daily[d];
          const rate = it.requests + it.errors > 0 ? Math.round(it.requests / (it.requests + it.errors) * 100) : null;
          return `<tr>
            <td style="padding:6px 12px;font-size:12px;">${d}</td>
            <td style="padding:6px 12px;font-size:12px;text-align:right;">${it.requests}</td>
            <td style="padding:6px 12px;font-size:12px;text-align:right;color:${it.errors > 0 ? 'var(--danger)' : 'inherit'};">${it.errors}</td>
            <td style="padding:6px 12px;font-size:12px;text-align:right;">${rate === null ? '—' : rate + '%'}</td>
          </tr>`;
        }).join('');
        return `<div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:16px;margin-bottom:16px;">
          <div style="font-weight:600;margin-bottom:12px;">每日趋势</div>
          <table style="width:100%;border-collapse:collapse;">
            <thead><tr style="border-bottom:1px solid var(--border-color);">
              <th style="padding:6px 12px;font-size:12px;text-align:left;">日期</th>
              <th style="padding:6px 12px;font-size:12px;text-align:right;">请求</th>
              <th style="padding:6px 12px;font-size:12px;text-align:right;">失败</th>
              <th style="padding:6px 12px;font-size:12px;text-align:right;">成功率</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      }

      async function loadAiStatsData() {
        const el = document.getElementById('ai-stats-body');
        if (!el) return;
        el.innerHTML = '<div class="text-xs-tertiary" style="padding:24px 0;">加载中…</div>';
        try {
          const resp = await fetch('/api/ai/stats?days=14');
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const stats = await resp.json();
          if (!stats.success) throw new Error(stats.error || '加载失败');
          const errColor = (k) => k === 'ratelimit' ? 'var(--warning)' : 'var(--danger)';
          el.innerHTML =
            renderAiStatsCards(stats.totals, stats.latency) +
            renderAiStatsDist('错误分类（errorType）', stats.errorTypeDist, errColor) +
            renderAiStatsDist('端点调用分布', stats.endpointDist) +
            renderAiStatsDaily(stats.daily);
        } catch (err) {
          el.innerHTML = `<div style="color:var(--danger);padding:24px 0;">AI 观测数据加载失败：${escapeHtml(err.message || '未知错误')}</div>`;
        }
      }

      function omp_openMonthlyProgressModal(taskId, month) {

        const year = getCurrentCycle().year;
        const isSummary = omp_isSummaryMonth(month);
        const monthNum = isSummary ? null : parseInt(month.split('-')[1], 10);
        const monthLabel = month === 'H1' ? `${year} 上半年 (H1)` : month === 'YEAR' ? `${year} 年终` : `${year}年${monthNum}月`;
        const existing = omp_getMonthlyRecord(taskId, month);
        window._ompState.editingMonthlyTaskId = taskId;
        window._ompState.editingMonthlyMonth = month;
        window._ompState.editingMonthlyRecordId = existing ? existing.id : null;

        const summaryDefaultDate = month === 'H1' ? `${year}-09-30` : `${year}-12-31`;
        const defaultDate = existing ? existing.date : (isSummary ? summaryDefaultDate : omp_getLastDayOfMonth(year, monthNum));
        const defaultProgress = existing ? existing.progress : (task.progress || 0);
        const defaultContent = existing ? existing.content : '';
        const defaultProblems = existing ? existing.problems : '';
        const defaultNextPlan = existing ? existing.nextPlan : '';
        const defaultReporter = existing ? existing.reporter : (task.owner || '');

        const deleteBtn = existing

          : '';

        const progressLabel = isSummary ? '整体进度 (%)' : '进度 (%)';
        const contentLabel = isSummary ? '总结内容 *' : '关键进展 *';
        const contentRows = isSummary ? 6 : 3;
        const topRow = isSummary
          ? `<input type="hidden" id="omp-monthly-date" value="${defaultDate}"><div class="grid-full-width"><label class="form-label">${progressLabel}</label><input type="number" id="omp-monthly-progress" value="${defaultProgress}" min="0" max="100" class="form-input-compact"></div>`
          : `<div><label class="form-label">记录日期 *</label><input type="date" id="omp-monthly-date" value="${defaultDate}" class="form-input-compact"></div><div><label class="form-label">${progressLabel}</label><input type="number" id="omp-monthly-progress" value="${defaultProgress}" min="0" max="100" class="form-input-compact"></div>`;

          <div class="grid-2-col" class="gap-4">

            ${nextPlanField}
            <div class="grid-full-width"><label class="form-label">记录人</label><input type="text" id="omp-monthly-reporter" value="${escapeHtml(defaultReporter)}" class="form-input-compact"></div>
          </div>
          <div class="modal-footer">
            ${deleteBtn}

        `);

      function omp_saveMonthlyProgress() {
        const taskId = window._ompState.editingMonthlyTaskId;
        const month = window._ompState.editingMonthlyMonth;
        const existingId = window._ompState.editingMonthlyRecordId;
        if (!taskId || !month) return;
        const isSummary = omp_isSummaryMonth(month);

        const date = document.getElementById('omp-monthly-date')?.value;
        const progress = parseInt(document.getElementById('omp-monthly-progress')?.value, 10) || 0;
        const content = document.getElementById('omp-monthly-content')?.value?.trim() || '';
        const problems = document.getElementById('omp-monthly-problems')?.value?.trim() || '';
        const nextPlan = document.getElementById('omp-monthly-next-plan')?.value?.trim() || '';
        const reporter = document.getElementById('omp-monthly-reporter')?.value?.trim() || '';

        if (!date || !content) {
          showToast(isSummary ? '请填写总结内容' : '请填写记录日期和关键进展', 'warning');
          return;
        }

        const records = omp_load('progressRecords');
        const recordMonth = isSummary ? month : omp_formatMonth(date);
        const recordId = existingId || `rec_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
        const newRecord = {
          id: recordId,
          taskId,
          month: recordMonth,
          date,
          progress: Math.min(100, Math.max(0, progress)),
          content,
          problems,
          nextPlan,
          reporter,
        };

        // 覆盖同 taskId + month 的记录（业务语义：每月/每总结一条）
        const filtered = records.filter(r => !(r.taskId === taskId && r.month === month));
        filtered.push(newRecord);
        omp_save('progressRecords', filtered);

        // 联动更新任务总进度（总结记录不参与聚合）
        omp_syncTaskProgressFromRecords(taskId);

        document.getElementById('omp-active-modal')?.remove();
        showToast(isSummary ? '总结已保存' : '月度进展已保存', 'success');
        navigate('exe/tasks');
      }

      function omp_deleteMonthlyProgress(recordId) {
        if (!confirm('确定要删除这条月度进展记录吗？')) return;
        const records = omp_load('progressRecords');
        const record = records.find(r => r.id === recordId);
        if (!record) return;
        const taskId = record.taskId;
        const filtered = records.filter(r => r.id !== recordId);
        omp_save('progressRecords', filtered);
        omp_syncTaskProgressFromRecords(taskId);
        document.getElementById('omp-active-modal')?.remove();
        showToast('月度进展已删除', 'success');
        navigate('exe/tasks');
      }

        window._ompState.monthlyFilter = value || 'all';
        navigate('exe/tasks');
      }

            <div><label class="form-label">周期</label><input type="text" id="omp-kpi-period" value="${getCurrentCycle().year}-Q1" class="form-input-compact"></div>

          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="document.getElementById('omp-active-modal').remove(); window._ompState.editingKpiId = null;">取消</button>
            <button class="btn btn-primary" onclick="window.omp_saveKpi()">保存</button>
          </div>`);

      function omp_viewTaskModal(taskId) {
        const tasks = omp_load('tasks');
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;
        window._ompState.viewingTaskId = taskId;
        window._ompState.taskViewActiveTab = window._ompState.taskViewActiveTab || 'basic';
        const tabContent = omp_renderTaskViewTabContent(task);
        const tabs = [
          { id: 'basic', label: '基本信息' },
          { id: 'milestones', label: '里程碑' },
          { id: 'subtasks', label: `子任务 (${omp_getSubtasks(taskId).length})` },
          { id: 'resources', label: '资源' },
        ];
        const tabHtml = `
          <div class="flex-row gap-0 border-bottom-default mb-5">
            ${tabs.map(t => `
              <button type="button" class="omp-task-view-tab ${window._ompState.taskViewActiveTab === t.id ? 'active' : ''}" onclick="window.omp_switchTaskViewTab('${t.id}')" style="padding:10px 16px;font-size:13px;background:transparent;border:none;border-bottom:2px solid ${window._ompState.taskViewActiveTab === t.id ? 'var(--primary)' : 'transparent'};color:${window._ompState.taskViewActiveTab === t.id ? 'var(--primary)' : 'var(--text-secondary)'};cursor:pointer;">${t.label}</button>
            `).join('')}
          </div>`;
        omp_openModal('工作详情', `
          ${tabHtml}
          <div id="omp-task-view-tab-content">${tabContent}</div>
          <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:16px;border-top:1px solid var(--border-color);">
            <button class="btn btn-secondary" data-modal-action="modal-close">关闭</button>
            <button class="btn btn-primary" onclick="document.getElementById('omp-active-modal').remove(); window.omp_editTask('${task.id}')">编辑</button>
          </div>`, true);
      }

      function omp_renderTaskViewTabContent(task) {
        const taskId = task.id;
        const milestones = omp_load('milestones').filter(m => m.taskId === taskId);
        const records = omp_load('progressRecords').filter(r => r.taskId === taskId);
        const kpis = omp_load('kpiInstances');
        const typeLabels = { strategic: '战略举措', improvement: '业务改进', capability: '能力建设', risk_response: '风险应对', meeting_resolution: '会议决议' };
        const statusColors = { planning: 'var(--text-tertiary)', active: 'var(--success)', at_risk: 'var(--warning)', delayed: 'var(--danger)', done: 'var(--primary)', closed: 'var(--text-tertiary)' };
        const statusLabels = { planning: '规划中', active: '进行中', at_risk: '有风险', delayed: '已延期', done: '已完成', closed: '已关闭' };
        const activeTab = window._ompState.taskViewActiveTab || 'basic';

        if (activeTab === 'milestones') {
          const msHtml = milestones.map(m => `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light);">
              <span class="text-md-semibold">${m.status === 'completed' ? icon('check', { size: 16 }) : m.status === 'delayed' ? icon('warning', { size: 16 }) : icon('circle', { size: 16 })}</span>
              <div class="flex-1"><div class="text-base-medium">${m.name}</div><div class="text-xs-tertiary">计划: ${m.planDate}${m.actualDate ? ' · 实际: ' + m.actualDate : ''}</div></div>
              <span style="font-size:12px;padding:2px 8px;border-radius:4px;background:${m.status === 'completed' ? 'var(--success-bg)' : 'var(--bg-page)'};color:${m.status === 'completed' ? 'var(--success)' : m.status === 'delayed' ? 'var(--danger)' : 'var(--text-secondary)'}">${m.status === 'completed' ? '已完成' : m.status === 'delayed' ? '已延期' : '待办'}</span>
            </div>`).join('') || '<div style="padding:20px;text-align:center;color:var(--text-tertiary);">暂无里程碑</div>';
          const recHtml = records.map(r => `
            <div style="padding:12px;background:var(--bg-page);border-radius:8px;margin-bottom:8px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><span style="font-size:13px;font-weight:600;">进度 ${r.progress}%</span><span class="text-xs-tertiary">${r.date} · ${r.reporter}</span></div>
              <div class="text-sm-secondary">${r.content}</div>${r.problems ? `<div style="margin-top:6px;font-size:12px;color:var(--danger);"><span class="icon" data-icon="warning" data-icon-size="14"></span>️ ${r.problems}</div>` : ''}
            </div>`).join('') || '<div style="padding:20px;text-align:center;color:var(--text-tertiary);">暂无进度记录</div>';
          return `
            <div class="mb-5"><div class="section-title"><span class="icon" data-icon="push-pin" data-icon-size="14"></span> 里程碑</div><div style="border:1px solid var(--border-light);border-radius:8px;padding:0 12px;">${msHtml}</div></div>
            <div class="mb-5"><div class="section-title"><span class="icon" data-icon="file-text" data-icon-size="14"></span> 进度记录</div><div>${recHtml}</div></div>`;
        }

        if (activeTab === 'subtasks') {
          const subtasks = omp_getSubtasks(taskId);
          const subRows = subtasks.map((s, idx) => {
            const ownerName = escapeHtml(window.renderPerson ? window.renderPerson(s.owner) : (s.owner || ''));
            const memberCount = (s.members || []).filter(Boolean).length;
            return `
              <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-light);border-radius:8px;margin-bottom:8px;background:var(--bg-card);">
                <div style="min-width:24px;text-align:center;font-size:13px;font-weight:600;color:var(--text-secondary);">${idx + 1}.</div>
                <div class="flex-1" class="min-width-0">
                  <div style="font-size:13px;font-weight:600;color:var(--text-primary);">${escapeHtml(s.name)}</div>
                  <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">负责人: ${ownerName} · 成员 ${memberCount} 人${s.target ? ' · 目标: ' + escapeHtml(s.target) : ''}</div>
                </div>
                <button class="btn btn-sm btn-secondary" data-action="omp-edit-subtask" data-id="${s.id}" class="badge-sm">编辑</button>
              </div>`;
          }).join('');
          return `
            <div class="mb-4">
              <div class="section-title">子任务 (${subtasks.length})</div>
              ${subtasks.length > 0 ? subRows : '<div style="padding:30px;text-align:center;color:var(--text-tertiary);">暂无子任务</div>'}
            </div>`;
        }

        if (activeTab === 'resources') {
          const ms = (task.members || []).filter(Boolean);
          return `
            <div class="mb-4">
              <div class="section-title">资源成员</div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;">
                ${ms.length > 0 ? ms.map(m => `
                  <div style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border-light);border-radius:20px;background:var(--bg-page);">
                    ${renderAvatar(m, 22, resolvePersonDisplayName(m))}
                    <span class="text-sm-primary">${escapeHtml(resolvePersonDisplayName(m))}</span>
                  </div>`).join('') : '<div class="text-tertiary">暂无成员，请在「人员配置」视图中拖拽分配</div>'}
              </div>
            </div>`;
        }

        // basic tab
        const primary = omp_getPrimaryKpiAssociation(task);
        const supporting = omp_getSupportingKpiAssociations(task);
        const primaryText = primary ? `${omp_getKpiAssociationDisplayName(primary)} (${omp_getKpiByInstanceId(primary.kpiInstanceId)?.dept || '-'})` : '无';
        const supportingText = supporting.map(a => `${omp_getKpiAssociationDisplayName(a)} (${omp_getKpiByInstanceId(a.kpiInstanceId)?.dept || '-'})`).join('、') || '无';
        const overrideTag = task.progressOverridden ? `<span style="font-size:11px;padding:2px 6px;border-radius:4px;background:var(--warning-bg);color:var(--warning);margin-left:8px;">已手动覆盖</span>` : '';
        return `
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px;">
            <div class="grid-full-width"><div style="font-size:20px;font-weight:700;">${task.name}</div><div class="text-sm-secondary mt-1">${task.description}</div></div>
            ${task.annualPlanTaskId ? `<div class="grid-full-width"><div class="text-xs-tertiary">来源</div><div><span class="icon" data-icon="clipboard-text" data-icon-size="14"></span> 年度经营计划 <span class="text-xs-tertiary">(${escapeHtml(task.annualPlanTaskId)})</span> — <a href="#bp/annual-plan" data-navigate="bp/annual-plan" class="primary-text">查看源头</a></div></div>` : ''}
            <div><div class="text-xs-tertiary">类型</div><div style="font-weight:500;">${typeLabels[task.type]}</div></div>
            <div><div class="text-xs-tertiary">负责人</div><div>${escapeHtml(window.renderPerson ? window.renderPerson(task.owner) : (task.owner || ''))}</div></div>
            <div><div class="text-xs-tertiary">成员</div><div>${(() => { const ms = (task.members || []).filter(Boolean); return ms.length > 0 ? ms.map(m => escapeHtml(window.renderPerson ? window.renderPerson(m) : m)).join('、') : '无'; })()}</div></div>
            <div><div class="text-xs-tertiary">部门</div><div>${task.dept}</div></div>
            <div><div class="text-xs-tertiary">开始日期</div><div>${task.startDate}</div></div>
            <div><div class="text-xs-tertiary">截止日期</div><div>${task.endDate}</div></div>
            <div><div class="text-xs-tertiary">预算</div><div>${task.budget}万</div></div>
            <div><div class="text-xs-tertiary">实际成本</div><div>${task.actualCost}万</div></div>
            <div class="grid-full-width">
              <div class="form-label">关联 KPI</div>
              <div><strong>主指标：</strong>${primaryText}</div>
              <div class="mt-1"><strong>相关指标：</strong>${supportingText}</div>
            </div>
            <div><div class="text-xs-tertiary">状态</div><div style="font-weight:600;color:${statusColors[task.status]}">${statusLabels[task.status]}</div></div>
            <div class="grid-full-width"><div class="form-label">年度目标</div><div>${task.annualTarget ? escapeHtml(task.annualTarget) : '无'}</div></div>
            <div><div class="form-label">关联 SP 链接</div><div>${task.spLink ? `<a href="${escapeHtml(task.spLink)}" target="_blank" rel="noopener noreferrer" class="primary-text">${escapeHtml(task.spLink)}</a>` : '无'}</div></div>
            <div><div class="form-label">主 BI 看板</div><div>${task.biDashboard ? `<a href="${escapeHtml(task.biDashboard)}" target="_blank" rel="noopener noreferrer" class="primary-text">${escapeHtml(task.biDashboard)}</a>` : '无'}</div></div>
            <div class="grid-full-width"><div class="form-label">进度 ${task.progress}%${overrideTag}</div><div style="width:100%;height:8px;background:var(--bg-page);border-radius:4px;overflow:hidden;"><div style="width:${task.progress}%;height:100%;background:${statusColors[task.status]};border-radius:4px;"></div></div></div>
          </div>`;
      }

      function omp_editTaskModal(taskId) {
        const tasks = omp_load('tasks');
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;
        window._ompState.editingTaskId = taskId;
        window._ompState.taskEditActiveTab = 'basic';
        const isSubtask = omp_isSubtask(task);
        const tabs = [
          { id: 'basic', label: '基本信息' },
          { id: 'milestones', label: '里程碑' },
          { id: 'subtasks', label: `子任务 (${omp_getSubtasks(taskId).length})` },
          { id: 'resources', label: '资源' },
        ].filter(t => !isSubtask || t.id !== 'subtasks');
        const activeTab = window._ompState.taskEditActiveTab || 'basic';
        const tabHtml = `
          <div class="flex-row gap-0 border-bottom-default mb-5">
            ${tabs.map(t => `
              <button type="button" class="omp-task-edit-tab ${activeTab === t.id ? 'active' : ''}" onclick="window.omp_switchTaskEditTab('${t.id}')" style="padding:10px 16px;font-size:13px;background:transparent;border:none;border-bottom:2px solid ${activeTab === t.id ? 'var(--primary)' : 'transparent'};color:${activeTab === t.id ? 'var(--primary)' : 'var(--text-secondary)'};cursor:pointer;">${t.label}</button>
            `).join('')}
          </div>`;
        const contentHtml = omp_renderTaskEditTabContent(task);
        omp_openModal(isSubtask ? '编辑子任务' : '编辑重点工作', `
          ${tabHtml}
          <div id="omp-task-edit-tab-content">${contentHtml}</div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="document.getElementById('omp-active-modal').remove(); window._ompState.editingTaskId = null;">取消</button>
            <button class="btn btn-primary" onclick="window.omp_saveTask()">保存</button>
          </div>`, true);
        window.omp_initKpiSearchFields('omp-task', task.dept || '');
        if (window.ensurePersonInput) {
          window.ensurePersonInput('omp-task-owner', task.owner || '');
          if (activeTab === 'subtasks') {
            omp_getSubtasks(taskId).forEach(s => {
              window.ensurePersonInput('omp-subtask-owner-' + s.id, s.owner || '');
            });
          }
        }
      }

      function omp_renderTaskEditTabContent(task) {
        const activeTab = window._ompState.taskEditActiveTab || 'basic';
        if (activeTab === 'milestones') {
          const milestones = omp_load('milestones').filter(m => m.taskId === task.id);
          const msHtml = milestones.map(m => `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light);">
              <span class="text-md-semibold">${m.status === 'completed' ? icon('check', { size: 16 }) : m.status === 'delayed' ? icon('warning', { size: 16 }) : icon('circle', { size: 16 })}</span>
              <div class="flex-1"><div class="text-base-medium">${m.name}</div><div class="text-xs-tertiary">计划: ${m.planDate}${m.actualDate ? ' · 实际: ' + m.actualDate : ''}</div></div>
              <span style="font-size:12px;padding:2px 8px;border-radius:4px;background:${m.status === 'completed' ? 'var(--success-bg)' : 'var(--bg-page)'};color:${m.status === 'completed' ? 'var(--success)' : m.status === 'delayed' ? 'var(--danger)' : 'var(--text-secondary)'}">${m.status === 'completed' ? '已完成' : m.status === 'delayed' ? '已延期' : '待办'}</span>
            </div>`).join('') || '<div style="padding:20px;text-align:center;color:var(--text-tertiary);">暂无里程碑</div>';
          return `<div class="mb-4"><div class="section-title"><span class="icon" data-icon="push-pin" data-icon-size="14"></span> 里程碑</div><div style="border:1px solid var(--border-light);border-radius:8px;padding:0 12px;">${msHtml}</div></div>`;
        }
        if (activeTab === 'subtasks') {
          return omp_renderSubtaskTab(task.id);
        }
        if (activeTab === 'resources') {
          const ms = (task.members || []).filter(Boolean);
          return `
            <div class="mb-4">
              <div class="section-title">资源成员</div>
              <div style="padding:12px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-page);">
                ${ms.length > 0 ? ms.map(m => `<div style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border-light);border-radius:20px;background:var(--bg-card);margin:4px;">${renderAvatar(m, 22, resolvePersonDisplayName(m))}<span class="text-sm-only">${escapeHtml(resolvePersonDisplayName(m))}</span></div>`).join('') : '<div class="text-tertiary">暂无成员</div>'}
              </div>
              <div style="margin-top:8px;font-size:12px;color:var(--text-secondary);">提示：请前往「人员配置」视图拖拽分配或移除成员。</div>
            </div>`;
        }
        // basic
        const overrideTag = task.progressOverridden ? `<span style="font-size:11px;padding:2px 6px;border-radius:4px;background:var(--warning-bg);color:var(--warning);margin-left:8px;">已手动覆盖</span>` : '';
        const restoreBtn = (!omp_isSubtask(task) && omp_hasSubtasks(task.id) && task.progressOverridden) ? `<button type="button" class="btn btn-sm btn-secondary" onclick="window.omp_restoreAutoProgress('${task.id}')" style="margin-left:8px;font-size:11px;">恢复自动计算</button>` : '';
        const kpis = omp_load('kpiInstances');
        const associations = omp_getKpiAssociations(task);
        const primaryId = omp_getPrimaryKpiAssociation(task)?.kpiInstanceId || '';
        const supportingIds = omp_getSupportingKpiAssociations(task).map(a => a.kpiInstanceId);
        const kpiFields = omp_renderKpiAssociationFields(task, 'omp-task', {
          kpis,
          primaryId,
          supportingIds,
          taskDept: task.dept || '',
          primaryDisabled: !!task.annualPlanTaskId,
          cycleId: task.cycleId
        });
        return `
          <div class="grid-2-col" class="gap-4">
            <div class="grid-full-width"><label class="form-label">工作名称 *</label><input type="text" id="omp-task-name" value="${task.name}" class="form-input-compact"></div>
            <div class="grid-full-width"><label class="form-label">描述</label><textarea id="omp-task-desc" rows="2" class="form-textarea-compact">${task.description}</textarea></div>
            <div><label class="form-label">类型 *</label><select id="omp-task-type" class="form-input-compact"><option value="strategic" ${task.type === 'strategic' ? 'selected' : ''}><span class="icon" data-icon="target" data-icon-size="14"></span> 战略举措</option><option value="improvement" ${task.type === 'improvement' ? 'selected' : ''}><span class="icon" data-icon="gear" data-icon-size="14"></span> 业务改进</option><option value="capability" ${task.type === 'capability' ? 'selected' : ''}><span class="icon" data-icon="books" data-icon-size="14"></span> 能力建设</option><option value="risk_response" ${task.type === 'risk_response' ? 'selected' : ''}><span class="icon" data-icon="warning" data-icon-size="14"></span>️ 风险应对</option></select></div>
            <div>
              <label class="form-label">所属目录</label>
              <input type="hidden" id="omp-task-catalog-id" value="${task.catalogId || ''}">
              <div id="omp-task-catalog-display" class="form-input-compact" style="display:flex;justify-content:space-between;align-items:center;">
                <span>${escapeHtml(getCatalogPath(CATALOG_SCOPES.OMP_TASKS, task.catalogId) || '未选择')}</span>
                <button type="button" class="btn btn-sm btn-secondary" onclick="window.omp_pickTaskCatalog()">选择</button>
              </div>
            </div>
            <div><label class="form-label">负责人 *</label><input type="text" id="omp-task-owner" value="${typeof task.owner === 'object' ? (task.owner.displayName || task.owner.name || '') : (task.owner || '')}" ${task.annualPlanTaskId ? 'disabled' : ''} style="width:100%;padding:8px 12px;border:1px solid var(--border-color);border-radius:6px;background:${task.annualPlanTaskId ? 'var(--bg-page)' : 'var(--bg-card)'};color:var(--text-primary);font-size:13px;"></div>
            <div><label class="form-label">部门 *</label><input type="text" id="omp-task-dept" value="${task.dept}" oninput="window.omp_updateKpiDeptWarning('omp-task')" class="form-input-compact"></div>
            ${task.annualPlanTaskId ? `<div style="grid-column:1 / -1;font-size:12px;color:var(--text-tertiary);padding:8px 12px;background:var(--bg-page);border-radius:6px;">ℹ️ 负责人由年度经营计划同步，如需修改请前往「年度经营计划」页面</div>` : ''}
            <div><label class="form-label">开始日期</label><input type="date" id="omp-task-start" value="${task.startDate}" class="form-input-compact"></div>
            <div><label class="form-label">截止日期 *</label><input type="date" id="omp-task-end" value="${task.endDate}" class="form-input-compact"></div>
            <div><label class="form-label">进度 (%) ${overrideTag}${restoreBtn}</label><input type="number" id="omp-task-progress" value="${task.progress}" min="0" max="100" class="form-input-compact"></div>
            <div><label class="form-label">状态</label><select id="omp-task-status" class="form-input-compact"><option value="planning" ${task.status === 'planning' ? 'selected' : ''}>规划中</option><option value="active" ${task.status === 'active' ? 'selected' : ''}>进行中</option><option value="at_risk" ${task.status === 'at_risk' ? 'selected' : ''}>有风险</option><option value="delayed" ${task.status === 'delayed' ? 'selected' : ''}>已延期</option><option value="done" ${task.status === 'done' ? 'selected' : ''}>已完成</option><option value="closed" ${task.status === 'closed' ? 'selected' : ''}>已关闭</option></select></div>
            <div><label class="form-label">预算 (万)</label><input type="number" id="omp-task-budget" value="${task.budget}" class="form-input-compact"></div>
            <div><label class="form-label">实际成本 (万)</label><input type="number" id="omp-task-cost" value="${task.actualCost}" class="form-input-compact"></div>
            ${kpiFields}
            <div class="grid-full-width"><label class="form-label">年度目标</label><input type="text" id="omp-task-annual-target" value="${escapeHtml(task.annualTarget || '')}" class="form-input-compact"></div>
            <div><label class="form-label">关联 SP 链接</label><input type="text" id="omp-task-sp-link" value="${escapeHtml(task.spLink || '')}" class="form-input-compact"></div>
            <div><label class="form-label">主 BI 看板</label><input type="text" id="omp-task-bi-dashboard" value="${escapeHtml(task.biDashboard || '')}" class="form-input-compact"></div>
          </div>`;
      }

      function omp_renderSubtaskRow(subtask, idx, total) {
        const ownerInputId = 'omp-subtask-owner-' + subtask.id;
        const isFirst = idx === 0;
        const isLast = idx === total - 1;
        return `
          <div class="omp-subtask-row" data-subtask-id="${subtask.id}" data-seq="${idx}" style="display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--border-light);border-radius:8px;margin-bottom:8px;background:var(--bg-card);">
            <div class="flex-col gap-xs">
              <button type="button" onclick="window.omp_moveSubtaskRow(this, 'up')" ${isFirst ? 'disabled class="visibility-hidden"' : ''} class="btn-icon-ghost" title="上移">▲</button>
