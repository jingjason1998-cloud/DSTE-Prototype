<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSTE 战略管理平台</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="./styles/shell.css">
  <link rel="stylesheet" href="./styles/ai-chat.css">
  <style>
    /* ===== cockpit.html 页面级响应式覆盖 ===== */

    /* Tablet (<1024px) */
    @media (max-width: 1024px) {
      #page-content [style*="grid-template-columns: repeat(4, 1fr)"] {
        grid-template-columns: repeat(2, 1fr) !important;
      }
      #page-content [style*="grid-template-columns: 2fr 1fr"] {
        grid-template-columns: 1fr !important;
      }
      #page-content [style*="grid-template-columns: repeat(3, 1fr)"] {
        grid-template-columns: repeat(2, 1fr) !important;
      }
      #page-content [style*="grid-template-columns: repeat(7, 1fr)"] {
        grid-template-columns: repeat(4, 1fr) !important;
      }
      #page-content [style*="grid-template-columns: repeat(5, 1fr)"] {
        grid-template-columns: repeat(3, 1fr) !important;
      }
      #page-content [style*="grid-template-columns: 280px 1fr"] {
        grid-template-columns: 1fr !important;
      }
      /* Roadmap 时间线节点缩小 */
      #dev-timeline .timeline-node {
        min-width: 90px !important;
        padding: 6px !important;
      }
    }

    /* Mobile (<768px) */
    @media (max-width: 768px) {
      #page-content [style*="grid-template-columns: repeat(4, 1fr)"] {
        grid-template-columns: 1fr !important;
      }
      #page-content [style*="grid-template-columns: repeat(2, 1fr)"] {
        grid-template-columns: 1fr !important;
      }
      #page-content [style*="grid-template-columns: repeat(3, 1fr)"] {
        grid-template-columns: 1fr !important;
      }
      #page-content [style*="grid-template-columns: repeat(7, 1fr)"] {
        grid-template-columns: repeat(3, 1fr) !important;
      }
      #page-content [style*="grid-template-columns: repeat(5, 1fr)"] {
        grid-template-columns: repeat(2, 1fr) !important;
      }
      #page-content [style*="grid-template-columns: 280px 1fr"] {
        grid-template-columns: 1fr !important;
      }
      /* Roadmap 时间线节点进一步缩小 */
      #dev-timeline .timeline-node {
        min-width: 80px !important;
        padding: 4px !important;
      }
      #dev-timeline .timeline-node > div:nth-child(2) {
        font-size: 12px !important;
      }
      #dev-timeline .timeline-node > div:nth-child(3),
      #dev-timeline .timeline-node > div:nth-child(4) {
        font-size: 10px !important;
      }
      /* 卡片 padding 缩小 */
      #page-content .card {
        padding: 12px !important;
      }
      /* 看板列从 4 列变为可滚动 */
      #page-content [style*="grid-template-columns: repeat(4, 1fr)"][class*="kanban"] {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }

    /* Small Phone (<480px) */
    @media (max-width: 480px) {
      #page-content [style*="grid-template-columns: repeat(2, 1fr)"] {
        grid-template-columns: 1fr !important;
      }
      #page-content [style*="grid-template-columns: repeat(7, 1fr)"] {
        grid-template-columns: repeat(2, 1fr) !important;
      }
      #page-content [style*="grid-template-columns: repeat(5, 1fr)"] {
        grid-template-columns: 1fr !important;
      }
      #page-content [style*="grid-template-columns: repeat(4, 1fr)"] {
        grid-template-columns: 1fr !important;
      }
      #dev-timeline .timeline-node {
        min-width: 70px !important;
      }
      #page-content .card {
        padding: 10px !important;
      }
      /* 看板单列 */
      #page-content [style*="grid-template-columns: repeat(4, 1fr)"][class*="kanban"] {
        grid-template-columns: 1fr !important;
      }
    }

    /* ===== OMP 专用 CSS 变量 ===== */
    :root {
      /* BSC 维度色 */
      --dim-financial: #1E3A5F;
      --dim-customer: #2E8B57;
      --dim-process: #D4A017;
      --dim-learning: #6B4C9A;
      /* KPI 层级色 */
      --kpi-level-0: #003087;
      --kpi-level-1: #005EB8;
      --kpi-level-2: #99C7E8;
      /* 画布背景 */
      --canvas-bg: var(--bg-page);
      --canvas-node-bg: var(--bg-card);
      --canvas-stroke: var(--border-color);
      --canvas-progress-track: var(--border-light);
      /* 辅助色 */
      --accent-pink: #EB2F96;
    }

    /* 表格横向滚动容器 */
    .table-scroll-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table-scroll-wrapper table {
      min-width: 600px;
    }

    /* ===== 战略专题管理：紧凑表格 + 内容区滚动 ===== */
    .st-compact-table {
      font-size: 12px;
      line-height: 1.35;
    }
    .st-compact-table th {
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg-page);
    }
    .st-compact-table td {
      padding: 4px 8px;
      font-size: 12px;
      vertical-align: middle;
    }
    .st-compact-table .status-badge {
      font-size: 11px;
      padding: 1px 6px;
    }
    .st-compact-table .chain-badge {
      font-size: 10px;
      padding: 0 4px;
    }
    .st-action-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      text-decoration: none;
    }
    .st-action-link:hover {
      background: var(--bg-page);
      color: var(--primary);
      text-decoration: none;
    }
    .st-action-link.danger:hover {
      color: var(--danger);
    }
    .st-action-link:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .st-action-link:disabled:hover {
      background: none;
      color: var(--text-secondary);
    }
    .st-year-card {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .st-year-card .table-scroll-wrapper {
      flex: 1 1 auto;
      min-height: 0;
      max-height: min(58vh, 560px);
      overflow-y: auto;
    }
    .st-year-card .st-compact-table {
      min-width: 0;
      width: 100%;
    }

    /* ===== 全局弹窗样式 ===== */
    .omp-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .omp-modal { background: var(--bg-card); border-radius: 12px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .omp-modal-wide { max-width: 900px !important; }

    /* ===== 年度经营计划公用样式 ===== */
    .ap-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 10px; overflow: hidden; }
    .ap-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ap-table th, .ap-table td { padding: 10px; border-bottom: 1px solid var(--border-light); }
    .ap-dim-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .ap-level-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
    .ap-level-marketing-line { background: color-mix(in srgb, var(--kpi-level-0) 15%, transparent); color: var(--kpi-level-0); }
    .ap-level-department { background: color-mix(in srgb, var(--kpi-level-1) 15%, transparent); color: var(--kpi-level-1); }
    .ap-level-team { background: color-mix(in srgb, var(--kpi-level-2) 15%, transparent); color: var(--kpi-level-2); }
    .ap-status-pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
    .ap-edit-panel { position: fixed; top: 0; right: 0; width: 360px; height: 100vh; background: var(--bg-card); border-left: 1px solid var(--border-color); z-index: 100; padding: 20px; overflow-y: auto; box-shadow: -4px 0 20px rgba(0,0,0,0.1); }
    .ap-section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px; margin-top: 24px; margin-bottom: 8px; }

    /* ===== KPI 指标树 — 卡片式层级视图 ===== */
    /* ===== Canvas 自由画布 KPI 树 ===== */
    .omp-kpi-canvas {
      position: relative;
      width: 100%;
      height: 700px;
      overflow: hidden;
      background: var(--canvas-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      cursor: grab;
      user-select: none;
    }
    .omp-kpi-canvas:active { cursor: grabbing; }
    .omp-kpi-canvas-inner {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
    }
    /* SVG 连接线层 */
    .omp-canvas-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .omp-canvas-svg path {
      fill: none;
      stroke: var(--canvas-stroke);
      stroke-width: 2;
      transition: d 0.2s ease;
    }
    /* 画布节点卡片 */
    .omp-canvas-node {
      position: absolute;
      min-width: 160px;
      min-height: 90px;
      border-radius: 10px;
      padding: 12px;
      background: var(--canvas-node-bg);
      border: 1px solid var(--canvas-stroke);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: grab;
      z-index: 2;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s, border-color 0.2s;
      overflow: hidden;
      resize: both;
    }
    .omp-canvas-node:active { cursor: grabbing; }
    .omp-canvas-node:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .omp-canvas-node.selected { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent); }
    /* 维度角标 */
    .omp-dim-badge {
      position: absolute;
      top: -1px; right: -1px;
      width: 0; height: 0;
      border-style: solid;
      border-width: 0 24px 24px 0;
      border-color: transparent;
    }
    .omp-dim-badge.financial { border-right-color: var(--dim-financial); }
    .omp-dim-badge.customer { border-right-color: var(--dim-customer); }
    .omp-dim-badge.internal { border-right-color: var(--dim-process); }
    .omp-dim-badge.learning { border-right-color: var(--dim-learning); }
    /* 顶部状态色条 */
    .omp-canvas-node.status-achieved { border-top: 3px solid var(--success); }
    .omp-canvas-node.status-warning { border-top: 3px solid var(--warning); }
    .omp-canvas-node.status-lagging { border-top: 3px solid var(--danger); }
    .canvas-node-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .canvas-node-dept {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 4px;
    }
    .canvas-node-metric {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .canvas-node-metric strong { color: var(--text-primary); font-size: 13px; }
    .canvas-node-progress {
      margin-top: auto;
      padding-top: 6px;
    }
    .canvas-node-progress-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--canvas-progress-track);
      overflow: hidden;
      margin-bottom: 4px;
    }
    .canvas-node-progress-bar > div {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .canvas-node-progress-bar > div.achieved { background: var(--success); }
    .canvas-node-progress-bar > div.warning { background: var(--warning); }
    .canvas-node-progress-bar > div.lagging { background: var(--danger); }
    .canvas-node-progress-text {
      font-size: 11px;
      font-weight: 600;
      text-align: right;
    }
    .canvas-node-progress-text.achieved { color: var(--success); }
    .canvas-node-progress-text.warning { color: var(--warning); }
    .canvas-node-progress-text.lagging { color: var(--danger); }
    /* 展开折叠按钮 */
    .canvas-node-expand {
      position: absolute;
      bottom: 6px;
      left: 6px;
      font-size: 14px;
      color: var(--text-tertiary);
      cursor: pointer;
      line-height: 1;
      z-index: 3;
    }
    /* 画布工具栏 */
    .omp-canvas-toolbar {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 6px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 6px 10px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      font-size: 12px;
    }
    .omp-canvas-toolbar button {
      background: var(--bg-page);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-primary);
    }
    .omp-canvas-toolbar button:hover { background: var(--bg-card); }
    /* 缩放指示器 */
    .omp-canvas-zoom {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    /* 状态药丸（保留兼容） */
    .omp-status-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }
    .omp-status-pill.achieved { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); }
    .omp-status-pill.warning { background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--warning); }
    .omp-status-pill.lagging { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
    /* 展开按钮（保留兼容） */
    .omp-expand-btn {
      transition: transform 0.2s ease;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      width: 20px;
      text-align: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .omp-expand-btn.expanded { transform: rotate(90deg); }
    /* 保留兼容：层级差异化 */
    .omp-kpi-card[data-level="0"] { border-left: 4px solid var(--kpi-level-0); }
    .omp-kpi-card[data-level="1"] { border-left: 3px solid var(--kpi-level-1); }
    .omp-kpi-card[data-level="2"] { border-left: 2px solid var(--kpi-level-2); }
    /* 响应式 */
    @media (max-width: 768px) {
      .omp-kpi-card.mindmap-node { width: 140px; min-height: 80px; padding: 10px; }
      .omp-kpi-children-row { gap: 10px; }
    }

    /* 减少动画偏好 */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ===== 站内标签栏 ===== */
    .content-area--tabs {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .content-area--tabs .page-tabs {
      flex: none;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      padding: var(--space-1) var(--space-4) 0;
      background: var(--color-bg-surface);
      border-bottom: 1px solid var(--color-border-divider);
      overflow-x: auto;
      overflow-y: hidden;
      min-height: var(--shell-tabbar-height);
    }
    .content-area--tabs .page-tabs::-webkit-scrollbar { height: 4px; }
    .content-area--tabs .page-tabs::-webkit-scrollbar-thumb { background: var(--color-border-default); border-radius: 2px; }
    .page-tabs .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      cursor: pointer;
      white-space: nowrap;
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      background: transparent;
      user-select: none;
      transition: background var(--duration-fast) var(--ease-productive), color var(--duration-fast) var(--ease-productive), border-color var(--duration-fast) var(--ease-productive);
      max-width: 176px;
    }
    .page-tabs .tab.pinned { padding: 4px 8px; }
    .page-tabs .tab-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--color-text-tertiary);
    }
    .page-tabs .tab.active .tab-icon { color: var(--color-primary); }
    .page-tabs .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .page-tabs .tab:hover:not(.active) { background: var(--color-bg-hover); color: var(--color-text-secondary); }
    .page-tabs .tab.active {
      background: var(--color-bg-page);
      border-color: var(--color-border-divider);
      border-bottom-color: var(--color-bg-page);
      color: var(--color-text-primary);
      margin-bottom: -1px;
    }
    .page-tabs .tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      line-height: 14px;
      border-radius: var(--radius-sm);
      margin-left: var(--space-1);
      font-size: 12px;
      flex-shrink: 0;
    }
    .page-tabs .tab-close:hover { background: var(--color-danger-subtle); color: var(--color-danger); }
    .content-area--tabs .page-content {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      position: relative;
      width: 100%;
    }
    /* cockpit 工作区内统一隐藏页内面包屑：定位由工作区标签 + 侧边栏承担，避免标题堆叠 */
    .content-area--tabs .breadcrumb { display: none; }
    @media (max-width: 768px) {
      .content-area--tabs .page-tabs { padding: 4px 12px 0; }
      .page-tabs .tab { padding: 4px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- 顶部导航 -->
    <nav class="top-nav">
      <div style="display: flex; align-items: center;">
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="打开菜单"><span class="icon" data-icon="menu" data-icon-size="18"></span></button>
        <div class="top-nav-brand">
          <div class="top-nav-logo">D</div>
          <span class="top-nav-title">DSTE 战略管理平台</span>
        </div>
      </div>
      <ul class="top-nav-links" id="top-nav-links"></ul>
      <div class="top-nav-actions">
        <select id="global-cycle-select" data-action="global-switch-cycle" style="padding:3px 6px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-card);color:var(--text-primary);font-size:12px;cursor:pointer;margin-right:4px;">
          <!-- 由 renderCycleSelector 填充 -->
        </select>
        <button class="icon-btn" id="theme-toggle" title="切换主题"><span class="icon" data-icon="moon" data-icon-size="18"></span></button>
        <button class="icon-btn" title="通知"><span class="icon" data-icon="notification" data-icon-size="18"></span></button>
        <div class="user-avatar" id="user-avatar" class="position-relative">张</div>
        <div class="user-dropdown" id="user-dropdown">
          <div class="user-dropdown-name" id="user-dropdown-name">张总</div>
          <div class="user-dropdown-divider"></div>
          <button class="user-dropdown-item" id="user-logout"><span class="icon" data-icon="sign-out" data-icon-size="14"></span> 退出登录</button>
        </div>
      </div>
    </nav>

    <div class="app-body">
      <!-- 侧边栏遮罩层 -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <!-- 左侧边栏 -->
      <aside class="sidebar" id="sidebar"></aside>

      <!-- 内容区 -->
      <main class="content-area content-area--tabs" id="content-area">
        <div class="page-tabs" id="page-tabs"></div>
        <div class="page-content" id="page-content"></div>
        <!-- 外部页 iframe keep-alive 容器层：渲染内部页时整体隐藏但保留，切回外部页零重载 -->
        <div class="workspace-panes" id="workspace-panes"></div>
      </main>
    </div>
  </div>

  <script src="../assets/js/main.js"></script>
  <script src="../pages/dashboard/roadmap.js" defer></script>
  <script src="../pages/dashboard/version-audit.js" defer></script>
  <script type="module">
    import { renderTopNav, renderSidebar as shellRenderSidebar, getPhaseFromPage, getPageMeta, toggleGlobalAiDrawer } from './lib/shell.js';
    import { sendMessage as sendGlobalAiMessage } from './components/GlobalAiDrawer.js';
    import { hydrateIcons, icon } from '../assets/js/icons.js';
    import { EXTERNAL_PAGES } from './lib/config.js';
    import { initCommandPalette } from './lib/command-palette.js';
    import {
      loadWorkspaceTabs,
      saveWorkspaceTabs,
      createTab,
      switchTab as switchWorkspaceTab,
      closeTab as closeWorkspaceTab,
      updateActiveTabPage,
      openOrActivateTab,
      setTabPinned,
      reorderTabs,
      resolvePageMeta
    } from './lib/workspace-tabs.js';

      async function fetchWithAuthRetry(url, options = {}, retries = 3, delayMs = 1000) {
        const token = DSTE.Storage.getString('dste-token');
        const headers = { ...(options.headers || {}) };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        let lastResp = null;
        for (let i = 0; i <= retries; i++) {
          const resp = await fetch(url, { ...options, headers });
          if (resp.status !== 401) return resp;
          lastResp = resp;
          if (i < retries && isCasLoginTrustWindow()) {
            console.warn(`[Auth] fetch ${url} returned 401 within CAS trust window, retry ${i + 1}/${retries}`);
            await new Promise(r => setTimeout(r, delayMs));
            continue;
          }
          break;
        }
        return lastResp;
      }

      // 检测是否在短时间内被 CAS 重定向多次，防止无限循环
      function isCasRedirectLoop() {
        try {
          const now = Date.now();
          const raw = sessionStorage.getItem(CAS_REDIRECT_HISTORY_KEY);
          const history = raw ? JSON.parse(raw) : [];
          const recent = history.filter(t => now - t < 10000);
          recent.push(now);
          sessionStorage.setItem(CAS_REDIRECT_HISTORY_KEY, JSON.stringify(recent));
          return recent.length > 2;
        } catch (e) {
          return false;
        }
      }

      function clearCasRedirectHistory() {
        try { sessionStorage.removeItem(CAS_REDIRECT_HISTORY_KEY); } catch (e) {}

      // 刚完成 CAS 登录的 30 秒内，信任本地 token，避免 KV 跨节点一致性导致 API 401 误触发循环
      function isCasLoginTrustWindow() {
        try {
          const loginAt = parseInt(sessionStorage.getItem(CAS_LOGIN_AT_KEY) || '0', 10);
          return Date.now() - loginAt < 30000;
        } catch (e) {
          return false;
        }
      }

      function saveAuthReturnUrl() {

          if (!path.includes(CAS_LANDING_PAGE)) {
            sessionStorage.setItem(CAS_RETURN_TO_KEY, path + search + hash);
          }

      }

      function restoreAuthReturnUrl() {
        try {
          const returnTo = sessionStorage.getItem(CAS_RETURN_TO_KEY);

            sessionStorage.removeItem(CAS_RETURN_TO_KEY);
            const current = window.location.pathname + window.location.search + window.location.hash;
            if (returnTo !== current) {
              window.location.replace(returnTo);
              return true;
            }
          }
        } catch (e) {}
        return false;
      }

        banner.textContent = message;

      // CAS 登录跳转
      function redirectToCasLogin() {
        if (isCasRedirectLoop()) {
          showAuthError('登录验证出现循环，请关闭页面后重新打开，或联系管理员。');
          return;
        }
        saveAuthReturnUrl();

        window.location.href = `https://passport.fanruan.com/cas/login?service=${service}`;
      }

      function setAuthToken(token, user) {
        DSTE.Storage.setString('dste-token', token);

        sessionStorage.setItem('dste-user', user?.name || user?.username || '');
        sessionStorage.setItem(CAS_LOGIN_AT_KEY, String(Date.now()));
        clearCasRedirectHistory();
        updateUserUI();
      }

      // CAS 回调处理：从 URL 提取 ticket，调用后端换取 token
      async function handleCasCallback() {
        const urlParams = new URLSearchParams(window.location.search);
        const ticket = urlParams.get('ticket');
        if (!ticket) return false;

        const cleanUrl = window.location.pathname + window.location.hash;
        history.replaceState(null, '', cleanUrl);

        try {
          const service = encodeURIComponent(getCasServiceUrl());
          const resp = await fetch(`${API_BASE}/api/auth/cas/login?ticket=${encodeURIComponent(ticket)}&service=${service}`);
          const json = await resp.json();
          if (json.success && json.token) {
            setAuthToken(json.token, json.user);
            // 登录成功后，若存在保存的返回地址，跳转回去
            if (restoreAuthReturnUrl()) {
              return true;
            }
            return true;
          }
        } catch (e) {
          console.error('CAS callback failed:', e);
        }
        return false;
      }

      // 检查登录状态：验证 token 是否有效
      async function checkLoginStatus() {
        const token = DSTE.Storage.getString('dste-token');
        if (!token) return false;

        // 刚完成 CAS 登录的 30 秒内，信任本地 token，避免 KV 跨节点一致性导致误删 token 并触发循环
        try {
          const loginAt = parseInt(sessionStorage.getItem(CAS_LOGIN_AT_KEY) || '0', 10);
          if (Date.now() - loginAt < 30000) {
            updateUserUI();
            return true;
          }
        } catch (e) {}

        try {
          const resp = await fetch(`${API_BASE}/api/auth/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (resp.ok) {
            const json = await resp.json();
            if (json.success && json.user) {
              DSTE.Storage.setString('dste-user', json.user.name || json.user.username || '');
              sessionStorage.setItem('dste-user', json.user.name || json.user.username || '');
              updateUserUI();
              return true;
            }
          }
        } catch (e) {
          console.warn('Login status check failed:', e);
        }

        DSTE.Storage.remove('dste-token');
        DSTE.Storage.remove('dste-user');
        sessionStorage.removeItem('dste-user');
        sessionStorage.removeItem(CAS_LOGIN_AT_KEY);
        return false;
      }

        if (wrap) wrap.remove();
      }

      // LRU：新建前若已达上限，销毁最久未激活的 keep-alive 容器
      function _evictIframeWrapsIfNeeded() {
        const panes = _getWorkspacePanes();
        if (!panes) return;
        const wraps = [...panes.querySelectorAll('.workspace-iframe-wrap')];
        if (wraps.length < WORKSPACE_IFRAME_KEEPALIVE_MAX) return;
        wraps.sort((a, b) => (Number(a.dataset.lastActive) || 0) - (Number(b.dataset.lastActive) || 0));
        const victim = wraps.find(w => w.dataset.pageId !== currentPage);
        if (victim) victim.remove();
      }

      // 显示指定外部页的 keep-alive 容器；首次激活时才创建 iframe 并设置 src
      function _showIframeWrap(pageId, meta) {
        const panes = _getWorkspacePanes();
        const contentEl = document.getElementById('page-content');
        contentEl.style.display = 'none';
        panes.style.display = 'block';
        panes.querySelectorAll('.workspace-iframe-wrap').forEach(w => { w.style.display = 'none'; });

        const existing = _findIframeWrap(pageId);
        if (existing) {
          // 已加载过：直接显示，零重载
          existing.dataset.lastActive = String(Date.now());
          existing.style.display = 'block';
          // 命令面板记录级跳转：iframe 已就绪，直接投递待打开记录
          _postPendingRecordToIframe();
          return;
        }

        _evictIframeWrapsIfNeeded();

        // 首次激活：创建容器 + iframe（骨架屏占位，load 后淡出移除）
        const wrap = document.createElement('div');
        wrap.className = 'workspace-iframe-wrap';
        wrap.dataset.pageId = pageId;
        wrap.dataset.lastActive = String(Date.now());
        wrap.innerHTML = `
          <div class="workspace-iframe-skeleton skeleton-list">
            <div class="skeleton skeleton-text" style="width:32%;"></div>
            <div class="skeleton skeleton-rect"></div>
            <div class="skeleton skeleton-rect"></div>
          </div>
          <iframe
            class="workspace-iframe"
            src="${meta.externalFile}?embed=1&pageId=${encodeURIComponent(pageId)}"
            data-page-id="${pageId}"
            title="${escapeHtml(meta.title)}"
            frameborder="0"
            style="width:100%;min-height:100%;"
          ></iframe>
        `;
        const iframeEl = wrap.querySelector('.workspace-iframe');
        iframeEl.addEventListener('load', () => {
          const sk = wrap.querySelector('.workspace-iframe-skeleton');
          if (sk) sk.remove();
          // 命令面板记录级跳转：iframe 就绪后投递待打开记录
          _postPendingRecordToIframe();
        });
        panes.appendChild(wrap);
      }

      // ===== 内部页轻量状态快照（切页签时保持滚动位置与表单值，仅存内存） =====
      const _tabSnapshots = new Map();

      function _snapshotTabState(tabId) {
        const tab = workspace.tabs.find(t => t.id === tabId);
        if (!tab) return;
        const meta = getPageMeta(tab.pageId);
        // 外部页走 iframe keep-alive，无需快照；只有当前正在显示该内部页时快照才有意义
        if (meta.isExternal || !PAGES[tab.pageId] || currentPage !== tab.pageId) {
          _tabSnapshots.delete(tabId);
          return;
        }
        const contentEl = document.getElementById('page-content');
        if (!contentEl) return;
        const fields = {};
        contentEl.querySelectorAll('input[id], select[id], textarea[id]').forEach(el => {
          if (el.type === 'checkbox' || el.type === 'radio') fields[el.id] = { checked: el.checked };
          else fields[el.id] = { value: el.value };
        });
        _tabSnapshots.set(tabId, {
          pageId: tab.pageId,
          scrollTop: contentEl.scrollTop,
          windowScrollY: window.scrollY,
          fields
        });
      }

      function _restoreTabSnapshot(tabId) {
        const snap = _tabSnapshots.get(tabId);
        if (!snap || snap.pageId !== currentPage) return;
        const contentEl = document.getElementById('page-content');
        if (!contentEl) return;
        // 只还原值，不派发 change 事件，避免触发筛选/重渲染等副作用
        Object.entries(snap.fields).forEach(([id, val]) => {
          const el = document.getElementById(id);
          if (!el) return;
          if (val && typeof val === 'object' && 'checked' in val) el.checked = val.checked;
          else el.value = val.value;
        });
        contentEl.scrollTop = snap.scrollTop;
        window.scrollTo(0, snap.windowScrollY);
      }

      function getPageTitle(pageId) {
        return getPageMeta(pageId).title;
      }

      function renderTabs() {
        const tabsEl = document.getElementById('page-tabs');
        if (!tabsEl) return;
        tabsEl.innerHTML = workspace.tabs.map(tab => {
          const activeClass = tab.id === workspace.activeTabId ? 'active' : '';
          const pinnedClass = tab.pinned ? 'pinned' : '';
          const iconHtml = tab.icon ? icon(tab.icon, { size: 14 }) : '';
          const closeable = workspace.tabs.length > 1 && !tab.pinned;
          return `<div class="tab ${activeClass} ${pinnedClass}" data-tab-id="${tab.id}" title="${escapeHtml(tab.title)}">
            ${iconHtml ? `<span class="tab-icon">${iconHtml}</span>` : ''}
            <span class="tab-title">${escapeHtml(tab.title)}</span>
            ${closeable ? `<span class="tab-close" data-tab-id="${tab.id}" title="关闭">×</span>` : ''}
          </div>`;
        }).join('');
        hydrateIcons(tabsEl);
      }

      function switchTab(tabId) {
        const tab = workspace.tabs.find(t => t.id === tabId);
        if (!tab) return;
        // 离开当前内部页前做轻量快照（滚动位置 + 表单值）
        if (workspace.activeTabId !== tabId) _snapshotTabState(workspace.activeTabId);
        workspace = switchWorkspaceTab(workspace, tabId);
        renderTabs();
        _renderPage(tab.pageId, true);
        _restoreTabSnapshot(tabId);
      }

      function closeTab(tabId) {
        const closingTab = workspace.tabs.find(t => t.id === tabId);
        const wasActive = workspace.activeTabId === tabId;
        const result = closeWorkspaceTab(workspace, tabId);
        if (result.state === workspace) return; // pinned 或不存在，未实际关闭
        workspace = result.state;
        // 清理该页签的 keep-alive iframe 容器与内部页快照
        if (closingTab) _removeIframeWrap(closingTab.pageId);
        _tabSnapshots.delete(tabId);
        renderTabs();
        if (wasActive && workspace.tabs.length > 0) {
          switchTab(workspace.activeTabId);
        }
      }

      function openTab(pageId) {
        const meta = resolvePageMeta(pageId, getPageMeta);
        const result = openOrActivateTab(workspace, meta);
        workspace = result.state;
        renderTabs();
        _renderPage(pageId, true);
      }

      function updateActiveTab(pageId) {
        const prevTab = workspace.tabs.find(t => t.id === workspace.activeTabId);
        const meta = resolvePageMeta(pageId, getPageMeta);
        workspace = updateActiveTabPage(workspace, meta);
        // 页签内换页：旧外部页的 keep-alive 容器随页面离开而销毁
        if (prevTab && prevTab.pageId !== pageId) _removeIframeWrap(prevTab.pageId);
        renderTabs();
      }

      function onTopNavNavigate(defaultPage) {
        const phase = getPhaseFromPage(defaultPage);
        const activeTab = workspace.tabs.find(t => t.id === workspace.activeTabId);
        if (activeTab && activeTab.phase === phase) {
          navigate(defaultPage);
        } else {
          openTab(defaultPage);
        }
      }

      // ===== 初始化 =====
      async function init() {
        // 1. 优先处理 CAS 回调（URL 中有 ticket）
        const casHandled = await handleCasCallback();

        // 2. 检查登录状态（无回调时）
        if (!casHandled) {
          const isLoggedIn = await checkLoginStatus();
          // 本地开发环境可免登录
          // TODO: 临时绕过 CAS，恢复时去掉 'dste.fineres.com'
          const isLocalDev = ['localhost', '127.0.0.1', 'dste.jasonxspace.cc', 'dste.fineres.com'].includes(window.location.hostname);
          if (!isLoggedIn && !isLocalDev) {
            redirectToCasLogin();
            return;
          }
        }

        renderTopNav(currentPhase, onTopNavNavigate);
        hydrateIcons();
        renderCycleSelector();
        // 全局周期切换器事件绑定
        const cycleSelect = document.getElementById('global-cycle-select');
        if (cycleSelect) {
          cycleSelect.addEventListener('change', (e) => {
            window._dsteState.currentCycleId = e.target.value;
            // 持久化周期选择，供 bp.html 等独立页面读取
            DSTE.Storage.setString('dste_current_cycle_id', e.target.value);
            // 刷新当前页面以应用新周期
            const currentHash = window.location.hash.slice(1) || 'dashboard';
            navigate(currentHash);
          });
        }

        const hash = window.location.hash.slice(1) || 'dashboard';
        // 初始化活动标签为当前 hash 页面；若其他标签已打开该页面则直接激活，避免重复标签
        const initialMeta = resolvePageMeta(hash, getPageMeta);
        const existingInitialTab = workspace.tabs.find(t => t.pageId === initialMeta.pageId && t.id !== workspace.activeTabId);
        workspace = existingInitialTab
          ? switchWorkspaceTab(workspace, existingInitialTab.id)
          : updateActiveTabPage(workspace, initialMeta);
        renderTabs();
        navigate(hash, false);
        window.addEventListener('hashchange', () => navigate(window.location.hash.slice(1), false));

        // 非关键数据与远程同步放到首屏渲染之后后台执行，避免阻塞 strategy-topics 等页面打开
        void (async () => {
          try {
            // 加载会议数据：优先 API，其次本地存储（由 apiLoad 处理），最后由 renderMeetings 创建 mock
            const remoteMeetings = await apiLoad('/api/meetings');
            if (remoteMeetings && remoteMeetings.length > 0) {
              window._meetingsData = remoteMeetings;
            }
          } catch (e) {
            console.warn('[init] meetings load failed:', e.message);
          }

          try {
            // 同步 OMP 数据（指标库 / KPI / 重点工作等）
            await ompSyncFromApi();
          } catch (e) {
            console.warn('[init] OMP sync failed:', e.message);
          }

          try {
            // 同步目录管理数据
            await catalogSyncFromApi();
          } catch (e) {
            console.warn('[init] catalog sync failed:', e.message);
          }

          try {
            // 预加载路线图数据，避免 renderDevTimeline 使用硬编码旧数据
            const roadmapRes = await fetch('/roadmap-data.json');
            window._roadmapData = roadmapRes.ok ? await roadmapRes.json() : null;
            // 若当前正在 Roadmap 页，用真实数据重新渲染，避免首次展示 fallback
            if (window.__dsteCurrentPageId === 'dashboard/roadmap') {
              navigate('dashboard/roadmap', false);
            }
          } catch (e) {
            console.warn('[init] roadmap data load failed:', e);
            window._roadmapData = null;
          }

          // 后台刷新战略专题与战略洞察数据
          await Promise.allSettled([
            siLoadRemoteTopics(),
            siLoadRemoteInsights(),
          ]);

          // 注册 cockpit 各页面的 AI 上下文提供者
          registerCockpitAiProviders();
        })();

        // 标签栏事件：切换 / 关闭
        const tabsEl = document.getElementById('page-tabs');
        if (tabsEl) {
          tabsEl.addEventListener('click', (e) => {
            const closeBtn = e.target.closest('.tab-close');
            if (closeBtn) {
              e.stopPropagation();
              closeTab(closeBtn.dataset.tabId);
              return;
            }
            const tab = e.target.closest('.tab');
            if (tab) {
              switchTab(tab.dataset.tabId);
            }
          });
        }

        // iframe 嵌入页通信：高度自适应 + 内部导航
        window.addEventListener('message', (e) => {
          if (e.origin !== window.location.origin) return;
          if (!e.data || typeof e.data !== 'object') return;

          if (e.data.type === 'dste-embed-resize' && typeof e.data.height === 'number') {
            // 多个 keep-alive iframe 并存：按 event.source 匹配具体 iframe，不能用单数查询
            const iframes = document.querySelectorAll('.workspace-iframe');
            for (const iframe of iframes) {
              if (iframe.contentWindow === e.source) {
                iframe.style.height = Math.min(e.data.height, window.innerHeight - 120) + 'px';
                break;
              }
            }
            // 注意：报表中心 iframe 不走此逻辑 —— 内嵌页是 100vh 应用壳，scrollHeight 恒等于
            // iframe 当前高度，按内容自适应会形成反馈环。报表中心改用视口高度填充（_fitReportCenterContainer）。
          }

          if (e.data.type === 'dste-navigate' && e.data.pageId) {
            if (getPageMeta(e.data.pageId).isExternal) {
              openTab(e.data.pageId);
            } else {
              navigate(e.data.pageId);
            }
          }

          if (e.data.type === 'dste-open-ai' && e.data.prompt) {
            if (typeof window.toggleGlobalAiDrawer === 'function') {
              window.toggleGlobalAiDrawer();
              setTimeout(() => {
                if (typeof window.sendGlobalAiMessage === 'function') {
                  window.sendGlobalAiMessage(e.data.prompt);
                }
              }, 100);
            }
          }

          // 内嵌页捕获 Cmd+K 后请求父窗口打开命令面板
          if (e.data.type === 'dste-open-palette') {
            if (window.__dstePalette) window.__dstePalette.open();
          }
        });

        // 报表中心内嵌报表：容器高度填充剩余视口，iframe 内部自行滚动
        // （内嵌页是 100vh 应用壳，dste-embed-resize 报的 scrollHeight 恒等于 iframe 当前高度，不能按内容自适应）
        window._fitReportCenterContainer = function() {
          const c = document.getElementById('report-center-container');
          if (!c || !window._reportCenterActiveReport) return;
          c.style.height = Math.max(window.innerHeight - c.getBoundingClientRect().top - 16, 300) + 'px';
        };
        window.addEventListener('resize', () => window._fitReportCenterContainer());

        // 显示用户名
        updateUserUI();

        // 用户下拉菜单
        const avatar = document.getElementById('user-avatar');
        const dropdown = document.getElementById('user-dropdown');
        const logoutBtn = document.getElementById('user-logout');
        if (avatar && dropdown) {
          avatar.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('open');
          });
          document.addEventListener('click', (e) => {
            if (!avatar.contains(e.target) && !dropdown.contains(e.target)) {
              dropdown.classList.remove('open');
            }
          });
        }
        if (logoutBtn) {
          logoutBtn.addEventListener('click', logout);
        }

        // 移动端汉堡菜单切换
        const menuToggle = document.getElementById('mobile-menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        if (menuToggle && sidebar && overlay) {
          menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
          });
          overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
          });
          // 点击 sidebar 内的链接后自动关闭
          sidebar.addEventListener('click', (e) => {
            if (e.target.closest('.sidebar-item') || e.target.closest('[data-page]')) {
              sidebar.classList.remove('open');
              overlay.classList.remove('open');
            }
          });
        }
      }

      // ===== 全局周期选择器渲染 =====
      function renderCycleSelector() {
        const select = document.getElementById('global-cycle-select');
        if (!select) return;
        try {
          let cycles = JSON.parse(DSTE.Storage.getString('dste_cycles_v1') || '[]');
          // fallback: 如果周期数据不存在，自动创建默认值
          if (!cycles || cycles.length === 0) {
            cycles = [2025, 2026, 2027].map(year => ({
              id: `cycle_${year}_marketing`,
              year,
              name: `${year}年度 — 营销线`,
              phase: year < 2026 ? 'archived' : 'planning',
              organization: '营销线',
              parentCycleId: null
            }));
            omp_save('cycles', cycles);
          }
          const currentId = window._dsteState.currentCycleId;
          select.replaceChildren();
          cycles.forEach(c => {
            const option = document.createElement('option');
            option.value = c.id;
            option.textContent = c.name;
            if (c.id === currentId) option.selected = true;
            select.appendChild(option);
          });
        } catch(e) {}
      }

      // ===== 导航 =====
      // 外部页面映射
      function _renderPage(pageId, pushState = true) {
        if (!pageId) pageId = 'dashboard';

        const meta = getPageMeta(pageId);

        // 外部页面通过 iframe 嵌入工作区
        if (meta.isExternal && meta.externalFile) {
          // 同步 URL hash
          if (pushState && window.location.hash.slice(1) !== pageId) {
            window.location.hash = pageId;
          }

          currentPage = pageId;
          window.__dsteCurrentPageId = pageId;

          const phase = meta.phase || getPhaseFromPage(pageId);
          currentPhase = phase;

          // 更新顶部 active
          document.querySelectorAll('.top-nav-item').forEach(link => {
            link.classList.toggle('active', link.dataset.phase === phase);
          });

          // 更新左侧栏
          renderSidebar(phase);

          // 渲染 iframe：keep-alive 容器常驻 #workspace-panes，切页签只切显隐，首次激活才创建
          _showIframeWrap(pageId, meta);

          // 更新左侧 active
          document.querySelectorAll('.sidebar-item').forEach(item => {
            item.classList.toggle('active', item.dataset.page === pageId);
          });

          // 更新标题
          document.title = (meta.title || 'DSTE') + ' - DSTE 战略管理平台';
          return;
        }

        if (!PAGES[pageId]) pageId = 'dashboard';

        // 同步 URL hash（避免和 hashchange 循环触发）
        if (pushState && window.location.hash.slice(1) !== pageId) {
          window.location.hash = pageId;
        }

        currentPage = pageId;
        window.__dsteCurrentPageId = pageId;

        // 确定当前 phase
        const phase = getPhaseFromPage(pageId);
        currentPhase = phase;

        // 更新顶部 active
        document.querySelectorAll('.top-nav-item').forEach(link => {
          link.classList.toggle('active', link.dataset.phase === phase);
        });

        // 更新左侧栏
        renderSidebar(phase);

        // 更新内容
        const contentEl = document.getElementById('page-content');

        // 隐藏外部页 keep-alive 层（容器与 iframe 全部保留），恢复内部页容器显示
        const panesEl = _getWorkspacePanes();
        if (panesEl) panesEl.style.display = 'none';
        contentEl.style.display = '';

        // 保存当前焦点，避免 innerHTML 重建 DOM 后输入框失焦
        const activeEl = document.activeElement;
        const focusRestore = (activeEl && activeEl.id && contentEl.contains(activeEl) &&
          (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT'))
          ? { id: activeEl.id, start: activeEl.selectionStart, end: activeEl.selectionEnd, dir: activeEl.selectionDirection }
          : null;

        contentEl.style.animation = 'none';
        contentEl.offsetHeight; // trigger reflow
        contentEl.innerHTML = PAGES[pageId]();
        hydrateIcons(contentEl);
        contentEl.style.animation = '';

        // 若从侧边栏子目录携带了待打开的报表，进入报表中心后自动打开
        if (pageId === 'exe/report-center' && window._pendingReportId) {
          const pendingId = window._pendingReportId;
          window._pendingReportId = null;
          // 延迟到 DOM 渲染完成后打开
          requestAnimationFrame(() => openReport(pendingId));
        }

        // Roadmap 时间线默认滚动到最左侧（显示最新版本）
        if (pageId === 'dashboard/roadmap') {
          requestAnimationFrame(() => {
            const tl = document.getElementById('dev-timeline');
            if (tl) tl.scrollLeft = 0;
          });
        }

        // 绑定事件委托（替代内联 onclick）
        bindPageEvents(contentEl);

        // 恢复焦点与光标位置
        if (focusRestore) {
          const el = document.getElementById(focusRestore.id);
          if (el) {
            el.focus();
            if (typeof el.setSelectionRange === 'function' && focusRestore.start !== null) {
              const len = (el.value || '').length;
              const start = Math.min(focusRestore.start, len);
              const end = Math.min(focusRestore.end, len);
              el.setSelectionRange(start, end, focusRestore.dir || 'forward');
            }
          }
        }

        // AI 页面已改为抽屉，无需初始化

        // 更新左侧 active
        document.querySelectorAll('.sidebar-item').forEach(item => {
          item.classList.toggle('active', item.dataset.page === pageId);
        });

        // 更新标题
        document.title = (getPageTitle(pageId) || 'DSTE') + ' - DSTE 战略管理平台';
      }

      function navigate(pageId, pushState = true) {
        if (!pageId) pageId = 'dashboard';

        // AI 全屏页已改为抽屉：#ai 打开 dashboard 并拉起抽屉
        if (pageId === 'ai') {
          if (typeof window !== 'undefined' && window.toggleGlobalAiDrawer) {
            window.toggleGlobalAiDrawer();
          }
          pageId = 'dashboard';
        }

        const meta = getPageMeta(pageId);

        // 外部页面现在通过 iframe 嵌入工作区，不再整页跳转
        if (!meta.isExternal && !PAGES[pageId]) {
          pageId = 'dashboard';
        }

        // 同一页面只允许一个标签：若其他标签已打开该页面，激活并刷新该标签
        const existingTab = workspace.tabs.find(t => t.pageId === pageId && t.id !== workspace.activeTabId);
        if (existingTab) {
          workspace = switchWorkspaceTab(workspace, existingTab.id);
          renderTabs();
          _renderPage(pageId, pushState);
          return;
        }

        // 在当前 tab 内跳转，替换当前 tab 的页面
        updateActiveTab(pageId);

        _renderPage(pageId, pushState);
      }

      // ===== 事件委托（替代内联 onclick）=====
      function bindPageEvents(container) {
        if (container._dsteEventsBound) return;
        container._dsteEventsBound = true;
        container.addEventListener('click', (e) => {
          // data-navigate: 面包屑/相关链接导航
          const navLink = e.target.closest('[data-navigate]');
          if (navLink) {
            e.preventDefault();
            navigate(navLink.dataset.navigate);
            return;
          }
          // data-filter-roadmap: 路线图筛选
          const filterBtn = e.target.closest('[data-filter-roadmap]');
          if (filterBtn) {
            filterRoadmap(filterBtn.dataset.filterRoadmap);
            return;
          }
          // data-scroll-to: 平滑滚动到元素
          const scrollTrigger = e.target.closest('[data-scroll-to]');
          if (scrollTrigger) {
            const target = document.getElementById(scrollTrigger.dataset.scrollTo);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
          }
          // OMP: data-action 事件委托
          const actionBtn = e.target.closest('[data-action]');
          if (actionBtn) {
            try {
              const action = actionBtn.dataset.action;
              const id = actionBtn.dataset.id;
              const filter = actionBtn.dataset.filter;
              const view = actionBtn.dataset.view;
              switch(action) {
                case 'omp-switch-task-view': window.omp_switchTaskView(view); break;
                case 'omp-view-kpi': window.omp_viewKpi(id); break;
                case 'omp-edit-kpi': window.omp_editKpi(id); break;
                case 'omp-new-kpi': window.omp_newKpi(); break;
                case 'omp-view-task': window.omp_viewTask(id); break;
                case 'omp-edit-task': window.omp_editTask(id); break;
                case 'omp-new-task': window.omp_newTask(); break;
                case 'omp-pick-task-catalog': {
                  const selectedId = document.getElementById('omp-task-catalog-id')?.value || '';
                  openCatalogPicker({
                    scope: CATALOG_SCOPES.OMP_TASKS,
                    selectedId,
                    title: '选择重点工作目录',
                  }).then(node => {
                    if (!node) return;
                    const input = document.getElementById('omp-task-catalog-id');
                    const display = document.getElementById('omp-task-catalog-display');
                    if (input) input.value = node.id || '';
                    if (display) display.querySelector('span').textContent = node.id ? getCatalogPath(CATALOG_SCOPES.OMP_TASKS, node.id) : '未选择';
                  });
                  break;
                }
                case 'omp-delete-kpi': window.omp_deleteKpi(id); break;
                case 'omp-delete-task': window.omp_deleteTask(id); break;
                case 'omp-task-edit-tab': window.omp_switchTaskEditTab(actionBtn.dataset.tab); break;
                case 'omp-task-view-tab': window.omp_switchTaskViewTab(actionBtn.dataset.tab); break;
                case 'omp-add-subtask': window.omp_addSubtaskRow(actionBtn.dataset.parentId); break;
                case 'omp-remove-subtask': window.omp_removeSubtaskRow(actionBtn); break;
                case 'omp-move-subtask-up': window.omp_moveSubtaskRow(actionBtn, 'up'); break;
                case 'omp-move-subtask-down': window.omp_moveSubtaskRow(actionBtn, 'down'); break;
                case 'omp-delete-subtask': window.omp_deleteSubtask(actionBtn.dataset.id); break;
                case 'omp-edit-subtask': window.omp_editTask(actionBtn.dataset.id); break;
                case 'omp-restore-auto-progress': window.omp_restoreAutoProgress(actionBtn.dataset.id); break;
                case 'omp-toggle-task-expand': window.omp_toggleTaskExpand(actionBtn.dataset.id); break;
                case 'omp-export': window.omp_exportData(); break;
                case 'omp-edit-monthly-progress': window.omp_openMonthlyProgressModal(actionBtn.dataset.taskId, actionBtn.dataset.month); break;
                case 'omp-delete-monthly-progress': window.omp_deleteMonthlyProgress(actionBtn.dataset.recordId); break;
                case 'omp-toggle-view':
                  window._ompState.kpiViewMode = actionBtn.dataset.view;
                  navigate('exe/kpi');
                  break;
                case 'omp-decompose-kpi': window.omp_openDecomposeModal(id); break;
                case 'omp-filter-kpi':
                  if (filter) { window._ompState.kpiFilter[filter] = actionBtn.value; navigate('exe/kpi'); }
                  break;
                case 'omp-filter-task':
                  if (filter) { window._ompState.taskFilter[filter] = actionBtn.value; navigate('exe/tasks'); }
                  break;
                case 'omp-staffing-remove-member':
                  window.omp_staffingRemoveMember(actionBtn.dataset.taskId || actionBtn.closest('[data-task-id]')?.dataset?.taskId, actionBtn.dataset.personRef);
                  break;
                case 'omp-staffing-search':
                  // input event handled separately via change/input listener
                  break;
                case 'omp-staffing-toggle-org':
                  window.omp_staffingToggleOrg(actionBtn.dataset.orgId);
                  break;
                case 'omp-staffing-select-org':
                  window.omp_staffingSelectOrg(actionBtn.dataset.orgId);
                  break;
                case 'omp-staffing-clear-search':
                  window.omp_staffingClearSearch();
                  break;
              case 'version-audit-refresh':
                window.refreshVersionAudit();
                break;
              case 'version-audit-copy':
                window.copyVersionAuditReport();
                break;

              console.error('[OMP] 处理操作失败:', actionBtn.dataset.action, err);

        // 重点工作人员配置台：拖拽分配（PRD v1.8：从通讯录拖拽人员到任务卡片）
        container.addEventListener('dragstart', (e) => {
          const memberChip = e.target.closest('[data-drag="member-chip"]');
          if (memberChip) {
            e.dataTransfer.setData('text/plain', JSON.stringify({
              action: 'reorder',
              personRef: memberChip.dataset.personRef,
              sourceTaskId: memberChip.dataset.taskId,
            }));
            e.dataTransfer.effectAllowed = 'move';
            memberChip.classList.add('dragging');
            document.querySelectorAll('[data-drop="matrix-member"]').forEach(el => el.classList.add('drop-ready'));
            return;
          }
          const personCard = e.target.closest('[data-drag="person"]');
          if (!personCard) return;
          const personRef = personCard.dataset.personRef;
          e.dataTransfer.setData('text/plain', JSON.stringify({ personRef }));
          e.dataTransfer.effectAllowed = 'copy';
          personCard.classList.add('dragging');
          document.querySelectorAll('[data-drop="task"], [data-drop="matrix-member"]').forEach(el => el.classList.add('drop-ready'));
        });
        container.addEventListener('dragend', (e) => {
          const memberChip = e.target.closest('[data-drag="member-chip"]');
          if (memberChip) memberChip.classList.remove('dragging');
          const personCard = e.target.closest('[data-drag="person"]');
          if (personCard) personCard.classList.remove('dragging');
          document.querySelectorAll('[data-drop="task"], [data-drop="matrix-member"]').forEach(el => el.classList.remove('drop-active', 'drop-ready'));
          document.querySelectorAll('.omp-matrix-member-chip').forEach(el => el.classList.remove('drop-before', 'drop-after'));
        });
        container.addEventListener('dragover', (e) => {
          const dropTarget = e.target.closest('[data-drop="task"], [data-drop="matrix-member"]');
          if (!dropTarget) return;
          e.preventDefault();

          const memberChip = e.target.closest('[data-drag="member-chip"]');
          // 重排时 effectAllowed 为 move；外部人员拖入为 copy
          const isReorder = e.dataTransfer.effectAllowed === 'move' || e.dataTransfer.effectAllowed === 'copyMove' || e.dataTransfer.effectAllowed === 'all';

          if (isReorder && memberChip) {
            e.dataTransfer.dropEffect = 'move';
            document.querySelectorAll('.omp-matrix-member-chip').forEach(el => el.classList.remove('drop-before', 'drop-after'));
            const rect = memberChip.getBoundingClientRect();
            const before = e.clientX < rect.left + rect.width / 2;
            memberChip.classList.add(before ? 'drop-before' : 'drop-after');
          } else {
            e.dataTransfer.dropEffect = 'copy';
          }
        });
        container.addEventListener('dragenter', (e) => {
          const dropTarget = e.target.closest('[data-drop="task"], [data-drop="matrix-member"]');
          if (!dropTarget) return;
          e.preventDefault();
          dropTarget.classList.add('drop-active');
        });
        container.addEventListener('dragleave', (e) => {
          const dropTarget = e.target.closest('[data-drop="task"], [data-drop="matrix-member"]');
          if (!dropTarget) return;
          const related = e.relatedTarget;
          if (dropTarget.contains(related)) return;
          dropTarget.classList.remove('drop-active');
        });
        container.addEventListener('drop', (e) => {
          const dropTarget = e.target.closest('[data-drop="task"], [data-drop="matrix-member"]');
          if (!dropTarget) return;
          e.preventDefault();
          dropTarget.classList.remove('drop-active');
          document.querySelectorAll('[data-drop="task"], [data-drop="matrix-member"]').forEach(el => el.classList.remove('drop-ready'));
          document.querySelectorAll('.omp-matrix-member-chip').forEach(el => el.classList.remove('drop-before', 'drop-after'));
          const raw = e.dataTransfer.getData('text/plain');
          if (!raw) return;
          try {
            const payload = JSON.parse(raw);
            if (payload.action === 'reorder' && payload.personRef && payload.sourceTaskId) {
              const memberChip = e.target.closest('[data-drag="member-chip"]');
              if (memberChip && memberChip.dataset.taskId === payload.sourceTaskId) {
                const rect = memberChip.getBoundingClientRect();
                const before = e.clientX < rect.left + rect.width / 2;
                window.omp_staffingReorderMember(payload.sourceTaskId, payload.personRef, memberChip.dataset.personRef, before);
              }
              return;
            }
            if (payload.personRef) {
              window.omp_staffingAssignDrag([dropTarget.dataset.taskId], payload.personRef, 'member');
            }
          } catch (err) {}
        });

              navigate('exe/tasks');
            }, 300);
          });
        }
      }

      // ===== 驾驶舱概览 =====
      function renderDashboard() {
        // 使用真实数据前确保 OMP 数据已初始化（首次访问自动补种子/迁移），与 renderTasks 保持一致
        omp_initData();
        const cycleId = window._dsteState.currentCycleId;
        // 演示数据角标：暂无真实数据源的指标保留硬编码数值，统一标注说明（配色跟随主题）
        const DEMO_BADGE = '<span class="demo-badge" style="font-size:10px;font-weight:400;padding:1px 6px;border-radius:4px;background:var(--bg-page);color:var(--text-tertiary);border:1px solid var(--border-light);margin-left:6px;vertical-align:middle;white-space:nowrap;">演示数据</span>';
        // owner 兼容字符串与 PersonRef 对象两种形态
        const personLabel = p => (typeof p === 'string' ? p : (p && (p.displayName || p.name))) || '-';

        // ---- 重点工作（OMP tasks）：优先 OMP 执行任务；尚未派生时回退到周期内全部任务 ----
        const allTasks = omp_load('tasks') || [];
        const cycleTasks = allTasks.filter(t => t && t.cycleId === cycleId);
        const ompExecTasks = cycleTasks.filter(t => t.source === 'omp');
        const dashTasks = (ompExecTasks.length > 0 ? ompExecTasks : cycleTasks).filter(t => !t.parentId);
        const totalTasks = dashTasks.length;
        const doneTasks = dashTasks.filter(t => t.status === 'done' || t.status === 'closed').length;
        const delayedTasks = dashTasks.filter(t => t.status === 'delayed').length;
        const taskCompletionRate = totalTasks > 0 ? Math.round(doneTasks / totalTasks * 100) : 0;
        const taskStatusMeta = {
          planning: { label: '规划中', cls: 'status-warning' },
          active: { label: '进行中', cls: 'status-success' },
          at_risk: { label: '有风险', cls: 'status-warning' },
          delayed: { label: '已延期', cls: 'status-danger' },
          done: { label: '已完成', cls: 'status-success' },
          closed: { label: '已关闭', cls: 'status-success' },
        };
        const taskRows = dashTasks.slice(0, 5).map(t => {
          const meta = taskStatusMeta[t.status] || { label: t.status || '未知', cls: 'status-warning' };
          const progress = Math.max(0, Math.min(100, Number(t.progress) || 0));
          const fillCls = t.status === 'delayed' ? ' danger' : (t.status === 'at_risk' ? ' warning' : '');
          return `<tr><td><strong>${escapeHtml(t.name || '未命名任务')}</strong></td><td>${escapeHtml(personLabel(t.owner))}</td><td><div class="flex-row"><div class="progress-bar width-120"><div class="progress-bar-fill${fillCls}" style="width:${progress}%"></div></div><span class="text-xs-only">${progress}%</span></div></td><td><span class="status-badge ${meta.cls}">${escapeHtml(meta.label)}</span></td><td>${escapeHtml(t.endDate || '-')}</td></tr>`;
        }).join('');
        const taskTableBody = taskRows || '<tr><td colspan="5" style="text-align:center;color:var(--text-tertiary);padding:20px;">暂无重点工作，可前往「重点工作管理」创建</td></tr>';

        // ---- KPI 实例（OMP kpiInstances）：BSC 维度聚合 + 预警列表 ----
        const dashIndicators = omp_load('indicators') || [];
        const dashKpis = (omp_load('kpiInstances') || []).filter(k => k && k.cycleId === cycleId);
        const alertKpis = dashKpis.filter(k => k.status === 'warning' || k.status === 'lagging');
        const alertCount = alertKpis.length;

        const bscDims = [
          { key: 'financial', name: '财务维度' },
          { key: 'customer', name: '客户维度' },
          { key: 'process', name: '流程维度' },
          { key: 'learning', name: '学习成长' },
        ];
        const bscCards = bscDims.map(dim => {
          const list = dashKpis.filter(k => (k.bscDimension === 'internal' ? 'process' : (k.bscDimension || 'financial')) === dim.key);
          if (!list.length) return '';
          const avgRate = Math.round(list.reduce((s, k) => s + (Number(k.achievementRate) || 0), 0) / list.length);
          // 维度状态取最差：落后 > 预警 > 正常
          const worst = list.some(k => k.status === 'lagging') ? 'lagging' : (list.some(k => k.status === 'warning') ? 'warning' : 'achieved');
          const meta = worst === 'lagging'
            ? { color: 'var(--danger)', label: '落后' }
            : (worst === 'warning' ? { color: 'var(--warning)', label: '预警' } : { color: 'var(--success)', label: '正常' });
          return `<div style="padding: 16px; background: var(--bg-page); border-radius: 8px; border-left: 4px solid ${meta.color};">
                  <div class="text-sm-tertiary">${dim.name}</div>
                  <div class="text-lg-primary mt-1">${list.length} 项指标 · 达成 ${avgRate}%</div>
                  <div style="font-size: 12px; color: ${meta.color}; margin-top: 4px;"><span class="icon" data-icon="${worst === 'achieved' ? 'check' : 'warning'}" data-icon-size="14"></span> ${meta.label}</div>
                </div>`;
        }).join('');
        const bscContent = bscCards || '<div style="grid-column: 1 / -1; padding: 24px; text-align: center; color: var(--text-tertiary); font-size: 13px;">暂无 KPI 数据</div>';

        // 预警列表：真实预警（warning/lagging 的 KPI 实例），另保留一条演示预警作展示
        const alertItems = alertKpis.slice(0, 5).map(k => {
          const ind = dashIndicators.find(i => i.id === k.indicatorId);
          const color = k.status === 'lagging' ? 'var(--danger)' : 'var(--warning)';
          return `<div style="padding: 12px; background: color-mix(in srgb, ${color} 5%, transparent); border-radius: 8px; border-left: 3px solid ${color};">
                  <div style="font-size: 13px; font-weight: 500; color: ${color};">${escapeHtml(ind ? ind.name : '未知指标')}</div>
                  <div class="text-xs-tertiary-mt">${escapeHtml(k.dept || '-')} · 达成率 ${Number(k.achievementRate) || 0}%（${k.status === 'lagging' ? '落后' : '预警'}）</div>
                </div>`;
        }).join('');
        const noAlertHtml = '<div style="padding: 12px; text-align: center; color: var(--success); font-size: 13px;"><span class="icon" data-icon="check" data-icon-size="14"></span> 当前无预警</div>';

        // ---- 经营分析会（dste_meetings）：优先 init 后台加载的内存数据，回退 localStorage ----
        let dashMeetings = [];
        try {
          dashMeetings = (Array.isArray(window._meetingsData) && window._meetingsData.length)
            ? window._meetingsData
            : (DSTE.Storage.get('dste_meetings', []) || []);
        } catch (e) { dashMeetings = []; }
        const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
        const meetingDate = m => { const d = new Date(m && m.date); return isNaN(d.getTime()) ? null : d; };
        const upcomingMeeting = dashMeetings
          .filter(m => m.status !== 'completed' && meetingDate(m) && meetingDate(m) >= todayStart)
          .sort((a, b) => meetingDate(a) - meetingDate(b))[0] || null;
        const lastCompletedMeeting = dashMeetings
          .filter(m => m.status === 'completed' && meetingDate(m))
          .sort((a, b) => meetingDate(b) - meetingDate(a))[0] || null;
        const meetingStatusMeta = {
          completed: { label: '已完成', cls: 'status-success' },
          in_progress: { label: '进行中', cls: 'status-warning' },
          planned: { label: '待召开', cls: 'status-warning' },
        };
        const fmtMeetingDate = m => { const d = meetingDate(m); return d ? `${d.getMonth() + 1}月${d.getDate()}日` : '-'; };
        const meetingCards = [];
        if (upcomingMeeting) {
          const days = Math.round((meetingDate(upcomingMeeting) - todayStart) / 86400000);
          const countdown = days <= 0 ? '今天' : (days === 1 ? '明天' : `${days} 天后`);
          const meta = meetingStatusMeta[upcomingMeeting.status] || { label: '待召开', cls: 'status-warning' };
          meetingCards.push(`<div style="min-width: 200px; padding: 16px; background: var(--bg-page); border-radius: 8px; border: 2px solid var(--primary);">
                <div style="font-size: 12px; color: var(--primary); font-weight: 600;">下次会议</div>
                <div class="text-md-semibold-mt">${escapeHtml(upcomingMeeting.title || '未命名会议')}</div>
                <div class="text-sm-tertiary-mt">${countdown} | ${fmtMeetingDate(upcomingMeeting)}</div>
                <div class="mt-2"><span class="status-badge ${meta.cls}">${meta.label}</span></div>
              </div>`);
        }
        if (lastCompletedMeeting) {
          meetingCards.push(`<div style="min-width: 200px; padding: 16px; background: var(--bg-page); border-radius: 8px;">
                <div class="text-xs-tertiary">最近已完成</div>
                <div class="text-md-semibold-mt">${escapeHtml(lastCompletedMeeting.title || '未命名会议')}</div>
                <div class="text-sm-tertiary-mt">${fmtMeetingDate(lastCompletedMeeting)}</div>
                <div class="mt-2"><span class="status-badge status-success">已完成</span></div>
              </div>`);
        }
        const meetingsContent = meetingCards.length
          ? meetingCards.join('')
          : '<div style="padding: 24px; text-align: center; color: var(--text-tertiary); font-size: 13px; width: 100%;">暂无会议安排</div>';

        return `
          <div class="page-header">
            <h1 class="page-title">战略驾驶舱</h1>
            <div class="page-actions">
              <button class="btn btn-secondary"><span class="icon" data-icon="calendar" data-icon-size="14"></span> 2026 Q1</button>
              <button class="btn btn-primary">+ 自定义视图</button>
            </div>
          </div>

          <!-- 欢迎卡片 -->
          <div class="card" style="margin-bottom: 16px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div>
                <div style="font-size: 16px; font-weight: 600; color: var(--text-primary);">欢迎回来，${sessionStorage.getItem('dste-user') || '张总'}</div>
                <div class="text-sm-tertiary-mt">当前战略周期: 2026-2028 | 本季度剩余 45 天${DEMO_BADGE}</div>
              </div>
              <div style="display: flex; gap: 8px;">
                ${alertCount > 0
                  ? `<span class="status-badge status-warning">${alertCount} 项预警</span>`
                  : '<span class="status-badge status-success">经营正常</span>'}
              </div>
            </div>
          </div>

          <!-- KPI -->
          <div class="kpi-grid">
            <div class="kpi-card">
              <div class="kpi-label">营收增长率${DEMO_BADGE}</div>
              <div class="kpi-value success-text">27.6%</div>
              <div class="kpi-trend up"><span>↑</span><span>目标 30% | 达成率 92%</span></div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">客户满意度 (NPS)${DEMO_BADGE}</div>
              <div class="kpi-value" style="color: var(--danger);">62</div>
              <div class="kpi-trend down"><span>↓</span><span>目标 70 | 差距 -8</span></div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">新产品收入占比${DEMO_BADGE}</div>
              <div class="kpi-value" style="color: var(--warning);">28.4%</div>
              <div class="kpi-trend warning"><span>→</span><span>目标 35% | 达成率 81%</span></div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">重点工作完成率</div>
              <div class="kpi-value success-text">${totalTasks > 0 ? taskCompletionRate + '%' : '—'}</div>
              <div class="kpi-trend up"><span>↑</span><span>${totalTasks > 0 ? `${doneTasks}/${totalTasks} 完成 | ${delayedTasks} 项延期` : '暂无重点工作'}</span></div>
            </div>
          </div>

          <!-- 战略地图 & 预警 -->
          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
            <div class="card">
              <div class="card-header">
                <div class="card-title"><span class="icon" data-icon="sp/strategy-map" data-icon-size="16"></span> 战略地图概览</div>
                <a href="#sp/strategy-map" class="link-primary" data-navigate="sp/strategy-map">查看详情 →</a>
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                ${bscContent}
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <div class="card-title"><span class="icon" data-icon="notification" data-icon-size="16"></span> 预警通知</div>
                <span class="text-xs-tertiary">${alertCount > 0 ? alertCount + ' 条待处理' : '运行正常'}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 12px;">
                ${alertItems || noAlertHtml}
                <div style="padding: 12px; background: color-mix(in srgb, var(--warning) 5%, transparent); border-radius: 8px; border-left: 3px solid var(--warning);">
                  <div style="font-size: 13px; font-weight: 500; color: var(--warning);">供应链成本上升${DEMO_BADGE}</div>
                  <div class="text-xs-tertiary-mt">Q3 成本环比 +12%</div>
                </div>
              </div>
            </div>
          </div>

          <!-- 重点工作 -->
          <div class="card mt-4">
            <div class="card-header">
              <div class="card-title"><span class="icon" data-icon="exe/tasks" data-icon-size="16"></span> 重点工作进度</div>
              <a href="#exe/tasks" class="link-primary" data-navigate="exe/tasks">查看全部 →</a>
            </div>
            <table class="data-table">
              <thead><tr><th>工作名称</th><th>负责人</th><th>进度</th><th>状态</th><th>截止日期</th></tr></thead>
              <tbody>
                ${taskTableBody}

            </table>

          <div class="card mt-4">
            <div class="card-header">
              <div class="card-title"><span class="icon" data-icon="target" data-icon-size="14"></span> 经营分析会</div>

            <div style="display: flex; gap: 16px; overflow-x: auto;">

      // ===== 组织绩效管理模块 (OMP) =====
      function renderTasks() {
        omp_initData();
        const cycleId = window._dsteState.currentCycleId;
        // 幂等补齐：把当前周期中尚未派生的年度计划重点工作同步为 OMP 执行任务。
        // 这样无论是否已发布、是否已有其他 OMP 任务，新增的年度计划重点工作都能自动出现在战略执行侧。
        if (omp_syncAnnualPlanTasksToExecution(cycleId)) {
          // 若新增 OMP 任务，立即把里程碑/进度记录关联过来
          omp_syncMilestonesAndRecordsToOmpTasks();

        // 自动聚合存在子任务的父任务进度
        const tasks = omp_load('tasks') || [];
        let progressChanged = false;
        tasks.forEach(t => {
          if (t && !t.parentId && hasSubtasks(tasks, t.id) && !t.progressOverridden) {
            if (recalculateParentProgress(tasks, t.id)) progressChanged = true;
          }
        });
        if (progressChanged) omp_save('tasks', tasks);
        const rawViewMode = window._ompState.taskViewMode || 'list';
