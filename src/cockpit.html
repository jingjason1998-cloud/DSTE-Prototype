      // ===== KPI 指标树 — 卡片式层级视图 =====
      function omp_kpiBuildTree(kpis) {
        const childrenMap = {};
        kpis.forEach(k => { childrenMap[k.id] = []; });
        kpis.forEach(k => {
          if (k.parentId && childrenMap[k.parentId] !== undefined) {
            childrenMap[k.parentId].push(k);
          }
        });
        const roots = kpis.filter(k => !k.parentId || !kpis.find(p => p.id === k.parentId));
        return { roots, childrenMap };
      }

      function omp_kpiRenderRing(rate, size) {
        const r = Math.round(size / 2) - 4;
        const c = Math.round(2 * Math.PI * r * 100) / 100;
        const dash = Math.round(c * Math.min(rate, 100) / 100 * 100) / 100;
        const color = rate >= 95 ? 'var(--success)' : rate >= 80 ? 'var(--warning)' : 'var(--danger)';
        const glow = rate >= 100 ? 'filter: drop-shadow(0 0 4px color-mix(in srgb, var(--success) 40%, transparent));' : '';
        const center = Math.round(size / 2);
        return `<svg class="omp-kpi-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="${glow} flex-shrink:0;">
          <circle cx="${center}" cy="${center}" r="${r}" fill="none" stroke="var(--border-color)" stroke-width="3"/>
          <circle cx="${center}" cy="${center}" r="${r}" fill="none" stroke="${color}" stroke-width="3"
            stroke-dasharray="${dash} ${c}" stroke-linecap="round" transform="rotate(-90 ${center} ${center})"/>
        </svg>`;
      }

      function omp_renderKpiTree(kpis, indicators, statusBadge, miniTrend) {
        const expandedIds = window._ompState.kpiExpandedIds;
        const { roots, childrenMap } = omp_kpiBuildTree(kpis);
        // BSC 维度配置（用于角标颜色）
        const BSC_DIMENSIONS = {
          financial: { name: '财务', color: 'var(--dim-financial)' },
          customer:  { name: '客户', color: 'var(--dim-customer)' },
          internal:  { name: '流程', color: 'var(--dim-process)' },
          learning:  { name: '成长', color: 'var(--dim-learning)' }
        };
        // 首次渲染时，自动展开所有根节点（一次性）
        if (!window._ompState.kpiTreeAutoExpanded) {
          roots.forEach(r => {
            if (childrenMap[r.id] && childrenMap[r.id].length > 0) {
              expandedIds.add(r.id);
            }
          });
          window._ompState.kpiTreeAutoExpanded = true;
        }
        // 画布状态
        const canvasState = window._ompState.kpiCanvasState || {};
        const scale = canvasState.scale || 1;
        const offsetX = canvasState.offsetX || 0;
        const offsetY = canvasState.offsetY || 0;

        // 收集所有可见节点
        const visibleNodes = [];
        const visibleEdges = []; // { from: kpiId, to: kpiId }

        function traverse(kpi) {
          visibleNodes.push(kpi);
          const hasChildren = childrenMap[kpi.id] && childrenMap[kpi.id].length > 0;
          const isExpanded = expandedIds.has(kpi.id);
          if (hasChildren && isExpanded) {
            childrenMap[kpi.id].forEach(child => {
              visibleEdges.push({ from: kpi.id, to: child.id });
              traverse(child);
            });
          }
        }
        roots.forEach(r => traverse(r));

        // 自动布局：如果节点没有位置，计算默认位置
        // 使用简单的层级布局：根在左，子向右展开
        const nodePositions = {};
        const levelWidth = 220;
        const nodeHeight = 110;
        const levelNodes = {}; // { level: [kpiId, ...] }
        
        function collectLevels(kpi, level) {
          if (!levelNodes[level]) levelNodes[level] = [];
          levelNodes[level].push(kpi.id);
          const isExpanded = expandedIds.has(kpi.id);
          if (childrenMap[kpi.id] && isExpanded) {
            childrenMap[kpi.id].forEach(child => collectLevels(child, level + 1));
          }
        }
        roots.forEach(r => collectLevels(r, 0));

        // 计算每个节点的位置
        function sanitizePos(val, fallback) {
          const n = parseFloat(val);
          return (Number.isFinite(n) && n >= 0) ? n : fallback;
        }
        Object.entries(levelNodes).forEach(([level, ids]) => {
          const lvl = parseInt(level);
          const x = lvl * levelWidth + 20;
          ids.forEach((id, idx) => {
            const kpi = kpis.find(k => k.id === id);
            // 优先使用保存的位置（严格校验：非 null/undefined、有效数字、非负）
            const savedX = kpi && kpi.x != null ? parseFloat(kpi.x) : NaN;
            const savedY = kpi && kpi.y != null ? parseFloat(kpi.y) : NaN;
            if (Number.isFinite(savedX) && Number.isFinite(savedY) && savedX > 0 && savedY > 0) {
              nodePositions[id] = {
                x: savedX,
                y: savedY,
                w: sanitizePos(kpi.width, 170),
                h: sanitizePos(kpi.height, 100)
              };
            } else {
              const y = idx * (nodeHeight + 20) + 20;
              nodePositions[id] = { x, y, w: 170, h: 100 };
            }
          });
        });

        // 强制净化：确保 nodePositions 中所有坐标都是有效数字
        Object.keys(nodePositions).forEach(id => {
          const p = nodePositions[id];
          if (!Number.isFinite(p.x) || p.x < 0) p.x = 20;
          if (!Number.isFinite(p.y) || p.y < 0) p.y = 20;
          if (!Number.isFinite(p.w) || p.w <= 0) p.w = 170;
          if (!Number.isFinite(p.h) || p.h <= 0) p.h = 100;
        });

        // 渲染节点 HTML
        const nodesHtml = visibleNodes.map(kpi => {
          const ind = indicators.find(i => i.id === kpi.indicatorId);
          const pos = nodePositions[kpi.id] || { x: 0, y: 0, w: 170, h: 100 };
          const hasChildren = childrenMap[kpi.id] && childrenMap[kpi.id].length > 0;
          const isExpanded = expandedIds.has(kpi.id);
          const statusClass = kpi.status === 'achieved' ? 'achieved' : kpi.status === 'warning' ? 'warning' : 'lagging';
          const dimKey = kpi.bscDimension || 'financial';
          const displayName = ind ? ind.name : '未知';
          const unit = ind ? ind.unit : '';
          const progressWidth = Math.min(kpi.achievementRate, 100);
          
          return `<div class="omp-canvas-node status-${kpi.status}" data-id="${kpi.id}" data-level="${kpi.level}" data-dim="${dimKey}"
            style="left:${pos.x}px;top:${pos.y}px;width:${pos.w}px;height:${pos.h}px;"
            onmousedown="window.omp_canvasNodeDragStart(event,'${kpi.id}')">
            <div class="omp-dim-badge ${dimKey}"></div>
            <div class="canvas-node-name">${displayName}${kpi.annualPlanKpiId ? `<span style="font-size:10px;padding:1px 5px;border-radius:3px;background:var(--success-bg);color:var(--success);margin-left:6px;vertical-align:middle;">年度计划</span>` : ''}</div>
            ${kpi.dept && kpi.level > 0 ? `<div class="canvas-node-dept">${kpi.dept}</div>` : ''}
            ${(() => {
              const lvlCfg = ASSESSMENT_LEVELS[kpi.assessmentLevel || 'marketing-line'];
              return `<div class="canvas-node-level" style="font-size:10px;color:${lvlCfg.color};margin-top:2px;">${lvlCfg.label}</div>`;
            })()}
            <div class="canvas-node-metric">目标 <strong>${kpi.targetValue}</strong>${unit} / 实际 <strong>${kpi.actualValue}</strong>${unit}</div>
            <div class="canvas-node-progress">
              <div class="canvas-node-progress-bar"><div class="${statusClass}" style="width:${progressWidth}%"></div></div>
              <div class="canvas-node-progress-text ${statusClass}">${kpi.achievementRate}%</div>
            </div>
            ${hasChildren ? `<span class="canvas-node-expand" onclick="event.stopPropagation();window.omp_toggleExpand('${kpi.id}')">${isExpanded ? '−' : '+'}</span>` : ''}
          </div>`;
        }).join('');

        // 渲染 SVG 连接线（保守写法：任何无效值都用 || 0 兜底）
        const svgPaths = visibleEdges.map(edge => {
          const fromPos = nodePositions[edge.from];
          const toPos = nodePositions[edge.to];
          if (!fromPos || !toPos) return '';
          const fx = (fromPos.x || 0); const fy = (fromPos.y || 0);
          const fw = (fromPos.w || 170); const fh = (fromPos.h || 100);
          const tx = (toPos.x || 0); const ty = (toPos.y || 0);
          const tw = (toPos.w || 170); const th = (toPos.h || 100);
          const x1 = fx + fw;
          const y1 = fy + fh / 2;
          const x2 = tx;
          const y2 = ty + th / 2;
          const midX = (x1 + x2) / 2;
          return `<path d="M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}" />`;
        }).join('');

        // 计算画布尺寸
        let maxX = 0, maxY = 0;
        Object.values(nodePositions).forEach(p => {
          maxX = Math.max(maxX, p.x + p.w);
          maxY = Math.max(maxY, p.y + p.h);
        });
        const canvasW = Math.max(maxX + 100, 1200);
        const canvasH = Math.max(maxY + 100, 700);

        return `
          <div class="omp-kpi-canvas" id="omp-kpi-canvas"
            onmousedown="window.omp_canvasPanStart(event)"
            onwheel="window.omp_canvasZoom(event)">
            <div class="omp-canvas-toolbar">
              <button onclick="window.omp_canvasReset()">⟲ 重置</button>
              <button onclick="window.omp_canvasZoomIn()">+</button>
              <button onclick="window.omp_canvasZoomOut()">−</button>
              <button onclick="window.omp_canvasSaveLayout()"><span class="icon" data-icon="floppy-disk" data-icon-size="14"></span> 保存布局</button>
            </div>
            <div class="omp-canvas-zoom" id="omp-canvas-zoom">100%</div>
            <div class="omp-kpi-canvas-inner" id="omp-kpi-canvas-inner" style="width:${canvasW}px;height:${canvasH}px;transform:translate(${offsetX}px,${offsetY}px) scale(${scale});">
              <svg class="omp-canvas-svg" width="${canvasW}" height="${canvasH}">${svgPaths}</svg>
              ${nodesHtml}
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12px;color:var(--text-tertiary);margin-top:8px;">
            <span>共 ${roots.length} 个一级指标 · ${visibleNodes.length} 个可见节点（画布）</span>
            <span>拖拽节点调整位置 · 滚轮缩放 · 拖拽空白平移</span>
          </div>`;
      }

      // ===== Tab 3: 重点工作 =====
      function omp_renderTaskTab() {
        const cycleId = window._dsteState.currentCycleId;
        const tasks = omp_load('tasks');
        const kpis = omp_load('kpiInstances').filter(k => k.cycleId === cycleId);
        const filter = window._ompState.taskFilter || { status: 'all', dept: 'all', type: 'all', catalog: 'all' };

        const catalogs = loadCatalogs(CATALOG_SCOPES.OMP_TASKS);
        const catalogOptions = [`<option value="all">全部目录</option>`]
          .concat(catalogs.filter(c => c.status === 'active').map(c =>
            `<option value="${escapeHtml(c.id)}" ${filter.catalog === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
          )).join('');

        const depts = [...new Set(tasks.filter(t => t.cycleId === cycleId && t.source === 'omp' && !t.parentId).map(t => t.dept).filter(Boolean))];
        const deptOptions = [`<option value="all">全部部门</option>`]
          .concat(depts.map(d => `<option value="${escapeHtml(d)}" ${filter.dept === d ? 'selected' : ''}>${escapeHtml(d)}</option>`))
          .join('');

        const filtered = tasks.filter(t => {
          if (t.cycleId !== cycleId || t.source !== 'omp' || t.parentId) return false;
          if (filter.status !== 'all' && t.status !== filter.status) return false;
          if (filter.dept !== 'all' && t.dept !== filter.dept) return false;
          if (filter.type !== 'all' && t.type !== filter.type) return false;
          if (filter.catalog !== 'all' && t.catalogId !== filter.catalog) return false;
          return true;
        });

        return `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <select class="form-input-compact" data-action="omp-filter-task" data-filter="status" style="min-width:100px;">
                <option value="all" ${filter.status === 'all' ? 'selected' : ''}>全部状态</option>
                <option value="planning" ${filter.status === 'planning' ? 'selected' : ''}>规划中</option>
                <option value="active" ${filter.status === 'active' ? 'selected' : ''}>进行中</option>
                <option value="at_risk" ${filter.status === 'at_risk' ? 'selected' : ''}>有风险</option>
                <option value="delayed" ${filter.status === 'delayed' ? 'selected' : ''}>已延期</option>
                <option value="done" ${filter.status === 'done' ? 'selected' : ''}>已完成</option>
                <option value="closed" ${filter.status === 'closed' ? 'selected' : ''}>已关闭</option>
              </select>
              <select class="form-input-compact" data-action="omp-filter-task" data-filter="dept" style="min-width:120px;">${deptOptions}</select>
              <select class="form-input-compact" data-action="omp-filter-task" data-filter="type" style="min-width:120px;">
                <option value="all" ${filter.type === 'all' ? 'selected' : ''}>全部类型</option>
                <option value="strategic" ${filter.type === 'strategic' ? 'selected' : ''}>战略举措</option>
                <option value="improvement" ${filter.type === 'improvement' ? 'selected' : ''}>业务改进</option>
                <option value="capability" ${filter.type === 'capability' ? 'selected' : ''}>能力建设</option>
                <option value="risk_response" ${filter.type === 'risk_response' ? 'selected' : ''}>风险应对</option>
              </select>
              <select class="form-input-compact" data-action="omp-filter-task" data-filter="catalog" style="min-width:140px;">${catalogOptions}</select>
            </div>
            <button class="btn btn-primary" data-action="omp-new-task" class="text-sm-only">+ 新建工作</button>
          </div>
          <div class="card">
            <div class="overflow-x-auto">
              <table class="data-table">
                <thead>
                  <tr><th>工作名称</th><th>目录</th><th>负责人</th><th>成员</th><th class="text-center">进度</th><th>截止日期</th><th class="text-center">操作</th></tr>
                </thead>
                <tbody>
                  ${filtered.map(t => {
                    const associations = Array.isArray(t.kpiAssociations) ? t.kpiAssociations : [];
                    const primary = associations.find(a => a.relationType === 'primary');
                    const firstSupporting = associations.find(a => a.relationType === 'supporting');
                    const displayAssociation = primary || firstSupporting;
                    const displayName = displayAssociation ? omp_getKpiAssociationDisplayName(displayAssociation) : '';
                    const displayLabel = displayName ? (primary ? displayName : `${displayName}（相关）`) : '';
                    const tooltipNames = associations.map(a => {
                      const name = omp_getKpiAssociationDisplayName(a);
                      return `${a.relationType === 'primary' ? '主指标' : '相关指标'}: ${name}`;
                    }).join('\n');
                    const sourceTag = (() => {
                      if (!t.annualPlanTaskId) return '';
                      const sourceTask = tasks.find(task => task.id === t.annualPlanTaskId);
                      const kmsUrl = (sourceTask && sourceTask.kmsUrl) || t.kmsUrl;
                      const hasExternalUrl = kmsUrl && kmsUrl !== '#' && kmsUrl.startsWith('http');
                      const linkUrl = hasExternalUrl ? kmsUrl : '#bp/annual-plan';
                      const attrs = hasExternalUrl ? 'target="_blank" rel="noopener noreferrer"' : 'data-navigate="bp/annual-plan"';
                      return `<a href="${linkUrl}" ${attrs} style="font-size:11px;padding:2px 6px;border-radius:4px;background:var(--primary-bg);color:var(--primary);margin-left:6px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;"><span class="icon" data-icon="link" data-icon-size="14"></span> 主KMS链接</a>`;
                    })();
                    const memberList = Array.isArray(t.members) ? t.members.filter(Boolean) : [];
                    const memberNames = memberList.slice(0, 2).map(m => resolvePersonDisplayName(m)).join('、');
                    const memberExtra = memberList.length > 2 ? ` +${memberList.length - 2}` : '';
                    const catalogPath = getCatalogPath(CATALOG_SCOPES.OMP_TASKS, t.catalogId);
                    return `
                      <tr>
                        <td><strong>${t.name}</strong>${sourceTag}${displayLabel ? ` <span style="font-size:11px;padding:2px 6px;border-radius:4px;background:var(--primary-bg);color:var(--primary);margin-left:6px;cursor:help;" title="${escapeHtml(tooltipNames)}">${icon('chartLineUp', {size: 11})} ${escapeHtml(displayLabel)}</span>` : ''}</td>
                        <td class="text-xs-secondary">${catalogPath ? escapeHtml(catalogPath) : '-'}</td>
                        <td>${escapeHtml(window.renderPerson ? window.renderPerson(t.owner) : (t.owner || ''))}</td>
                        <td class="text-xs-secondary">${memberList.length > 0 ? escapeHtml(memberNames + memberExtra) : '-'}</td>
                        <td class="text-center">
                          <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
                            <div class="progress-bar" style="width:60px;"><div class="progress-bar-fill ${t.progress < 50 && t.status !== 'done' ? 'warning' : ''}" style="width:${t.progress}%"></div></div>
                            <span class="text-xs-only">${t.progress}%</span>
                          </div>
                        </td>
                        <td class="text-xs-secondary">${t.endDate}</td>
                        <td class="text-center">
                          <button class="btn btn-sm btn-secondary" data-action="omp-view-task" data-id="${t.id}" class="badge-sm">详情</button>
                          <button class="btn btn-sm btn-primary" data-action="omp-edit-task" data-id="${t.id}" class="badge-sm">编辑</button>
                          <button class="btn btn-sm btn-danger" data-action="omp-delete-task" data-id="${t.id}" class="badge-sm">删除</button>
                        </td>
                      </tr>`;
                  }).join('')}
                  ${filtered.length === 0 ? '<tr><td colspan="7" class="empty-state">暂无匹配数据</td></tr>' : ''}
                </tbody>
              </table>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border-light);font-size:12px;color:var(--text-tertiary);">
              <span>共 ${filtered.length} 项工作</span>
            </div>
          </div>`;
      }

      // ===== 月度关键进展工具函数 =====
      function omp_getCycleMonths() {
        const year = getCurrentCycle().year;
        // 业务年度从 4 月起，展示 4 月 ~ 12 月
        return Array.from({ length: 9 }, (_, i) => {
          const n = i + 4;
          const month = String(n).padStart(2, '0');
          return { key: `${year}-${month}`, label: `${n}月` };
        });
      }

      function omp_isSummaryMonth(key) {
        return key === 'H1' || key === 'YEAR';
      }

      function omp_getSummaryColumns() {
        return [
          { key: 'H1', label: 'H1 总结', summary: true },
          { key: 'YEAR', label: '年终总结', summary: true },
        ];
      }

      function omp_formatMonth(dateStr) {
        if (!dateStr || dateStr.length < 7) return '';
        return dateStr.slice(0, 7);
      }

      function omp_getMonthlyRecord(taskId, month) {
        return omp_load('progressRecords')
          .filter(r => r.taskId === taskId && r.month === month)
          .sort((a, b) => b.date.localeCompare(a.date))[0];
      }

      function omp_getLastDayOfMonth(year, month) {
        const d = new Date(year, month, 0);
        return `${year}-${String(month).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function omp_syncTaskProgressFromRecords(taskId) {
        // 仅聚合逐月记录（YYYY-MM），忽略 H1/年终总结，避免总结覆盖逐月进度
        const records = omp_load('progressRecords').filter(r => r.taskId === taskId && !omp_isSummaryMonth(r.month));
        if (!records.length) return;
        const latest = records.sort((a, b) => b.date.localeCompare(a.date))[0];
        const tasks = omp_load('tasks');
        const task = tasks.find(t => t.id === taskId);
        if (!task || task.progress === latest.progress) return;
        task.progress = latest.progress;
        omp_save('tasks', tasks);
      }

      // ===== Tab 4: 甘特图 =====
      function omp_renderGanttTab() {
        const cycleId = window._dsteState.currentCycleId;
        const tasks = omp_load('tasks').filter(t => t.cycleId === cycleId && t.source === 'omp' && !t.parentId);
        const months = ['4月', '5月', '6月', '7月', '8月', '9月'];
        const statusColors = { planning: 'var(--text-tertiary)', active: 'var(--primary)', at_risk: 'var(--warning)', delayed: 'var(--danger)', done: 'var(--success)', closed: 'var(--text-tertiary)' };
        const ganttRows = tasks.map(t => {
          const start = new Date(t.startDate);
          const end = new Date(t.endDate);
          const startMonth = start.getMonth() + 1;
          const endMonth = end.getMonth() + 1;
          return `
            <div style="display:grid;grid-template-columns:180px repeat(6,1fr);gap:1px;align-items:center;">
              <div style="font-size:13px;font-weight:500;color:var(--text-primary);padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.name}</div>
              ${months.map((m, idx) => {
                const monthNum = idx + 4;
                const isActive = monthNum >= startMonth && monthNum <= endMonth;
                if (!isActive) return `<div style="padding:4px;background:var(--bg-page);min-height:32px;"></div>`;
                return `<div style="padding:4px;background:var(--bg-page);min-height:32px;display:flex;align-items:center;">
                  <div style="width:100%;height:20px;border-radius:4px;position:relative;overflow:hidden;">
                    <div style="position:absolute;inset:0;background:${statusColors[t.status]};opacity:0.15;border-radius:4px;"></div>
                    <div style="width:${t.progress}%;height:100%;background:${statusColors[t.status]};border-radius:4px;position:relative;z-index:1;"></div>
                  </div>
                </div>`;
              }).join('')}
            </div>`;
        }).join('');
        return `
          <div class="card">
            <div class="card-header"><div class="card-title"><span class="icon" data-icon="calendar" data-icon-size="16"></span> 重点工作甘特图 (2026 Q2-Q3)</div></div>
            <div class="overflow-x-auto">
              <div style="min-width:600px;">
                <div style="display:grid;grid-template-columns:180px repeat(6,1fr);gap:1px;border-bottom:1px solid var(--border-light);padding-bottom:8px;margin-bottom:4px;">
                  <div style="font-size:12px;color:var(--text-tertiary);font-weight:600;padding:8px;">工作名称</div>
                  ${months.map(m => `<div style="font-size:12px;color:var(--text-tertiary);font-weight:600;padding:8px;text-align:center;">${m}</div>`).join('')}
                </div>
                <div class="flex-col gap-xs">${ganttRows}</div>
              </div>
            </div>
            <div style="display:flex;gap:16px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border-light);">
              <span class="text-xs-tertiary-flex"><span style="width:12px;height:12px;background:var(--primary);border-radius:2px;"></span>进行中</span>
              <span class="text-xs-tertiary-flex"><span style="width:12px;height:12px;background:var(--warning);border-radius:2px;"></span>有风险</span>
              <span class="text-xs-tertiary-flex"><span style="width:12px;height:12px;background:var(--danger);border-radius:2px;"></span>已延期</span>
              <span class="text-xs-tertiary-flex"><span style="width:12px;height:12px;background:var(--success);border-radius:2px;"></span>已完成</span>
            </div>
          </div>`;
      }

      // ===== Tab 4.x: 月度关键进展 =====
      function omp_renderMonthlyProgressCell(task, month, record) {
        const isSummary = !!month.summary;
        const hasProblems = record && record.problems && record.problems.trim();
        const problemDot = hasProblems
          ? `<span style="position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--danger);"></span>`
          : '';
        const placeholder = isSummary ? '+ 记录总结' : '+ 记录进展';
        const content = record
          ? `<span style="font-size:13px;font-weight:700;color:var(--primary);display:block;margin-bottom:2px;">${record.progress}%</span>
             <span style="font-size:12px;color:var(--text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;">${escapeHtml(record.content)}</span>`
          : `<span style="font-size:12px;color:var(--text-tertiary);display:block;padding-top:4px;">${placeholder}</span>`;
        const summaryStyle = isSummary ? 'background:var(--bg-page);border-style:dashed;' : 'background:var(--bg-card);';
        return `
          <div class="omp-month-cell" data-action="omp-edit-monthly-progress" data-task-id="${task.id}" data-month="${month.key}"
               style="padding:8px;min-height:48px;${summaryStyle}border:1px solid var(--border-light);border-radius:6px;cursor:pointer;position:relative;transition:all 0.15s;"
               title="${record ? escapeHtml(record.content) : (isSummary ? '点击记录总结' : '点击记录进展')}">
            ${problemDot}
            ${content}
          </div>`;
      }

      function omp_renderMonthlyProgressTab() {
        const cycleId = window._dsteState.currentCycleId;
        const tasks = omp_load('tasks').filter(t => t.cycleId === cycleId && t.source === 'omp' && !t.parentId);
        const allMonths = omp_getCycleMonths();
        const year = getCurrentCycle().year;
        const filter = (window._ompState && window._ompState.monthlyFilter) || 'all';
        const visibleMonths = filter === 'all' ? allMonths : allMonths.filter(m => m.key === filter);
        const columns = [...visibleMonths, ...omp_getSummaryColumns()];
        const headerCols = `180px repeat(${columns.length}, 1fr)`;
        const filterOptions = [`<option value="all" ${filter === 'all' ? 'selected' : ''}>全部月份</option>`]
          .concat(allMonths.map(m => `<option value="${m.key}" ${filter === m.key ? 'selected' : ''}>${m.label}</option>`))
          .join('');
        const filterSelect = `<select id="omp-monthly-filter" onchange="window.omp_setMonthlyFilter(this.value)" style="padding:6px 10px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-card);color:var(--text-primary);font-size:13px;">${filterOptions}</select>`;

        if (tasks.length === 0) {
          return `
            <div class="card">
              <div class="card-header" class="flex-between-center">
                <div class="card-title"><span class="icon" data-icon="chart-bar" data-icon-size="16"></span> 重点工作月度关键进展 (${year})</div>
                ${filterSelect}
              </div>
              <div style="padding:60px;text-align:center;color:var(--text-tertiary);">
                <div style="font-size:14px;margin-bottom:8px;">暂无重点工作</div>
                <div class="text-sm-only">请先新建重点工作，再录入月度关键进展</div>
              </div>
            </div>`;
        }

        const rows = tasks.map((t, idx) => {
          return `
            <div style="display:grid;grid-template-columns:${headerCols};gap:4px;align-items:stretch;padding:4px 0;border-bottom:1px solid ${idx % 2 === 0 ? 'transparent' : 'var(--border-light)'};">
              <div style="font-size:13px;font-weight:500;color:var(--text-primary);padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;">${escapeHtml(t.name)}</div>
              ${columns.map(m => {
                const record = omp_getMonthlyRecord(t.id, m.key);
                return `<div style="padding:2px;">${omp_renderMonthlyProgressCell(t, m, record)}</div>`;
              }).join('')}
            </div>`;
        }).join('');

        return `
          <div class="card">
            <div class="card-header" class="flex-between-center">
              <div class="card-title"><span class="icon" data-icon="chart-bar" data-icon-size="16"></span> 重点工作月度关键进展 (${year})</div>
              ${filterSelect}
            </div>
            <div class="overflow-x-auto">
              <div style="min-width:900px;">
                <div style="display:grid;grid-template-columns:${headerCols};gap:4px;border-bottom:1px solid var(--border-light);padding-bottom:8px;margin-bottom:4px;">
                  <div style="font-size:12px;color:var(--text-tertiary);font-weight:600;padding:8px;">工作名称</div>
                  ${columns.map(m => `<div style="font-size:12px;color:var(--text-tertiary);font-weight:600;padding:8px;text-align:center;">${m.label}</div>`).join('')}
                </div>
                <div class="flex-col">${rows}</div>
              </div>
            </div>
            <div style="display:flex;gap:16px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border-light);flex-wrap:wrap;">
              <span class="text-xs-tertiary-flex"><span style="width:12px;height:12px;background:var(--primary);border-radius:2px;"></span>已记录进展</span>
              <span class="text-xs-tertiary-flex"><span style="width:12px;height:12px;background:var(--danger);border-radius:50%;"></span>存在问题</span>
              <span class="text-xs-tertiary-flex"><span style="width:12px;height:12px;border:1px solid var(--border-light);border-radius:2px;background:var(--bg-card);"></span>未记录</span>
              <span class="text-xs-tertiary-flex"><span style="width:12px;height:12px;border:1px dashed var(--border-light);border-radius:2px;background:var(--bg-page);"></span>H1/年终总结</span>
            </div>
          </div>`;
      }

      // ===== Tab 4.5: 资源配置矩阵（MVP：负责人 + 成员） =====
      function resolvePersonDisplayName(personRef) {
        if (!personRef) return '';
        // 兼容 legacy/stale 对象：name 可能是工号，优先按工号回查
        if (personRef && typeof personRef === 'object' && (personRef._legacy || personRef._stale)) {
          const nameOrId = String(personRef.name || '').trim();
          if (nameOrId && typeof getEmployeeById === 'function') {
            const emp = getEmployeeById(nameOrId);
            if (emp) return emp.name || emp.displayName || nameOrId;
          }
          return personRef.name || '';
        }
        const emp = typeof getEmployeeById === 'function' ? getEmployeeById(personRef) : null;
        if (emp) return emp.name || emp.displayName || personRef;
        return window.renderPerson ? window.renderPerson(personRef) : personRef;
      }

      function omp_renderMatrixTab() {
        const cycleId = window._dsteState.currentCycleId;
        const allTasks = omp_load('tasks') || [];
        const tasks = allTasks.filter(t => t && t.cycleId === cycleId && t.source === 'omp' && !t.parentId);
        const filter = window._ompState.taskFilter || { dept: 'all', type: 'all', catalog: 'all' };
        const state = window._ompState.staffingState || { searchQuery: '', dirSearchQuery: '' };
        const depts = ['all', ...new Set(tasks.map(t => t.dept).filter(Boolean))];
        const catalogs = loadCatalogs(CATALOG_SCOPES.OMP_TASKS).filter(c => c.status === 'active');

        let filtered = tasks.filter(t => {
          if (filter.dept !== 'all' && t.dept !== filter.dept) return false;
          if (filter.type !== 'all' && t.type !== filter.type) return false;
          if (filter.catalog !== 'all' && t.catalogId !== filter.catalog) return false;
          if (state.searchQuery) {
            const q = state.searchQuery.toLowerCase();
            return (t.name || '').toLowerCase().includes(q) || resolvePersonDisplayName(t.owner).toLowerCase().includes(q) || (t.members || []).some(m => resolvePersonDisplayName(m).toLowerCase().includes(q));
          }
          return true;
        });

        const rawEmployees = (typeof getEmployees === 'function' ? getEmployees() : []) || [];
        const employees = Array.isArray(rawEmployees) ? rawEmployees.filter(e => e && e.id) : [];
        const dirSearchQuery = (state.dirSearchQuery || '').trim();
        const selectedOrgId = state.selectedOrgId || null;

        // 构建组织架构树（与旧人员配置视图一致的多级树）
        const hasEmployeeData = employees.length > 0;
        const orgTree = hasEmployeeData ? buildOrgHierarchy(employees) : { orgUnits: {}, roots: [] };

        // 矩阵视图默认仅展开「销服团队」一级组织，其他一级组织收起；下级团队全部手动展开
        if (hasEmployeeData && (!state.expandedOrgIds || state.expandedOrgIds.size === 0)) {
          state.expandedOrgIds = new Set();
          orgTree.roots.forEach(rootId => {
            const root = orgTree.orgUnits[rootId];
            if (root && /(营销|销售|服务|销服)/.test(root.name)) {
              state.expandedOrgIds.add(rootId);
            }
          });
        }

        // 通讯录筛选：搜索优先于组织树
        const displayedPeopleBase = employees.slice().sort((a, b) => getDisplayNameLocal(a).localeCompare(getDisplayNameLocal(b), 'zh-CN'));
        let displayedPeople = [];
        if (dirSearchQuery) {
          const searchResults = searchEmployees(dirSearchQuery, 100);
          const matchedIds = new Set(searchResults.map(e => e.id));
          displayedPeople = displayedPeopleBase.filter(emp => matchedIds.has(emp.id));
        } else {
          displayedPeople = displayedPeopleBase;
        }

        // 将人员按组织路径挂到对应组织节点下（取最长匹配路径；匹配不上时按末级名称兜底）
        const peopleByOrgId = {};
        const orgIdByEmployeeId = {};
        let unassignedPeople = [];
        function normalizeOrgPath(path) {
          if (Array.isArray(path)) path = path.filter(Boolean).join(' > ');
          return String(path || '')
            .replace(/[\\／]/g, ' > ')
            .replace(/\s*->\s*/g, ' > ')
            .replace(/\s*—\s*/g, ' > ')
            .replace(/\s+/g, ' ')
            .trim();
        }
        function findBestOrgUnit(empPath, orgUnits) {
          let bestUnit = null;
          let bestLen = 0;
          Object.values(orgUnits).forEach(unit => {
            const unitPath = String(unit.path || '');
            if (unitPath && (empPath === unitPath || empPath.startsWith(unitPath + ' > '))) {
              if (unitPath.length > bestLen) {
                bestUnit = unit;
                bestLen = unitPath.length;
              }
            }
          });
          return bestUnit;
        }
        displayedPeopleBase.forEach(emp => {
          const orgPathFromFields = [emp.l1Org, emp.l1Team, emp.l2Team, emp.l3Team].filter(Boolean).join(' > ');
          const rawOrgPath = emp.orgPath || orgPathFromFields;
          const empPath = normalizeOrgPath(rawOrgPath);
          let bestUnit = findBestOrgUnit(empPath, orgTree.orgUnits);
          if (!bestUnit && emp.orgPath && orgPathFromFields) {
            bestUnit = findBestOrgUnit(normalizeOrgPath(orgPathFromFields), orgTree.orgUnits);
          }
          if (!bestUnit) {
            const segments = empPath.split(' > ').filter(Boolean);
            for (let i = segments.length - 1; i >= 0; i--) {
              const candidate = segments[i];
              const matches = Object.values(orgTree.orgUnits).filter(unit => unit.name === candidate);
              if (matches.length >= 1) {
                bestUnit = matches.reduce((best, unit) => {
                  if (!best) return unit;
                  const bestCommon = Math.min(best.path?.length || 0, empPath.length);
                  const unitCommon = Math.min(unit.path?.length || 0, empPath.length);
                  return unitCommon > bestCommon ? unit : best;
                }, null);
                break;
              }
            }
          }
          if (bestUnit) {
            if (!peopleByOrgId[bestUnit.id]) peopleByOrgId[bestUnit.id] = [];
            peopleByOrgId[bestUnit.id].push(emp);
            orgIdByEmployeeId[emp.id] = bestUnit.id;
          } else {
            unassignedPeople.push(emp);
          }
        });

        function renderAvatarLocal(personRef, size = 32, displayName) {
          const refStr = typeof personRef === 'string' ? personRef : String(personRef || '');
          const rawName = displayName || (window.renderPerson ? window.renderPerson(personRef) : refStr);
          const name = typeof rawName === 'string' ? rawName : String(rawName || '');
          const firstChar = name ? name.charAt(0) : '?';
          const hue = refStr ? (refStr.split('').reduce((a, c) => a + c.charCodeAt(0), 0) % 360) : 200;
          return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:hsl(${hue},65%,45%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:${size * 0.4}px;font-weight:600;flex-shrink:0;" title="${escapeHtml(name)}">${escapeHtml(firstChar)}</div>`;
        }

        function renderMemberChipLocal(personRef, taskId) {
          const displayName = resolvePersonDisplayName(personRef);
          return `
            <span class="omp-matrix-member-chip" draggable="true" data-drag="member-chip" data-person-ref="${escapeHtml(personRef)}" data-task-id="${escapeHtml(taskId)}" style="display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 6px 2px 2px;border-radius:10px;background:var(--bg-page);color:var(--text-secondary);border:1px solid var(--border-light);margin:2px;cursor:grab;" title="${escapeHtml(displayName)}">
              ${renderAvatarLocal(personRef, 16, displayName)}
              <span style="max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(displayName)}</span>
              <span style="cursor:pointer;color:var(--danger);font-weight:700;margin-left:2px;" data-action="omp-staffing-remove-member" data-person-ref="${escapeHtml(personRef)}" data-task-id="${escapeHtml(taskId)}">×</span>
            </span>`;
        }

        function getDisplayNameLocal(emp) {
          if (!emp) return '未知';
          if (typeof emp.name === 'string' && emp.name.trim()) return emp.name.trim();
          if (window.renderPerson) return window.renderPerson(emp.id);
          return String(emp.id || '未知');
        }

        function renderPersonListRowLocal(emp) {
          const personRef = emp.id;
          const displayName = getDisplayNameLocal(emp);
          const orgPath = emp.orgPath || '未指定部门';
          return `
            <div class="omp-staffing-person-row" data-person-ref="${escapeHtml(personRef)}" data-drag="person" draggable="true" title="${escapeHtml(orgPath)}"
              style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:grab;transition:background 0.15s;"
            >
              ${renderAvatarLocal(personRef, 24, displayName)}
              <span style="flex:1;min-width:0;font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(displayName)}">${escapeHtml(displayName)}</span>
              <span style="font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;" title="${escapeHtml(orgPath)}">${escapeHtml(orgPath.split(' > ').slice(-2).join(' / ') || '未指定部门')}</span>
            </div>`;
        }

        function renderPersonListLocal(people, title, limit = 80) {
          if (people.length === 0) {
            return `<div style="padding:24px 12px;text-align:center;color:var(--text-tertiary);font-size:12px;">
              <div class="text-2xl mb-1"><span class="icon" data-icon="user" data-icon-size="14"></span></div>
              <div>暂无人员</div>
            </div>`;
          }
          const displayPeople = people.slice(0, limit);
          const more = people.length > limit ? `<div style="padding:6px 10px;text-align:center;font-size:11px;color:var(--text-muted);">还有 ${people.length - limit} 人，请使用搜索</div>` : '';
          return `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0 10px 6px;">
              <span style="font-size:12px;font-weight:600;color:var(--text-primary);">${escapeHtml(title)}</span>
              <span style="font-size:11px;color:var(--text-muted);">${people.length} 人</span>
            </div>
            <div class="flex-col">${displayPeople.map(emp => renderPersonListRowLocal(emp)).join('')}</div>
            ${more}
          `;
        }

        function renderSearchResultsCompactLocal(people) {
          if (people.length === 0) return `<div style="text-align:center;padding:40px 20px;color:var(--text-tertiary);"><div style="font-size:28px;margin-bottom:8px;"><span class="icon" data-icon="magnifying-glass" data-icon-size="14"></span></div><div class="text-sm-only">无匹配人员</div></div>`;
          return renderPersonListLocal(people, `搜索结果 (${people.length})`, 100);
        }

        function renderOrgTreeLocal(orgId, orgUnits, depth) {
          const unit = orgUnits[orgId];
          if (!unit) return '';
          const hasChildren = Array.isArray(unit.children) && unit.children.length > 0;
          const isExpanded = state.expandedOrgIds ? state.expandedOrgIds.has(orgId) : false;
          const isSelected = state.selectedOrgId === orgId;
          const indent = depth * 14;
          const toggleIcon = hasChildren ? (isExpanded ? '▼' : '▶') : '·';
          const rowClass = 'omp-staffing-org-row' + (isSelected ? ' selected' : '');
          const nameColor = isSelected ? 'var(--primary)' : 'var(--text-primary)';
          const fontWeight = isSelected ? '600' : '400';
          const childrenHtml = hasChildren && isExpanded
            ? `<div style="margin-left:10px;border-left:1px dashed var(--border-color);">${unit.children.map(childId => renderOrgTreeLocal(childId, orgUnits, depth + 1)).join('')}</div>`
            : '';
          return `
            <div class="omp-staffing-org-node" data-org-id="${escapeHtml(orgId)}">
              <div class="${rowClass}" style="display:flex;align-items:center;gap:4px;padding:5px 8px 5px ${8 + indent}px;cursor:pointer;" data-action="omp-staffing-select-org" data-org-id="${escapeHtml(orgId)}">
                <span class="omp-staffing-org-toggle" style="${hasChildren ? '' : 'visibility:hidden;'}" data-action="omp-staffing-toggle-org" data-org-id="${escapeHtml(orgId)}">${toggleIcon}</span>
                <span class="omp-staffing-org-name" style="flex:1;font-size:12px;color:${nameColor};font-weight:${fontWeight};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" data-action="omp-staffing-select-org" data-org-id="${escapeHtml(orgId)}">${escapeHtml(unit.name)}</span>
                <span class="omp-staffing-org-count" style="font-size:10px;color:var(--text-muted);flex-shrink:0;" data-action="omp-staffing-select-org" data-org-id="${escapeHtml(orgId)}">${unit.employeeCount || 0}</span>
              </div>
              ${childrenHtml}
            </div>`;
        }

        function getDescendantOrgIdsLocal(orgId, orgUnits) {
          const ids = new Set();
          const unit = orgUnits[orgId];
          if (!unit) return ids;
          ids.add(orgId);
          if (Array.isArray(unit.children)) {
            unit.children.forEach(childId => {
              getDescendantOrgIdsLocal(childId, orgUnits).forEach(id => ids.add(id));
            });
          }
          return ids;
        }

        // 选中部门下的人员（包含子部门）
        let selectedOrgPeople = [];
        let listTitle = '全部人员';
        if (dirSearchQuery) {
          selectedOrgPeople = displayedPeople;
          listTitle = '搜索结果';
        } else if (state.selectedOrgId && orgTree.orgUnits[state.selectedOrgId]) {
          const targetIds = getDescendantOrgIdsLocal(state.selectedOrgId, orgTree.orgUnits);
          selectedOrgPeople = displayedPeopleBase.filter(emp => targetIds.has(orgIdByEmployeeId[emp.id]));
          listTitle = orgTree.orgUnits[state.selectedOrgId].name + ' 人员';
        } else {
          selectedOrgPeople = displayedPeopleBase.slice();
        }
        selectedOrgPeople.sort((a, b) => getDisplayNameLocal(a).localeCompare(getDisplayNameLocal(b), 'zh-CN'));

        const unassignedHtml = !dirSearchQuery && unassignedPeople.length > 0
          ? `
            <div style="margin-top:8px;border-top:1px solid var(--border-light);padding-top:8px;">
              <div style="font-size:12px;font-weight:600;color:var(--text-secondary);padding:0 10px 6px;">未分配部门 (${unassignedPeople.length})</div>
              ${renderPersonListLocal(unassignedPeople, '未分配部门', 50)}
            </div>`
          : '';

        const orgTreeHtml = hasEmployeeData
          ? `<div style="flex:1;overflow-y:auto;padding-right:2px;">
              ${orgTree.roots.map(id => renderOrgTreeLocal(id, orgTree.orgUnits, 0)).join('')}
              ${unassignedHtml}
            </div>`
          : `<div style="padding:16px 12px;text-align:center;color:var(--text-muted);font-size:12px;line-height:1.6;">
              暂无组织数据<br>请先前往「系统管理 → 人员与组织管理」导入
            </div>`;

        const personListHtml = dirSearchQuery
          ? renderSearchResultsCompactLocal(selectedOrgPeople)
          : renderPersonListLocal(selectedOrgPeople, listTitle);

        function renderMatrixTaskRow(t, { isSubtask = false } = {}) {
          const memberList = (t.members || []).filter(Boolean);
          const ownerCell = t.owner
            ? `<div style="display:flex;align-items:center;gap:4px;">${renderAvatarLocal(t.owner, 20, resolvePersonDisplayName(t.owner))}<span style="font-size:12px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(resolvePersonDisplayName(t.owner))}</span></div>`
            : '<span class="text-xs-tertiary">未分配</span>';
          const membersCell = memberList.length > 0
            ? `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px;">${memberList.map(m => renderMemberChipLocal(m, t.id)).join('')}</div>`
            : '<span class="text-xs-tertiary">—</span>';
          const nameCell = isSubtask
            ? `<td style="padding:8px 10px 8px 32px;font-size:12px;color:var(--text-secondary);min-width:160px;max-width:260px;">
                <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</span>
              </td>`
            : `<td style="padding:8px 10px;font-size:13px;color:var(--text-primary);font-weight:500;min-width:160px;max-width:260px;">
                <div class="flex-row gap-xs">
                  ${omp_hasSubtasks(t.id) ? `<button type="button" data-action="omp-toggle-task-expand" data-id="${t.id}" style="background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:10px;padding:2px;flex-shrink:0;" title="展开/折叠子任务">${window._ompState.taskExpandedIds.has(t.id) ? '▼' : '▶'}</button>` : '<span style="width:16px;flex-shrink:0;"></span>'}
                  <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</span>
                </div>
              </td>`;
          const rowBg = isSubtask ? 'background:var(--bg-page);' : '';
          return `
            <tr style="border-bottom:1px solid var(--border-light);${rowBg}">
              ${nameCell}
              <td style="padding:8px 10px;min-width:120px;max-width:180px;">${ownerCell}</td>
              <td class="omp-matrix-members-cell" data-drop="matrix-member" data-task-id="${t.id}" style="padding:8px 10px;min-width:160px;max-width:320px;vertical-align:top;">${membersCell}</td>
            </tr>`;
        }

        const matrixRows = filtered.map(t => {
          const rows = [renderMatrixTaskRow(t)];
          if (window._ompState.taskExpandedIds.has(t.id)) {
            rows.push(...omp_getSubtasks(t.id).map(s => renderMatrixTaskRow(s, { isSubtask: true })));
          }
          return rows.join('');
        }).join('');

        return `
          <div style="display:flex;flex-direction:column;height:100%;gap:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <select data-action="omp-filter-task" data-filter="dept" class="form-input-compact" class="cursor-pointer-sm">
                  ${depts.map(d => `<option value="${d}" ${filter.dept === d ? 'selected' : ''}>${d === 'all' ? '全部部门' : d}</option>`).join('')}
                </select>
                <select data-action="omp-filter-task" data-filter="type" class="form-input-compact" class="cursor-pointer-sm">
                  <option value="all" ${filter.type === 'all' ? 'selected' : ''}>全部类型</option>
                  <option value="improvement" ${filter.type === 'improvement' ? 'selected' : ''}><span class="icon" data-icon="gear" data-icon-size="14"></span> 业务改进</option>
                  <option value="capability" ${filter.type === 'capability' ? 'selected' : ''}><span class="icon" data-icon="books" data-icon-size="14"></span> 能力建设</option>
                  <option value="risk_response" ${filter.type === 'risk_response' ? 'selected' : ''}><span class="icon" data-icon="warning" data-icon-size="14"></span>️ 风险应对</option>
                  <option value="meeting_resolution" ${filter.type === 'meeting_resolution' ? 'selected' : ''}><span class="icon" data-icon="file-text" data-icon-size="14"></span> 会议决议</option>
                </select>
                <select data-action="omp-filter-task" data-filter="catalog" class="form-input-compact" class="cursor-pointer-sm" style="min-width:140px;">
                  <option value="all" ${filter.catalog === 'all' ? 'selected' : ''}>全部目录</option>
                  ${catalogs.map(c => `<option value="${escapeHtml(c.id)}" ${filter.catalog === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                </select>
                <input type="text" id="omp-matrix-search" placeholder="搜索任务或负责人..." value="${escapeHtml(state.searchQuery || '')}" style="padding:6px 12px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-card);color:var(--text-primary);font-size:13px;min-width:180px;" data-action="omp-staffing-search">
              </div>
              <span class="text-sm-secondary">仅配置成员，负责人在年度规划中设定</span>
            </div>
            <div style="display:flex;gap:16px;flex:1;min-height:0;">
              <div style="width:320px;min-width:320px;display:flex;flex-direction:column;gap:10px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:8px;padding:12px;"
                   id="omp-matrix-address-book">
                <div class="flex-between-center">
                  <h3 class="text-base-primary" class="m-0"><span class="icon" data-icon="clipboard-text" data-icon-size="14"></span> 资源人选</h3>
                </div>
                <div style="height:280px;flex:none;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--bg-page);border:1px solid var(--border-light);border-radius:8px;padding:8px 0;" id="omp-matrix-org-tree">
                  <div style="font-size:12px;font-weight:600;color:var(--text-primary);padding:0 10px 6px;border-bottom:1px solid var(--border-light);margin-bottom:4px;">组织架构</div>
                  ${orgTreeHtml}
                </div>
                <div class="flex-row">
                  <input type="text" id="omp-matrix-dir-search" placeholder="搜索姓名、工号、部门..." value="${escapeHtml(dirSearchQuery)}" style="flex:1;min-width:0;padding:6px 12px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-card);color:var(--text-primary);font-size:13px;" data-action="omp-staffing-dir-search">
                  <button class="btn btn-sm btn-secondary" style="font-size:12px;${dirSearchQuery ? '' : 'visibility:hidden;'}" data-action="omp-staffing-clear-search">清除</button>
                </div>
                <div style="flex:1;min-height:120px;overflow-y:auto;padding:8px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:8px;" id="omp-matrix-person-list">
                  ${personListHtml}
                </div>
              </div>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:8px;padding:12px;overflow:hidden;">
                <h3 class="text-base-primary" class="m-0"><span class="icon" data-icon="users" data-icon-size="14"></span> 人员配置矩阵 (${filtered.length})</h3>
                <div style="flex:1;overflow:auto;">
                  <table style="width:100%;border-collapse:collapse;min-width:600px;">
                    <thead style="position:sticky;top:0;background:var(--bg-card);z-index:1;">
                      <tr style="border-bottom:2px solid var(--border-color);">
                        <th class="text-xs-tertiary" style="padding:8px 10px;text-align:left;font-weight:600;white-space:nowrap;">工作名称</th>
                        <th class="text-xs-tertiary" style="padding:8px 10px;text-align:left;font-weight:600;white-space:nowrap;">负责人</th>
                        <th class="text-xs-tertiary" style="padding:8px 10px;text-align:left;font-weight:600;white-space:nowrap;">成员（可拖拽分配）</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${matrixRows}
                      ${filtered.length === 0 ? '<tr><td colspan="3" style="padding:40px;text-align:center;color:var(--text-tertiary);">暂无匹配任务</td></tr>' : ''}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            <style>
              .omp-matrix-members-cell { transition: all 0.15s; }
              .omp-matrix-members-cell.drop-active { background: var(--primary-bg) !important; border: 1px dashed var(--primary) !important; border-radius: 4px; }
              .omp-matrix-members-cell.drop-ready { background: var(--bg-page); }
              .omp-matrix-member-chip { transition: transform 0.15s, opacity 0.15s; }
              .omp-matrix-member-chip.dragging { opacity: 0.5; }
              .omp-matrix-member-chip.drop-before { position: relative; }
              .omp-matrix-member-chip.drop-before::before { content: ''; position: absolute; left: -3px; top: 0; bottom: 0; width: 3px; background: var(--primary); border-radius: 2px; }
              .omp-matrix-member-chip.drop-after { position: relative; }
              .omp-matrix-member-chip.drop-after::after { content: ''; position: absolute; right: -3px; top: 0; bottom: 0; width: 3px; background: var(--primary); border-radius: 2px; }
              .omp-staffing-org-row { border-radius: 6px; transition: background 0.15s; }
              .omp-staffing-org-row:hover { background: var(--bg-hover); }
              .omp-staffing-org-row.selected { background: var(--primary-bg); }
              .omp-staffing-org-row.selected .omp-staffing-org-name { color: var(--primary); font-weight: 600; }
              .omp-staffing-org-toggle { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 12px; color: var(--text-tertiary); transition: background 0.15s; flex-shrink: 0; }
              .omp-staffing-org-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
              .omp-staffing-person-row { transition: background 0.15s; }
              .omp-staffing-person-row:hover { background: var(--bg-hover); }
              .omp-staffing-person-row.dragging { opacity: 0.5; }
            </style>
          </div>`;
      }

      // ===== Tab 5: 重点工作人员配置台 =====
      function omp_renderTaskStaffingTab() {
        try {
          const cycleId = window._dsteState.currentCycleId;
          const allTasks = omp_load('tasks') || [];
          // PRD v1.8：人员配置台显示当前周期全部重点工作（含年度计划派生任务）
          const tasks = allTasks.filter(t => t && t.cycleId === cycleId && t.source === 'omp');
          const rawEmployees = (typeof getEmployees === 'function' ? getEmployees() : []) || [];
          const employees = Array.isArray(rawEmployees) ? rawEmployees.filter(e => e && e.id) : [];
          const taskPersonRefs = new Set();
          tasks.forEach(t => {
            if (t.owner) taskPersonRefs.add(t.owner);
            (t.members || []).forEach(m => { if (m) taskPersonRefs.add(m); });
          });
          const employeeIds = new Set(employees.map(e => e.id));
          const pseudoEmployees = Array.from(taskPersonRefs)
            .filter(ref => !employeeIds.has(ref))
            .map(ref => ({ id: ref, name: window.renderPerson ? window.renderPerson(ref) : ref }));
          const allPeople = [...employees, ...pseudoEmployees];
          const state = window._ompState.staffingState || { searchQuery: '', dirSearchQuery: '', selectedOrgId: null, expandedOrgIds: new Set() };
          const filter = window._ompState.taskFilter || { dept: 'all', type: 'all' };

          const depts = ['all', ...new Set(tasks.map(t => t.dept).filter(Boolean))];

          let filtered = tasks.filter(t => {
            if (filter.dept !== 'all' && t.dept !== filter.dept) return false;
            if (filter.type !== 'all' && t.type !== filter.type) return false;
            if (state.searchQuery) {
              const q = state.searchQuery.toLowerCase();
              const nameMatch = (t.name || '').toLowerCase().includes(q);
              const ownerMatch = resolvePersonDisplayName(t.owner).toLowerCase().includes(q);
              const memberMatch = (t.members || []).some(m => resolvePersonDisplayName(m).toLowerCase().includes(q));
              return nameMatch || ownerMatch || memberMatch;
            }
            return true;
          });

          // PRD v1.8：人员列表默认按姓名升序，本期不做推荐排序
          const displayedPeopleBase = allPeople.slice().sort((a, b) => getDisplayName(a).localeCompare(getDisplayName(b), 'zh-CN'));

          // 构建组织架构树
          const hasEmployeeData = employees.length > 0;
          const orgTree = hasEmployeeData ? buildOrgHierarchy(employees) : { orgUnits: {}, roots: [] };
          // PRD v1.8 企业微信风格：默认只展示一级部门，全部折叠，由用户逐层展开
          // state.expandedOrgIds 为空即表示全部折叠

          // 通讯录筛选：搜索优先于组织树
          const dirSearchQuery = (state.dirSearchQuery || '').trim();
          let displayedPeople = [];
          if (dirSearchQuery) {
            const searchResults = searchEmployees(dirSearchQuery, 100);
            const matchedIds = new Set(searchResults.map(e => e.id));
            displayedPeople = displayedPeopleBase.filter(emp => matchedIds.has(emp.id));
          }

          // 将人员按组织路径挂到对应组织节点下（取最长匹配路径；匹配不上时按末级名称兜底）
          const peopleByOrgId = {};
          const orgIdByEmployeeId = {};
          let unassignedPeople = [];
          function normalizeOrgPath(path) {
            if (Array.isArray(path)) path = path.filter(Boolean).join(' > ');
            return String(path || '')
              .replace(/[\\/／]/g, ' > ')
              .replace(/\s*->\s*/g, ' > ')
              .replace(/\s*—\s*/g, ' > ')
              .replace(/\s+/g, ' ')
              .trim();
          }
          function findBestOrgUnit(empPath, orgUnits) {
            let bestUnit = null;
            let bestLen = 0;
            Object.values(orgUnits).forEach(unit => {
              const unitPath = String(unit.path || '');
              if (unitPath && (empPath === unitPath || empPath.startsWith(unitPath + ' > '))) {
                if (unitPath.length > bestLen) {
                  bestUnit = unit;
                  bestLen = unitPath.length;
                }
              }
            });
            return bestUnit;
          }
          displayedPeopleBase.forEach(emp => {
            // 优先使用 orgPath；若为空或无法匹配，用 l1Org/l1Team/l2Team/l3Team 兜底
            const orgPathFromFields = [emp.l1Org, emp.l1Team, emp.l2Team, emp.l3Team].filter(Boolean).join(' > ');
            const rawOrgPath = emp.orgPath || orgPathFromFields;
            const empPath = normalizeOrgPath(rawOrgPath);
            let bestUnit = findBestOrgUnit(empPath, orgTree.orgUnits);
            // 若 orgPath 未匹配，尝试用字段拼接路径再次匹配
            if (!bestUnit && emp.orgPath && orgPathFromFields) {
              bestUnit = findBestOrgUnit(normalizeOrgPath(orgPathFromFields), orgTree.orgUnits);
            }
            // 兜底：按组织路径末级名称匹配；若末级有重复，按各级名称逐级向上匹配
            if (!bestUnit) {
              const segments = empPath.split(' > ').filter(Boolean);
              for (let i = segments.length - 1; i >= 0; i--) {
                const candidate = segments[i];
                const matches = Object.values(orgTree.orgUnits).filter(unit => unit.name === candidate);
                if (matches.length >= 1) {
                  // 同名节点过多时，优先选择路径前缀与 empPath 重合度最高的
                  bestUnit = matches.reduce((best, unit) => {
                    if (!best) return unit;
                    const bestCommon = Math.min(best.path?.length || 0, empPath.length);
                    const unitCommon = Math.min(unit.path?.length || 0, empPath.length);
                    return unitCommon > bestCommon ? unit : best;
                  }, null);
                  break;
                }
              }
            }
            if (bestUnit) {
              if (!peopleByOrgId[bestUnit.id]) peopleByOrgId[bestUnit.id] = [];
              peopleByOrgId[bestUnit.id].push(emp);
              orgIdByEmployeeId[emp.id] = bestUnit.id;
            } else {
              unassignedPeople.push(emp);
            }
          });
          // 调试日志：帮助排查真实数据下人员未显示的问题
          console.log('[OMP Staffing] employees:', employees.length, 'orgUnits:', Object.keys(orgTree.orgUnits).length, 'unassigned:', unassignedPeople.length, 'mapped total:', Object.values(peopleByOrgId).reduce((a, b) => a + b.length, 0));

          function renderAvatar(personRef, size = 32, displayName) {
            const refStr = typeof personRef === 'string' ? personRef : (personRef && typeof personRef.toString === 'function' ? personRef.toString() : String(personRef || ''));
            const rawName = displayName || (window.renderPerson ? window.renderPerson(personRef) : refStr);
            const name = typeof rawName === 'string' ? rawName : String(rawName || '');
            const firstChar = name ? name.charAt(0) : '?';
            const hue = refStr ? (refStr.split('').reduce((a, c) => a + c.charCodeAt(0), 0) % 360) : 200;
            return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:hsl(${hue},65%,45%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:${size * 0.4}px;font-weight:600;flex-shrink:0;" title="${escapeHtml(name)}">${escapeHtml(firstChar)}</div>`;
          }

          function renderOrgTree(orgId, orgUnits, depth) {
            const unit = orgUnits[orgId];
            if (!unit) return '';
            const hasChildren = Array.isArray(unit.children) && unit.children.length > 0;
            const isExpanded = state.expandedOrgIds.has(orgId);
            const isSelected = state.selectedOrgId === orgId;
            const indent = depth * 14;
            const toggleIcon = hasChildren ? (isExpanded ? '▼' : '▶') : '·';
            const rowClass = 'omp-staffing-org-row' + (isSelected ? ' selected' : '');
            const nameColor = isSelected ? 'var(--primary)' : 'var(--text-primary)';
            const fontWeight = isSelected ? '600' : '400';
            const childrenHtml = hasChildren && isExpanded
              ? `<div style="margin-left:10px;border-left:1px dashed var(--border-color);">${unit.children.map(childId => renderOrgTree(childId, orgUnits, depth + 1)).join('')}</div>`
              : '';
            return `
              <div class="omp-staffing-org-node" data-org-id="${escapeHtml(orgId)}">
                <div class="${rowClass}" style="display:flex;align-items:center;gap:4px;padding:5px 8px 5px ${8 + indent}px;cursor:pointer;" data-action="omp-staffing-select-org" data-org-id="${escapeHtml(orgId)}">
                  <span class="omp-staffing-org-toggle" style="${hasChildren ? '' : 'visibility:hidden;'}" data-action="omp-staffing-toggle-org" data-org-id="${escapeHtml(orgId)}">${toggleIcon}</span>
                  <span class="omp-staffing-org-name" style="flex:1;font-size:12px;color:${nameColor};font-weight:${fontWeight};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" data-action="omp-staffing-select-org" data-org-id="${escapeHtml(orgId)}">${escapeHtml(unit.name)}</span>
                  <span class="omp-staffing-org-count" style="font-size:10px;color:var(--text-muted);flex-shrink:0;" data-action="omp-staffing-select-org" data-org-id="${escapeHtml(orgId)}">${unit.employeeCount || 0}</span>
                </div>
                ${childrenHtml}
              </div>`;
          }

          function getDisplayName(emp) {
            if (!emp) return '未知';
            if (typeof emp.name === 'string' && emp.name.trim()) return emp.name.trim();
            if (window.renderPerson) return window.renderPerson(emp.id);
            return String(emp.id || '未知');
          }

          function renderCompactPersonCard(emp, depth = 0) {
            return renderPersonCard(emp, { depth, variant: 'tree' });
          }

          function renderSearchResultCard(emp) {
            return renderPersonCard(emp, { variant: 'search' });
          }

          function renderPersonListRow(emp) {
            const personRef = emp.id;
            const displayName = getDisplayName(emp);
            const orgPath = emp.orgPath || '未指定部门';
            return `
              <div class="omp-staffing-person-row" data-person-ref="${escapeHtml(personRef)}" data-drag="person" draggable="true" title="${escapeHtml(orgPath)}"
                style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:grab;transition:background 0.15s;"
              >
                ${renderAvatar(personRef, 24, displayName)}
                <span style="flex:1;min-width:0;font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"
                  title="${escapeHtml(displayName)}"
                >${escapeHtml(displayName)}</span>
                <span style="font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;"
                  title="${escapeHtml(orgPath)}"
                >${escapeHtml(orgPath.split(' > ').slice(-2).join(' / ') || '未指定部门')}</span>
              </div>`;
          }

          function renderPersonCard(emp, { depth = 0, variant = 'tree' } = {}) {
            const personRef = emp.id;
            const displayName = getDisplayName(emp);
            const orgPath = emp.orgPath || '未指定部门';
            const deptBadge = orgPath.split(' > ').filter(Boolean).slice(-2).join(' / ') || '未指定部门';
            const indent = depth * 14;
            const isSearch = variant === 'search';
            const avatarSize = isSearch ? 32 : 28;
            const padding = isSearch ? '10px' : '8px 10px';
            const badgeHtml = !isSearch
              ? `<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:var(--bg-page);color:var(--text-secondary);border:1px solid var(--border-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;" title="${escapeHtml(orgPath)}">${escapeHtml(deptBadge)}</span>`
              : '';
            const pathHtml = isSearch
              ? `<div style="font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(orgPath)}">${escapeHtml(orgPath)}</div>`
              : '';
            return `
              <div class="omp-staffing-person-card" data-person-ref="${escapeHtml(personRef)}" data-drag="person" draggable="true" style="padding:${padding};border:1px solid var(--border-light);border-radius:8px;background:var(--bg-card);cursor:grab;transition:all 0.15s;margin:2px 0;${depth > 0 ? 'margin-left:' + indent + 'px;' : ''}">
                <div style="display:flex;align-items:center;gap:8px;pointer-events:none;">
                  ${renderAvatar(personRef, avatarSize)}
                  <div class="flex-1" class="min-width-0">
                    <div class="flex-row gap-xs flex-wrap">
                      <span style="font-weight:600;color:var(--text-primary);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;" title="${escapeHtml(displayName)}">${escapeHtml(displayName)}</span>
                      ${badgeHtml}
                    </div>
                    ${pathHtml}
                  </div>
                </div>
              </div>`;
          }

          function renderMemberChip(personRef) {
            const displayName = resolvePersonDisplayName(personRef);
            return `
              <span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 6px 2px 2px;border-radius:10px;background:var(--bg-page);color:var(--text-secondary);border:1px solid var(--border-light);margin:2px;" title="${escapeHtml(displayName)}">
                ${renderAvatar(personRef, 16, displayName)}
                <span style="max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(displayName)}</span>
                <span style="cursor:pointer;color:var(--danger);font-weight:700;margin-left:2px;" data-action="omp-staffing-remove-member" data-person-ref="${escapeHtml(personRef)}">×</span>
              </span>`;
          }

          function renderTaskCard(t, { isSubtask = false, parentExpanded = false } = {}) {
            const memberList = (t.members || []).filter(Boolean);
            const ownerAvatar = t.owner ? renderAvatar(t.owner, 20, resolvePersonDisplayName(t.owner)) : '';
            const memberChips = memberList.map(m => renderMemberChip(m)).join('');
            const extraMembers = memberList.length > 3 ? `<span style="font-size:11px;color:var(--text-tertiary);margin-left:2px;">+${memberList.length - 3}</span>` : '';
            const hasSubtasks = omp_hasSubtasks(t.id);
            const expandIcon = window._ompState.taskExpandedIds.has(t.id) ? '▼' : '▶';
            return `
              <div class="omp-staffing-task-card ${isSubtask ? 'omp-staffing-subtask-card' : ''}" data-drop="task" data-task-id="${t.id}" style="padding:8px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-card);transition:all 0.15s;${isSubtask ? 'margin-left:24px;border-color:var(--border-color);background:var(--bg-page);' : ''}">
                <div style="display:flex;align-items:flex-start;gap:8px;">
                  ${!isSubtask && hasSubtasks ? `<button type="button" data-action="omp-toggle-task-expand" data-id="${t.id}" style="background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:12px;padding:4px;margin-top:2px;flex-shrink:0;" title="展开/折叠子任务">${expandIcon}</button>` : ''}
                  ${isSubtask ? '<span style="width:18px;flex-shrink:0;"></span>' : ''}
                  <div class="flex-1" class="min-width-0">
                    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;">
                      <span style="font-weight:600;color:var(--text-primary);font-size:${isSubtask ? '12px' : '13px'};line-height:1.4;">${escapeHtml(t.name)}</span>
                    </div>
                    <div class="flex-row gap-xs flex-wrap">
                      <span class="text-xxs-tertiary">负责人:</span>
                      ${t.owner ? `<div style="display:flex;align-items:center;gap:4px;">${ownerAvatar}<span style="font-size:12px;color:var(--text-primary);">${escapeHtml(resolvePersonDisplayName(t.owner))}</span></div>` : '<span class="text-xs-tertiary">未分配</span>'}
                    </div>
                    ${memberList.length > 0 ? `
                    <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px;">
                      <span class="text-xxs-tertiary">成员:</span>
                      <div style="display:flex;align-items:center;gap:2px;flex-wrap:wrap;">${memberChips}${extraMembers}</div>
                    </div>` : ''}
                  </div>
                </div>
              </div>`;
          }

          const parentTasks = filtered.filter(t => !t.parentId);
          const taskCards = parentTasks.map(t => {
            const card = renderTaskCard(t);
            const expanded = window._ompState.taskExpandedIds.has(t.id);
            const subCards = expanded ? omp_getSubtasks(t.id).map(s => renderTaskCard(s, { isSubtask: true })).join('') : '';
            return card + subCards;
          }).join('');

          const unassignedHtml = !dirSearchQuery && unassignedPeople.length > 0
            ? `
              <div style="margin-top:8px;border-top:1px solid var(--border-light);padding-top:8px;">
                <div style="font-size:12px;font-weight:600;color:var(--text-secondary);padding:0 10px 6px;">未分配部门 (${unassignedPeople.length})</div>
                ${unassignedPeople.map(emp => renderSearchResultCard(emp)).join('')}
              </div>`
            : '';

          const orgTreeHtml = hasEmployeeData
            ? `<div style="flex:1;overflow-y:auto;padding-right:2px;">
                ${orgTree.roots.map(id => renderOrgTree(id, orgTree.orgUnits, 0)).join('')}
                ${unassignedHtml}
              </div>`
            : `<div style="padding:16px 12px;text-align:center;color:var(--text-muted);font-size:12px;line-height:1.6;">
                暂无组织数据<br>请先前往「系统管理 → 人员与组织管理」导入
              </div>`;

          function getDescendantOrgIds(orgId, orgUnits) {
            const ids = new Set();
            const unit = orgUnits[orgId];
            if (!unit) return ids;
            ids.add(orgId);
            if (Array.isArray(unit.children)) {
              unit.children.forEach(childId => {
                getDescendantOrgIds(childId, orgUnits).forEach(id => ids.add(id));
              });
            }
            return ids;
          }

          function renderPersonList(people, title, limit = 80) {
            if (people.length === 0) {
              return `<div style="padding:24px 12px;text-align:center;color:var(--text-tertiary);font-size:12px;">
                <div class="text-2xl mb-1"><span class="icon" data-icon="user" data-icon-size="14"></span></div>
                <div>暂无人员</div>
              </div>`;
            }
            const displayPeople = people.slice(0, limit);
            const more = people.length > limit ? `<div style="padding:6px 10px;text-align:center;font-size:11px;color:var(--text-muted);">还有 ${people.length - limit} 人，请使用搜索</div>` : '';
            return `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:0 10px 6px;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);">${escapeHtml(title)}</span>
                <span style="font-size:11px;color:var(--text-muted);">${people.length} 人</span>
              </div>
              <div class="flex-col">${displayPeople.map(emp => renderPersonListRow(emp)).join('')}</div>
              ${more}
            `;
          }

          function renderSearchResultsCompact(people) {
            if (people.length === 0) return `<div style="text-align:center;padding:40px 20px;color:var(--text-tertiary);"><div style="font-size:28px;margin-bottom:8px;"><span class="icon" data-icon="magnifying-glass" data-icon-size="14"></span></div><div class="text-sm-only">无匹配人员</div></div>`;
            return renderPersonList(people, `搜索结果 (${people.length})`, 100);
          }

          // 选中部门下的人员（包含子部门）
          let selectedOrgPeople = [];
          let listTitle = '全部人员';
          if (dirSearchQuery) {
            selectedOrgPeople = displayedPeople;
            listTitle = '搜索结果';
          } else if (state.selectedOrgId && orgTree.orgUnits[state.selectedOrgId]) {
            const targetIds = getDescendantOrgIds(state.selectedOrgId, orgTree.orgUnits);
            selectedOrgPeople = displayedPeopleBase.filter(emp => targetIds.has(orgIdByEmployeeId[emp.id]));
            listTitle = orgTree.orgUnits[state.selectedOrgId].name + ' 人员';
          } else {
            selectedOrgPeople = displayedPeopleBase.slice();
          }
          selectedOrgPeople.sort((a, b) => getDisplayName(a).localeCompare(getDisplayName(b), 'zh-CN'));

          const personListHtml = dirSearchQuery
            ? renderSearchResultsCompact(selectedOrgPeople)
            : (state.selectedOrgId
                ? renderPersonList(selectedOrgPeople, listTitle)
                : `<div style="padding:24px 12px;text-align:center;color:var(--text-tertiary);font-size:12px;">
                    <div class="text-2xl mb-1"><span class="icon" data-icon="building" data-icon-size="14"></span></div>
                    <div>点击上方部门查看人员</div>
                  </div>`);

          return `
            <div style="display:flex;flex-direction:column;gap:12px;height:calc(100vh - 200px);min-height:500px;">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:10px;">
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">

              .omp-staffing-org-row.selected .omp-staffing-org-name { color: var(--primary); font-weight: 600; }

                width: 20px;

              .omp-staffing-person-card.dragging { opacity: 0.5; }
